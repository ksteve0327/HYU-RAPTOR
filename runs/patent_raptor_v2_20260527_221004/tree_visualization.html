<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAPTOR Tree Visualization</title>
<style>
:root {
  color-scheme: light;
  --bg: #f7f8fb;
  --panel: #ffffff;
  --ink: #172033;
  --muted: #5e6b80;
  --line: #cbd5e1;
  --strong-line: #64748b;
  --accent: #2563eb;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
}
header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 18px;
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid #d8dee9;
  backdrop-filter: blur(8px);
}
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.zoom-controls {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  background: #fff;
  padding: 4px;
}
.zoom-controls button {
  min-width: 36px;
  padding: 5px 8px;
}
.zoom-level {
  min-width: 50px;
  text-align: center;
  font-size: 13px;
  color: #334155;
  font-weight: 700;
}
.panel-toggle {
  min-width: 72px;
}
h1 {
  margin: 0;
  font-size: 19px;
  line-height: 1.2;
}
.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-top: 3px;
}
.layout {
  display: grid;
  grid-template-columns: minmax(280px, 360px) minmax(0, 1fr) minmax(300px, 380px);
  height: calc(100vh - 64px);
  min-height: 0;
  overflow: hidden;
}
.layout.left-collapsed {
  grid-template-columns: 0 minmax(0, 1fr) minmax(300px, 380px);
}
.layout.right-collapsed {
  grid-template-columns: minmax(280px, 360px) minmax(0, 1fr) 0;
}
.layout.left-collapsed.right-collapsed {
  grid-template-columns: 0 minmax(0, 1fr) 0;
}
aside, .details {
  background: var(--panel);
  border-right: 1px solid #d8dee9;
  padding: 16px;
  overflow: auto;
  height: 100%;
  max-height: 100%;
}
.layout.left-collapsed aside,
.layout.right-collapsed .details {
  padding: 0;
  border: 0;
  overflow: hidden;
}
.details {
  border-right: 0;
  border-left: 1px solid #d8dee9;
}
main {
  min-width: 0;
  min-height: 0;
  height: 100%;
  overflow: auto;
  overscroll-behavior: contain;
  cursor: grab;
  user-select: none;
  background:
    linear-gradient(90deg, rgba(100,116,139,.10) 1px, transparent 1px),
    linear-gradient(rgba(100,116,139,.08) 1px, transparent 1px);
  background-size: 40px 40px;
}
main.panning {
  cursor: grabbing;
}
.controls {
  display: grid;
  gap: 12px;
}
.qa-panel {
  display: grid;
  gap: 10px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid #d8dee9;
}
.qa-summary {
  border: 1px solid #d8dee9;
  border-radius: 8px;
  background: #fbfdff;
  padding: 10px;
  font-size: 12px;
  color: #334155;
}
.qa-summary strong {
  color: #172033;
}
label {
  display: grid;
  gap: 6px;
  color: #334155;
  font-size: 13px;
  font-weight: 650;
}
input, select {
  width: 100%;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  padding: 8px 9px;
  font: inherit;
  color: var(--ink);
  background: #fff;
}
button {
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  padding: 8px 10px;
  font: inherit;
  color: var(--ink);
  background: #fff;
  cursor: pointer;
}
button:hover { border-color: #94a3b8; background: #f8fafc; }
.button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 14px 0;
}
.stat {
  border: 1px solid #d8dee9;
  border-radius: 8px;
  padding: 10px;
  background: #fbfdff;
}
.stat strong {
  display: block;
  font-size: 20px;
}
.stat span {
  color: var(--muted);
  font-size: 12px;
}
.legend, .layer-list {
  margin-top: 16px;
  display: grid;
  gap: 8px;
}
.legend h3, .layer-list h3 {
  margin-bottom: 2px;
}
.legend-note {
  font-size: 12px;
  color: #64748b;
  line-height: 1.35;
}
.legend-row, .layer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
}
.swatch {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 1px solid rgba(15,23,42,.25);
  flex: 0 0 auto;
}
.legend-name {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.legend-name span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
svg {
  display: block;
  min-width: 100%;
  transform-origin: 0 0;
}
.edge {
  fill: none;
  stroke: var(--line);
  stroke-width: 1.2;
}
.edge.highlight {
  stroke: var(--accent);
  stroke-width: 2.2;
}
.node circle {
  stroke: #263241;
  stroke-width: 1.1;
  cursor: pointer;
}
.node.summary circle {
  stroke-width: 1.5;
}
.node.selected circle {
  stroke: var(--accent);
  stroke-width: 3;
}
.node.qa-path circle {
  stroke: #475569;
  stroke-dasharray: 4 2;
  stroke-width: 2;
}
.node.source circle {
  stroke: #111827;
  stroke-dasharray: none;
  stroke-width: 3.4;
}
.node.expected circle {
  stroke: #dc2626;
  stroke-dasharray: none;
  stroke-width: 3.4;
}
.node.source.expected circle {
  stroke: #16a34a;
  stroke-width: 4;
}
.node.match circle {
  stroke: #dc2626;
  stroke-width: 3;
}
.source-rank {
  font-size: 10px;
  font-weight: 800;
  fill: #111827;
  pointer-events: none;
}
.node text {
  font-size: 11px;
  dominant-baseline: central;
  pointer-events: none;
  fill: #1f2937;
}
.node .muted-label {
  fill: #64748b;
}
.column-label {
  font-size: 12px;
  font-weight: 700;
  fill: #475569;
}
.empty {
  padding: 18px;
  color: var(--muted);
}
.details h2 {
  margin: 0 0 8px;
  font-size: 18px;
}
.detail-kv {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 6px 10px;
  margin: 12px 0;
  font-size: 13px;
}
.detail-kv dt {
  color: var(--muted);
}
.detail-kv dd {
  margin: 0;
  min-width: 0;
  overflow-wrap: anywhere;
}
.bar {
  display: grid;
  gap: 5px;
  margin: 12px 0 16px;
}
.bar-row {
  display: grid;
  grid-template-columns: 74px 1fr 34px;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.bar-track {
  height: 9px;
  border-radius: 999px;
  background: #e2e8f0;
  overflow: hidden;
}
.bar-fill {
  height: 100%;
  border-radius: inherit;
}
.preview {
  white-space: pre-wrap;
  font-size: 13px;
  color: #263241;
  line-height: 1.5;
  border: 1px solid #d8dee9;
  border-radius: 8px;
  background: #fbfdff;
  padding: 10px;
  max-height: 240px;
  overflow: auto;
}
.leaf-list {
  display: grid;
  gap: 8px;
  margin-top: 10px;
}
.connected-leaves {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 6px;
  margin-top: 10px;
  max-height: 220px;
  overflow: auto;
}
.connected-leaf {
  border: 1px solid #d8dee9;
  border-radius: 7px;
  padding: 7px;
  background: #fbfdff;
  font-size: 12px;
  color: #334155;
}
.connected-leaf strong {
  display: block;
  color: #111827;
}
.leaf-item {
  border: 1px solid #d8dee9;
  border-radius: 7px;
  padding: 8px;
  background: #fbfdff;
  font-size: 12px;
}
.leaf-item strong {
  display: block;
  margin-bottom: 2px;
}
.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 12px;
}
.badge {
  display: inline-flex;
  align-items: center;
  border: 1px solid #cbd5e1;
  border-radius: 999px;
  padding: 3px 8px;
  background: #fff;
  color: #334155;
  font-size: 12px;
}
.badge.source { border-color: #111827; color: #111827; }
.badge.expected { border-color: #dc2626; color: #991b1b; }
.outline-legend {
  display: grid;
  gap: 7px;
  margin-top: 10px;
}
.outline-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #334155;
}
.outline-swatch {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid #94a3b8;
  flex: 0 0 auto;
}
.outline-swatch.source { border-color: #111827; }
.outline-swatch.expected { border-color: #dc2626; }
.outline-swatch.both { border-color: #16a34a; }
.outline-swatch.path {
  border-color: #475569;
  border-style: dashed;
}
@media (max-width: 1050px) {
  .layout { grid-template-columns: 1fr; }
  aside, .details { max-height: none; border-left: 0; border-right: 0; border-bottom: 1px solid #d8dee9; }
  main { min-height: 620px; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>RAPTOR Tree Visualization</h1>
    <div class="subtitle">Interactive view of summary nodes, leaf patents, parent-child edges, and category mix.</div>
  </div>
  <div class="header-actions">
    <button id="leftPanelButton" class="panel-toggle" type="button">Hide left</button>
    <div class="zoom-controls" aria-label="Zoom controls">
      <button id="zoomOutButton" type="button" title="Zoom out">-</button>
      <span id="zoomLevel" class="zoom-level">100%</span>
      <button id="zoomInButton" type="button" title="Zoom in">+</button>
      <button id="zoomResetButton" type="button" title="Reset zoom">100%</button>
    </div>
    <button id="rightPanelButton" class="panel-toggle" type="button">Hide right</button>
    <button id="fitButton" type="button">Fit view</button>
  </div>
</header>
<div class="layout" id="layoutRoot">
  <aside>
    <div class="controls">
      <label>Search node, patent id, title, category
        <input id="searchBox" type="search" placeholder="e.g. 15-615713, retrieval, AA">
      </label>
      <label>Visible depth
        <select id="depthSelect">
          <option value="summary" selected>Summary groups only</option>
          <option value="all">All leaves</option>
          <option value="full">Full tree (200 patent IDs)</option>
          <option value="roots">Roots only</option>
        </select>
      </label>
      <div class="button-row">
        <button id="expandAll" type="button">Expand all</button>
        <button id="collapseAll" type="button">Collapse summaries</button>
      </div>
    </div>
    <div class="qa-panel" id="qaControls"></div>
    <div class="qa-summary" id="qaSummary"></div>
    <div class="stats" id="stats"></div>
    <div class="layer-list" id="layers"></div>
    <div class="legend" id="legend"></div>
  </aside>
  <main id="canvasWrap">
    <svg id="treeSvg" role="img" aria-label="RAPTOR tree structure"></svg>
  </main>
  <section class="details" id="details">
    <div class="empty">Select a node to inspect its summary text, child count, category mix, and sample patents.</div>
  </section>
</div>

_counts": {"AA": 1}, "patent_id": "15-779219", "title": "Method and system for generating an output image from a plurality of corresponding input image channels", "text_preview": "A method and system for generating an output image from a plurality, N, of corresponding input image channels is described. A Jacobian matrix of the plurality of corresponding input image channels is determined. The principal characteristic vector of the outer product of the Jacobian matrix is calculated. The sign associated with the principal characteristic vector is set whereby an input image channel pixel projected by the principal characteristic vector results in a positive scalar value. The output image as a per-pixel projection of the input channels in the direction of the principal characteristic vector is generated.", "label": "15-779219 - Method and system for generating an output image from a plurali...", "leaf_samples": [{"index": 1, "patent_id": "15-779219", "title": "Method and system for generating an output image from a plurality of corresponding input image channels", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "2", "index": 2, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "16-009456", "title": "Methods and arrangements to quantize a neural network with machine learning", "text_preview": "Logic may quantize a primary neural network. Logic may generate, by a secondary neural network logic circuitry for a primary neural network logic circuitry, quantization parameters. The primary neural network logic circuitry may comprise a primary neural network with multiple layers trainable with an objective function. Each of the multiple layers of the primary neural network may comprise multiple tensors. The secondary neural network logic circuitry may comprise one or more secondary neural networks trainable with the objective function to output the quantization parameters to the tensors.", "label": "16-009456 - Methods and arrangements to quantize a neural network with mach...", "leaf_samples": [{"index": 2, "patent_id": "16-009456", "title": "Methods and arrangements to quantize a neural network with machine learning", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "3", "index": 3, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "16-245406", "title": "Vector computation unit in a neural network processor", "text_preview": "A circuit for performing neural network computations for a neural network comprising a plurality of layers, the circuit comprising: activation circuitry configured to receive a vector of accumulated values and configured to apply a function to each accumulated value to generate a vector of activation values; and normalization circuitry coupled to the activation circuitry and configured to generate a respective normalized value from each activation value.", "label": "16-245406 - Vector computation unit in a neural network processor", "leaf_samples": [{"index": 3, "patent_id": "16-245406", "title": "Vector computation unit in a neural network processor", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "4", "index": 4, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "16-370570", "title": "Time-division multiplexed neurosynaptic module with implicit memory addressing for implementing a neural network", "text_preview": "Embodiments of the invention relate to a time-division multiplexed neurosynaptic module with implicit memory addressing f id": "16-507493", "title": "Non-volatile memory device including arithmetic circuitry for neural network processing and neural network system including the same", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "6", "index": 6, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "16-553537", "title": "Spiking neural unit", "text_preview": "Devices and methods related to spiking neural units in memory. One device includes a memory array and a complementary metal-oxide semiconductor (CMOS) coupled to the memory array and located under the memory array, wherein the CMOS includes a spiking neural unit comprising logic configured to receive an input to increase a weight stored in a memory cell of the memory array, collect the weight from the memory cell of the memory array, accumulate the weight with an increase based on the input, compare the accumulated weight to a threshold weight, and provide an output in response to the accumulated weight being greater than the threshold weight.", "label": "16-553537 - Spiking neural unit", "leaf_samples": [{"index": 6, "patent_id": "16-553537", "title": "Spiking neural unit", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "7", "index": 7, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "16-905541", "title": "Optimizing machine learning model performance", "text_preview": "Certain aspects of the present disclosure provide techniques for receiving data defining a neural network; analyzing the data to determine a depth-first cut point for a depth-first traversal portion of an overall network traversal; performing depth-first traversal for the depth-first portion of the overall network traversal; and performing layer-based traversal for a layer-based portion of the overall network traversal.", "label": "16-905541 - Optimizing machine learning model performance", "leaf_samples": [{"index": 7, "patent_id": "16-905541", "title": "Optimizing machine learning model performance", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "8", "index": 8, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "16-973087", "title": "Hardware circuit for accelerating neural network computations", "text_preview": "Methods, systems, and apparatus, including computer-readable media, are described for a hardware circuit configured to implement a neural network. The circuit includes multiple super tiles. Each super tile includes a unified memory for storing inputs to a neural network layer and weights for the layer. Each super tile includes multiple compute tiles. Each compute tile executes a compute thread that is used to perform the computations to generate an output for the neural network layer. Each super tile includes arbitration logic coupled to the unified memory and each compute tile. The arbitration logic is configured to: pass inputs stored in the unified memory to the compute tiles; pass weights stored in the unified memory to the compute tiles; and pass, to the unified memory, the output generated for the layer based on computations performed at the compute tiles using the inputs and the weights for the layer.", "label": "16-973087 - Hardware circuit for accelerating neural network computations", "leaf_samples": [{"index": 8, "patent_id": "16-973087", "title": "Hardware circuit for accelerating neural network computations", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "9", "index": 9, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "17-048023", "title": "Neural networks for scalable continual learning in domains with sequentially learned tasks", "text_preview": "Methods, systems, and apparatus, including computer programs encoded on computer storage media, for scalable continual learning using neural networks. One of the methods includes receiving new training data for a new machine learning task; training an active subnetwork on the new training data to determine trained values of the active network parameters from initial values of the active network parameters while holding current values of the knowledge parameters fixed; and training a knowledge subnetwork on the new training data to determine updated values of the knowledge parameters from the current values of the knowledge parameters by training the knowledge subnetwork to generate knowledge outputs for the new training inputs that match active outputs generated by the trained active subnetwork for the new training inputs.", "label": "17-048023 - Neural networks for scalable continual learning in domains with...", "leaf_samples": [{"index": 9, "patent_id": "17-048023", "title": "Neural networks for scalable continual learning in domains with sequentially learned tasks", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "10", "index": 10, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "17-070786", "title": "Event driven configurable artificial intelligence workflow", "text_preview": "In one embodiment, in response to sensor data received from a sensor device of a detection device, an analysis is performed on the sensor data within the detection device. Configuration data is determined based on the analysis of the sensor data. The configuration data identifies one or more actions to be performed. Each action is associated with a particular artificial intelligence (AI) model. For each of the actions, an event is generated to trigger the corresponding action to be performed. In response to each of the events, an AI model corresponding to the action associated with the event is executed. The AI model is applied to at least a portion of the sensor data to classify the sensor data.", "label": "17-070786 - Event driven configurable artificial intelligence workflow", "leaf_samples": [{"index": 10, "patent_id": "17-070786", "title": "Event driven configurable artificial intelligence workflow", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "11", "index": 11, "layer": 0, "node_type": "leaf", "children": [], "parents": ["224"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "17-284480", "title": "Deep neural network hardware accelerator based on power exponential quantization", "text_preview": "A deep neural network hardware accelerator comprises: an AXI-4 bus interface, an input cache area, an output cache area, a weighting cache area, a weighting index cache area, an encoding module, a configurable state controller module, and a PE array. The input cache area and the output cache area are designed as a line cache structure; an encoder encodes weightings according to an ordered quantization set, the quantization set storing the possible value of the absolute value of all of the weightings after quantization. During the calculation of the accelerator, the PE unit reads data from the input cache area and the weighting index cache area to perform shift calculation, and sends the calculation result to the output cache area. The accelerator uses shift operations to replace floating point multiplication operations, reducing the requirements for computing resources, storage resources, and communication bandwidth, and increasing the calculation efficiency of the accelerator.", "label": "17-284480 - Deep neural network hardware accelerator based on power exponen...", "leaf_samples": [{"index": 11, "patent_id": "17-284480", "title": "Deep neural network hardware accelerator based on power exponential quantization", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "12", "index": 12, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "17-289227", "title": "Quantizing trained long short-term memory neural networks", "text_preview": "Method for quantizing a trained long short-term memory (LSTM) neural network having a plurality of weights, the method comprising: obtaining data specifying trained floating-point values for each of the weights of the trained LSTM neural network, the trained LSTM neural network comprising one or more LSTM layers, each LSTM layer having a plurality of gates and each of the plurality of gates being associated with an input weight matrix and a recurrent weight matrix; quantizing the trained LSTM neural network, comprising: for each gate, quantizing the elements of the input weight matrix to a target fixed bit-width; for each gate, quantizing the elements of the recurrent weight matrix to the target fixed bit-width; and providing data specifying a quantized LSTM neural network for use in performing quantized inference.", "label": "17-289227 - Quantizing trained long short-term memory neural networks", "leaf_samples": [{"index": 12, "patent_id": "17-289227", "title": "Quantizing trained long short-term memory neural networks", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "13", "index": 13, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "17-359297", "title": "Compute in memory-based machine learning accelerator architecture", "text_preview": "Certain aspects of the present disclosure provide techniques for processing machine learning model data with a machine learning task accelerator, including: configuring one or more signal processing units (SPUs) of the machine learning task accelerator to process a machine learning model; providing model input data to the one or more configured SPUs; processing the model input data with the machine learning model using the one or more configured SPUs; and receiving output data from the one or more configured SPUs.", "label": "17-359297 - Compute in memory-based machine learning accelerator architectu...", "leaf_samples": [{"index": 13, "patent_id": "17-359297", "title": "Compute in memory-based machine learning accelerator architecture", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "14", "index": 14, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "17-465417", "title": "Anomaly detection using gaussian process variational autoencoder (gpvae)", "text_preview": "A method comprises the following steps: providing a Gaussian process variational autoencoder (GP-VAE) including a Gaussian process (GP) encoder and a neural network decoder; selecting a plurality of inducing points in a data space; generating a mapping of the plurality of inducing points in a latent space; and training the GP-VAE using a training dataset.", "label": "17-465417 - Anomaly detection using gaussian process variational autoencode...", "leaf_samples": [{"index": 14, "patent_id": "17-465417", "title": "Anomaly detection using gaussian process variational autoencoder (gpvae)", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "15", "index": 15, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "17-467436", "title": "Discrete three-dimensional processor", "text_preview": "A discrete three-dimensional (3-D) processor comprises first and second dice. The first die comprises 3-D memory (3D-M) arrays and in-die peripheral-circuit components thereof, whereas the second die comprises processing circuits and off-die peripheral-circuit components of the 3D-M arrays. The first and second dice are communicatively coupled by a plurality of inter-die connections.", "label": "17-467436 - Discrete three-dimensional processor", "leaf_samples": [{"index": 15, "patent_id": "17-467436", "title": "Discrete three-dimensional processor", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "16", "index": 16, "layer": 0, "node_type": "leaf", "children": [], "parents": ["209"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "17-473428", "title": "Pipeline parallel computing using extended memory", "text_preview": "A system comprises compute nodes distributed over a network and configured to perform a pipeline parallel process. The system also comprises an extended memory comprising a global virtual address space which is shared by the compute nodes. The extended memory is configured to enable the compute nodes to exchange data over the network when the compute nodes perform the pipeline parallel process.", "label": "17-473428 - Pipeline parallel computing using extended memory", "leaf_samples": [{"index": 16, "patent_id": "17-473428", "title": "Pipeline parallel computing using extended memory", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "17", "index": 17, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "17-686263", "title": "Computer-implemented method of synaptic consolidation and experience replay in a dual memory architecture", "text_preview": "A computer-implemented method of synaptic consolidation for training a neural network using an episodic memory, and a semantic memory, by using a Fisher information matrix for estimating the importance of each synapse in the network to previous tasks of the neural network; evaluating the Fisher information matrix on the episodic memory using the semantic memory; adjusting the importance estimate such that functional integrity of the filters in the convolutional layers is maintained whereby the importance of each filter is given by the mean importance of its parameters; using the weights of the semantic memory as the anchor parameters for constraining an update of the synapses of the network based on the adjusted importance estimate; updating the semantic memory and fisher information matrix stochastically using exponential moving average, and interleaving samples from a current task with samples from the episodic memory for performing the training.", "label": "17-686263 - Computer-implemented method of synaptic consolidation and exper...", "leaf_samples": [{"index": 17, "patent_id": "17-686263", "title": "Computer-implemented method of synaptic consolidation and experience replay in a dual memory architecture", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "18", "index": 18, "layer": 0, "node_type": "leaf", "children": [], "parents": ["212"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "17-889900", "title": "System and method of bosonic qubits simulation", "text_preview": "A method for simulating a bosonic quantum bit (qubit) on a classical computer are described. The method determines a phase space representation of the qubit in the form of a linear combination of Gaussian functions, each of which is characterized by a mean, a covariance matrix, and a weight coefficient determined from user defined energy parameter and qubit class of the qubit. The qubit may be simulated on a classical computer by applying transformations of quantum logic gates and measurements to update the weight coefficient, mean, and covariance matrix of each of the Gaussian functions.", "label": "17-889900 - System and method of bosonic qubits simulation", "leaf_samples": [{"index": 18, "patent_id": "17-889900", "title": "System and method of bosonic qubits simulation", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "19", "index": 19, "layer": 0, "node_type": "leaf", "children": [], "parents": ["215"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "18-031065", "title": "Methods and apparatuses for bottleneck stages in neural-network processing", "text_preview": "Methods and apparatuses herein improve bottleneck-layer processing in neural networks. Example advantages include reducing the number of accesses needed to external memory, allowing processing to run in parallel in successive bottleneck layers, based on the use of partial convolutional results, and balancing the amount of “local” memory used for storing convolutional results against the computational overhead of recomputing partial results. One aspect of the methods and apparatuses involves co-locating arithmetic and logical operators and temporary storage in the same data path, with the approach yielding both higher performance and greater energy efficiency in the implementation of bottleneck layers for neural network processing.", "label": "18-031065 - Methods and apparatuses for bottleneck stages in neural-network...", "leaf_samples": [{"index": 19, "patent_id": "18-031065", "title": "Methods and apparatuses for bottleneck stages in neural-network processing", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "20", "index": 20, "layer": 0, "node_type": "leaf", "children": [], "parents": ["223"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "18-077111", "title": "Data processing method for recurrent neural network using neural network accelerator based on systolic array and neural network accelerator", "text_preview": "Proposed is a data parallel processing method for a recurrent neural network in a neural network accelerator based on a systolic array. A data processing device receives voice data of a user in a predetermined time section. The data processing device generates a plurality of voice data units by separating the voice data by sentence. The data processing device generates a plurality of input vectors by vectorizing the plurality of voice data units. The data processing device inputs the plurality of input vectors to a neural network accelerator based on a systolic array. In this manner, the data is processed.", "label": "18-077111 - Data processing method for recurrent neural network using neura...", "leaf_samples": [{"index": 20, "patent_id": "18-077111", "title": "Data processing method for recurrent neural network using neural network accelerator based on systolic array and neural network accelerator", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "21", "index": 21, "layer": 0, "node_type": "leaf", "children": [], "parents": ["223"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "18-079772", "title": "Generative adversarial neural network assisted video reconstruction", "text_preview": "A latent code defined in an input space is processed by the mapping neural network to produce an intermediate latent code defined in an intermediate latent space. The intermediate latent code may be used as appearance vector that is processed by the synthesis neural network to generate an image. The appearance vector is a compressed encoding of data, such as video frames including a person's face, audio, and other data. Captured images may be converted into appearance vectors at a local device and transmitted to a remote device using much less bandwidth compared with transmitting the captured images. A synthesis neural network at the remote device reconstructs the images for display.", "label": "18-079772 - Generative adversarial neural network assisted video reconstruc...", "leaf_samples": [{"index": 21, "patent_id": "18-079772", "title": "Generative adversarial neural network assisted video reconstruction", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "22", "index": 22, "layer": 0, "node_type": "leaf", "children": [], "parents": ["206"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "18-097200", "title": "Dnns acceleration with block-wise n:m structured weight sparsity", "text_preview": "An accelerator core includes first and second buffers and at least one group of k processing elements. The first buffer receives at least one group of block-wise sparsified first elements. A block size (k,c) of each group of block-wise sparsified first elements includes k rows and c columns in which k is greater than or equal to 2, k times p equals K, and c times q equals C in which K is an output channel dimension of a tensor of first elements, C is a number of input channels of the tensor of first elements, p is an integer and q is an integer. The second buffer receive second elements. Each respective group of processing elements receive k rows of first elements from a block of first elements corresponding to the group of PEs, and receives second elements that correspond to first elements received from the first buffer.", "label": "18-097200 - Dnns acceleration with block-wise n:m structured weight sparsity", "leaf_samples": [{"index": 22, "patent_id": "18-097200", "title": "Dnns acceleration with block-wise n:m structured weight sparsity", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "23", "index": 23, "layer": 0, "node_type": "leaf", "children": [], "parents": ["224"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "18-198579", "title": "Convolutional neural network accelerator hardware", "text_preview": "A hardware accelerator for neural network applications can include an image-to-column block and a general matrix-matrix multiplication (GEMM) block. The image-to-column block includes an input controller coupled to receive an input feature map from a memory block; a series of patch units configured in a ring network and coupled to the input controller to receive new elements of the input feature map; and an output controller coupled to receive each output patch from the series of patch units. The GEMM block can be a dynamically reconfigurable unit that can be configured as a tall array or individual square arrays. The described hardware accelerator can handle sparsity in both the feature map inputs (output from the image-to-column block) and the filter/weight inputs to the GEMM block.", "label": "18-198579 - Convolutional neural network accelerator hardware", "leaf_samples": [{"index": 23, "patent_id": "18-198579", "title": "Convolutional neural network accelerator hardware", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "24", "index": 24, "layer": 0, "node_type": "leaf", "children": [], "parents": ["209"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "18-474579", "title": "Methods and apparatus for processing data", "text_preview": "According to the present techniques there is provided a method of operating a data processor unit to generate processing tasks. The data processor unit comprises a control circuit configured to receive, from a host processor unit, a request for the data processor unit to perform processing jobs and to generate a workload for each job. Each workload comprises one or more tasks. The data processor unit further comprises first and second execution units to process the workloads. The method comprises: receiving, at the control circuit, a request to perform first and second processing jobs; generating, at the control circuit in response to the request, a primary workload for the first processing job, and a secondary workload for the second processing job; generating, at the control circuit, one or more operation instructions to control processing of the primary and/or secondary workloads at the first and/or second execution units; processing, at the first execution unit, the primary workload in accordance with the operation instructions; and processing, at the second execution unit, the secondary workload in parallel with the primary workload in accordance with the operation instructions.", "label": "18-474579 - Methods and apparatus for processing data", "leaf_samples": [{"index": 24, "patent_id": "18-474579", "title": "Methods and apparatus for processing data", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "25", "index": 25, "layer": 0, "node_type": "leaf", "children": [], "parents": ["225"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "18-781029", "title": "Dataflow gaskets with circular buffers", "text_preview": "Apparatus and methods for facilitating data movement among circuit blocks are disclosed. In certain embodiments, dataflow gaskets with circular buffers are deployed in any number or arrangement to achieve efficient on-chip data movement among different circuit blocks of the die. Each dataflow gasket can be attached to a corresponding circuit block using tightly coupled memories to provide low latency and fast access to incoming and outgoing data streams. Furthermore, memory allocation and buffer management can be handled by the internal logic in the dataflow gasket to reduce or eliminate software development efforts. For example, the dataflow gasket can use circular buffers to allow the circuit block to access the dataflow gasket's memories without needing to understand the internal memory addressing of the dataflow gasket.", "label": "18-781029 - Dataflow gaskets with circular buffers", "leaf_samples": [{"index": 25, "patent_id": "18-781029", "title": "Dataflow gaskets with circular buffers", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "26", "index": 26, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "18-787752", "title": "Attention neural networks with parallel attention and feed-forward layers", "text_preview": "Methods, systems, and apparatus, including computer programs encoded on computer storage media, for performing a machine learning task on a network input to generate a network output. One of the systems comprises an attention neural network configured to perform the machine learning task, the attention neural network comprising a plurality of attention layers, each attention layer comprising an attention sub-layer that is arranged in parallel with a feed-forward sub-layer.", "label": "18-787752 - Attention neural networks with parallel attention and feed-forw...", "leaf_samples": [{"index": 26, "patent_id": "18-787752", "title": "Attention neural networks with parallel attention and feed-forward layers", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "27", "index": 27, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "18-805370", "title": "Efficient neural networks with elaborate matrix structures in machine learning environments", "text_preview": "A mechanism is described for facilitating slimming of neural networks in machine learning environments. A method of embodiments, as described herein, includes learning a first neural network associated with machine learning processes to be performed by a processor of a computing device, where learning includes analyzing a plurality of channels associated with one or more layers of the first neural network. The method may further include computing a plurality of scaling factors to be associated with the plurality of channels such that each channel is assigned a scaling factor, wherein each scaling factor to indicate relevance of a corresponding channel within the first neural network. The method may further include pruning the first neural network into a second neural network by removing one or more channels of the plurality of channels having low relevance as indicated by one or more scaling factors of the plurality of scaling factors assigned to the one or more channels.", "label": "18-805370 - Efficient neural networks with elaborate matrix structures in m...", "leaf_samples": [{"index": 27, "patent_id": "18-805370", "title": "Efficient neural networks with elaborate matrix structures in machine learning environments", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "28", "index": 28, "layer": 0, "node_type": "leaf", "children": [], "parents": ["224"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "18-814438", "title": "Asynchronous neural network training", "text_preview": "A neural network training apparatus is described which has a network of worker nodes each having a memory storing a subgraph of a neural network to be trained. The apparatus has a control node connected to the network of worker nodes. The control node is configured to send training data instances into the network to trigger parallelized message passing operations which implement a training algorithm which trains the neural network. At least some of the message passing operations asynchronously update parameters of individual subgraphs of the neural network at the individual worker nodes.", "label": "18-814438 - Asynchronous neural network training", "leaf_samples": [{"index": 28, "patent_id": "18-814438", "title": "Asynchronous neural network training", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "29", "index": 29, "layer": 0, "node_type": "leaf", "children": [], "parents": ["223"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "19-004301", "title": "High resolution human imaging using neural network", "text_preview": "High resolution human imaging using neural network is described. In one example, a described method comprises: assembling a k1-dimensional (k1-D) imaging matrix by a processor based on arranging and concatenating a plurality of k2-dimensional (k2-D) input imaging matrices; encoding the k1-D imaging matrix by an encoder, which is a k1-D encoding neural network, to generate a (k1+k3)-D first intermediate matrix; generating a (k2+k3)-D second intermediate matrix based on the (k1+k3)-D first intermediate matrix; and decoding the (k2+k3)-D second intermediate matrix by a decoder, which is a k2-D decoding neural network, to generate a k2-D output imaging matrix. There is at least one skip connection between the encoder and the decoder. An imaging resolution of the k2-D output imaging matrix is greater than the imaging resolution of any one of the plurality of k2-D input imaging matrices.", "label": "19-004301 - High resolution human imaging using neural network", "leaf_samples": [{"index": 29, "patent_id": "19-004301", "title": "High resolution human imaging using neural network", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "30", "index": 30, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "2018-0059775", "title": "뉴럴 네트워크 프로세서(neural network processor)", "text_preview": "본 명세서는 뉴럴 네트워크 프로세서를 개시하고 있다. 본 발명의 일 실시예는, 뉴럴 네트워크의 프로세싱을 수행하도록 구성되는 프로세싱 유닛에 있어서, 하나 이상의 인스트럭션을 구비하는 태스크들을 저장하도록 구성되는 인스트럭션 메모리와, 상기 태스크들과 연관된 데이터를 저장하도록 구성되는 데이터 메모리와, 상기 태스크들을 대상으로 데이터 준비 여부를 체크하고, 데이터 준비가 완료된 태스크의 순서대로 상기 태스크들의 준비 완료 여부를 컨트롤 플로우 엔진에 통지하도록 구성되는 데이터 플로우 엔진과, 상기 데이터 플로우 엔진으로부터 통지 받은 순서대로 태스크를 실행하도록 구성되는 컨트롤 플로우 엔진, 그리고, 상기 컨트롤 플로우 엔진이 실행하도록 제어하는 태스크의 하나 이상의 인스트럭션에 따른 연산을 수행하도록 구성되는 수행 유닛을 포함하는 뉴럴 네트워크 프로세싱 유닛을 제공한다.", "label": "2018-0059775 - 뉴럴 네트워크 프로세서(neural network processor)", "leaf_samples": [{"index": 30, "patent_id": "2018-0059775", "title": "뉴럴 네트워크 프로세서(neural network processor)", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "31", "index": 31, "layer": 0, "node_type": "leaf", "children": [], "parents": ["203"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "2018-0160341", "title": "뉴럴 네트워크에서의 부하 균형을 위한 장치 및 방법(method and apparatus for load balancing in neural network)", "text_preview": "일 측면에 따른 뉴럴 네트워크 장치에서 연산을 수행하는 방법은, 적어도 하나의 입력 피처맵 및 적어도 하나의 커널을 포함하는 복수의 연산 그룹들과, 복수의 연산 그룹들 각각에 대응하는 태그(tag) 정보를 획득하고, 복수의 연산 유닛들 중 유휴 상태인 연산 유닛을 결정할 수 있다. 유휴 상태인 연산 유닛에서, 복수의 연산 그룹들 중 소정의 연산 그룹에 포함된 입력 피처맵 및 커널 간의 컨벌루션 연산을 수행함으로써 중간 피처맵을 생성하고, 소정의 연산 그룹에 대응하는 태그 정보에 기초하여 복수의 후처리 유닛들 중 상기 태그 정보에 대응하는 후처리 유닛을 결정할 수 있다. 후처리 유닛에서, 적어도 하나의 중간 피처맵을 이용하여 출력 피처맵을 생성할 수 있다.", "label": "2018-0160341 - 뉴럴 네트워크에서의 부하 균형을 위한 장치 및 방법(method and apparatus for load bala...", "leaf_samples": [{"index": 31, "patent_id": "2018-0160341", "title": "뉴럴 네트워크에서의 부하 균형을 위한 장치 및 방법(method and apparatus for load balancing in neural network)", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "32", "index": 32, "layer": 0, "node_type": "leaf", "children": [], "parents": ["225"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "2019-0038606", "title": "뉴럴 네트워크의 컨볼루션 연산을 처리하는 방법 및 장치(method and apparatus for processing convolution operation of neural network)", "text_preview": "프로세싱 유닛들이 공통적으로 공유할 공유 오퍼랜드를 입력 피처맵의 픽셀값 또는 커널의 웨이트값 중 어느 하나로 결정하고, 결정된 공유 오퍼랜드를 기초로 병렬화된 연산들을 수행하는 방법 및 이를 위한 뉴럴 네트워크 장치를 제공한다.", "label": "2019-0038606 - 뉴럴 네트워크의 컨볼루션 연산을 처리하는 방법 및 장치(method and apparatus for process...", "leaf_samples": [{"index": 32, "patent_id": "2019-0038606", "title": "뉴럴 네트워크의 컨볼루션 연산을 처리하는 방법 및 장치(method and apparatus for processing convolution operation of neural network)", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "33", "index": 33, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "2019-0109164", "title": "더블 게이트를 갖는 반도체 소자 및 뉴럴 네트워크 내 타겟 반도체 소자의 시냅스 가중치를 설정하는 방법(semi-conductor device are-based artificial neural network computation using the same)", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "49", "index": 49, "layer": 0, "node_type": "leaf", "children": [], "parents": ["218"], "child_count": 0, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "2023-7022541", "title": "신경망 프로세싱 유닛을 포함하는 전자 장치(electronic device including neural network processing unit)", "text_preview": "본 개시의 일 예시에 따른 신경망 프로세싱 유닛은 프로세싱 엘리먼트 어레이, 프로세싱 엘리먼트 어레이에서 처리되는 인공신경망모델의 적어도 일부 데이터를 저장하도록 구성된 NPU 메모리 시스템, 및 상기 인공신경망모델의 구조 데이터 또는 인공신경망 데이터 지역성 정보에 기초하여 상기 프로세싱 엘리먼트 어레이 및 상기 NPU 메모리 시스템을 제어하도록 구성된 NPU 스케줄러를 포함할 수 있다.", "label": "2023-7022541 - 신경망 프로세싱 유닛을 포함하는 전자 장치(electronic device including neural netw...", "leaf_samples": [{"index": 49, "patent_id": "2023-7022541", "title": "신경망 프로세싱 유닛을 포함하는 전자 장치(electronic device including neural network processing unit)", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "50", "index": 50, "layer": 0, "node_type": "leaf", "children": [], "parents": ["213"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "12-834853", "title": "Multi-chip package module and a doped polysilicon trench for isolation and connection", "text_preview": "A circuit module comprises a die attach pad with a surface and a plurality of leads surrounding the surface. A nonconductive adhesive is on the surface. A plurality of electronic circuit dies are on the surface of the die attach pad. Each die has a top surface and a bottom surface with the bottom surface on the adhesive. The top surface has a plurality of bonding pads. A first electronic circuit die has at least one routing path of a conductive material connecting a first bonding pad to a second bonding pad. A first bonding wire connects a bonding pad of a second electronic circuit die to the first bonding pad of the first electronic die. A second bonding wire connects the second bonding pad of the first electronic circuit die to a lead. Where one of the dies contains vertical circuit element, where a doped layer forms a terminal along the bottom surface of the layer, a trench filled with doped polysilicon extends from the top surface to the terminal to connect to the terminal. The doped polysilicon filled trench also serves to isolate and separate different circuit elements.", "label": "12-834853 - Multi-chip package module and a doped polysilicon trench for is...", "leaf_samples": [{"index": 50, "patent_id": "12-834853", "title": "Multi-chip package module and a doped polysilicon trench for isolation and connection", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "51", "index": 51, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "13-040871", "title": "Semiconductor device with buried bit line", "text_preview": "A semiconductor device includes an isolation region, a semiconductor region, a groove, and an insulating film. The semiconductor region is defined by the isolation region. The groove is in the semiconductor region. The groove has first and second ends. At least one of the first and second ends reaches the isolation region. The insulating film is in the groove.", "label": "13-040871 - Semiconductor device with buried bit line", "leaf_samples": [{"index": 51, "patent_id": "13-040871", "title": "Semiconductor device with buried bit line", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "52", "index": 52, "layer": 0, "node_type": "leaf", "children": [], "parents": ["222"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "13-064599", "title": "Semiconductor integrated circuit device", "text_preview": "A capacitance cell includes a substrate structure layer having pair diffusion regions, and an interconnect layer having pair of power supply lines. The capacitance cell also includes a capacitance composed of a first electrode, a dielectric member and a second electrode stacked together, and is formed in a frame shape and disposed in a space between the substrate structure layer and the interconnect layer so as to extend along an outer rim of the frame shape of a standard cell region in which a standard cell is arranged. The capacitance cell also includes a first substrate contact that electrically connects one of the pair of power supply lines to one of the diffusion regions externally of the standard cell region. The capacitance cell also includes a second substrate contact that electrically connects the other power supply line to the other diffusion region, externally of the standard cell region. The capacitance cell further includes a first capacitance contact electrically connecting the first electrode to the other diffusion region internally of the standard cell region, and a second capacitance contact electrically connecting the second electrode to the one power supply line internally of the standard cell region.", "label": "13-064599 - Semiconductor integrated circuit device", "leaf_samples": [{"index": 52, "patent_id": "13-064599", "title": "Semiconductor integrated circuit device", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "53", "index": 53, "layer": 0, "node_type": "leaf", "children": [], "parents": ["213"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "13-188251", "title": "Interdigitated conductive support for gan semiconductor die", "text_preview": "A GaN die having a plurality of parallel alternating and closely spaced source and drain strips is contacted by parallel coplanar comb-shaped fingers of source and drain pads. A plurality of enlarged area coplanar spaced gate pads having respective fingers contacting the gate contact of the die. The pads may be elements of a lead frame, or conductive areas on an insulation substrate. Other semiconductor die can be mounted on the pads and connected in predetermined circuit arrangements with the GaN die.", "label": "13-188251 - Interdigitated conductive support for gan semiconductor die", "leaf_samples": [{"index": 53, "patent_id": "13-188251", "title": "Interdigitated conductive support for gan semiconductor die", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "54", "index": 54, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "13-323780", "title": "Non-volatile memory having 3d array of read/write elements with vertical bit lines and select devices and methods thereof", "text_preview": "A three-dimensional memory is formed as an array of memory elements that are formed across multiple layers of planes positioned at different distances above a semiconductor substrate. The memory elements reversibly change a level of electrical conductance in response to a voltage difference being applied across them. The three-dimensional array includes a two-dimensional array of pillar lines acting as local vertical bit lines through the multiple layers of planes which together with arrays of word lines on each plane are used to access the memory elements. The three-dimensional memory is formed over a CMOS substrate with an intermediate pillar select layer. The pillar select layer is formed with a plurality of pillar select devices which are switching transistors formed outside the CMOS and serve to switch selected rows of pillar lines to corresponding metal lines on the substrate.", "label": "13-323780 - Non-volatile memory having 3d array of read/write elements with...", "leaf_samples": [{"index": 54, "patent_id": "13-323780", "title": "Non-volatile memory having 3d array of read/write elements with vertical bit lines and select devices and methods thereof", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "55", "index": 55, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "13-354089", "title": "Electronic device and a method for fabricating an electronic device", "text_preview": "An electronic device includes a semiconductor chip. A contact element, an electrical connector, and a dielectric layer are disposed on a first surface of a conductive layer facing the semiconductor chip. A first conductive member is disposed in a first recess of the dielectric layer. The first conductive member electrically connects the contact element of the semiconductor chip with the conductive layer. A second conductive member is disposed in a second recess of the dielectric layer. The second conductive member electrically connects the conductive layer with the electrical connector.", "label": "13-354089 - Electronic device and a method for fabricating an electronic de...", "leaf_samples": [{"index": 55, "patent_id": "13-354089", "title": "Electronic device and a method for fabricating an electronic device", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "56", "index": 56, "layer": 0, "node_type": "leaf", "children": [], "parents": ["205"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "13-488459", "title": "Semiconductor device with physical manipulation detector and corrector", "text_preview": "A semiconductor device includes a first SSAD unit and a second SSAD unit. The first SSAD unit has at least one first transistor with a first dielectric layer between a first substrate and a first floating gate. The second SSAD unit has at least one second transistor with a second dielectric layer between a second substrate and a second floating gate. The second dielectric layer is thicker than the first dielectric layer.", "label": "13-488459 - Semiconductor device with physical manipulation detector and co...", "leaf_samples": [{"index": 56, "patent_id": "13-488459", "title": "Semiconductor device with physical manipulation detector and corrector", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "57", "index": 57, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "13-696880", "title": "Solar cell manufacturing apparatus and solar cell manufacturing method", "text_preview": "The solar cell manufacturing apparatus includes: a load lock chamber configured to allow loading and unloading of a substrate by switching between atmospheric ambient and vacuum ambient; a processing chamber where the substrate for a solar cell is to be doped with impurity ions for pn junction formation in the vacuum ambient; and a conveyance chamber including a conveyance unit configured to convey the substrate between the load lock chamber and the processing chamber. The doping of impurity ions is performed by irradiation with the impurity ions from an ion gun, and the ion gun is provided with a grid plate, as its ion irradiation surface, facing the substrate conveyed to the processing chamber.", "label": "13-696880 - Solar cell manufacturing apparatus and solar cell manufacturing...", "leaf_samples": [{"index": 57, "patent_id": "13-696880", "title": "Solar cell manufacturing apparatus and solar cell manufacturing method", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "58", "index": 58, "layer": 0, "node_type": "leaf", "children": [], "parents": ["217"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "13-896472", "title": "Stacked semiconductor package", "text_preview": "A stacked semiconductor package including a first printed circuit board and a second printed circuit board is provided. The first printed circuit board may include a first surface upon which a first semiconductor chip is mounted and a second surface upon which at least one connecting structure is attached. The first printed circuit board may further include at least one thermal via and a heat sink and the at least one thermal via and the heat sink may be disposed under the first semiconductor chip with the heat sink being disposed between the first surface and the second surface. The second printed circuit board may include a third surface upon which a second semiconductor chip is mounted. The second printed circuit board may be disposed under the first printed circuit board with the at least one connecting structure connecting the first printed circuit board to the second printed circuit board.", "label": "13-896472 - Stacked semiconductor package", "leaf_samples": [{"index": 58, "patent_id": "13-896472", "title": "Stacked semiconductor package", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "59", "index": 59, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "14-460175", "title": "Semiconductor device having fin gate, resistive memory device including the same, and method of manufacturing the same", "text_preview": "A semiconductor device having a fin gate that improves an operation current, and a method of manufacturing the same are provided. The semiconductor device includes an active pillar formed on a semiconductor substrate, and including a first region and a second region surrounding at least one surface of the first region, and a fin gate extending to overlap an upper surface and a lateral surface of the active pillar. The first region of the active pillar is formed of a semiconductor layer having a lattice constant smaller than that of the second region of the active pillar.", "label": "14-460175 - Semiconductor device having fin gate, resistive memory device i...", "leaf_samples": [{"index": 59, "patent_id": "14-460175", "title": "Semiconductor device having fin gate, resistive memory device including the same, and method of manufacturing the same", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "60", "index": 60, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "14-719409", "title": "Semiconductor device manufacturing method", "text_preview": "Provided is a semiconductor device manufacturing method such that miniaturization of a parallel p-n layer can be achieved, and on-state resistance can be reduced. Firstly, deposition of an n−-type epitaxial layer, and formation of an n-type impurity region and p-type impurity region that form an n-type region and p-type region of a parallel p-n layer, are repeatedly carried out. Furthermore, an n−-type counter region is formed in the vicinity of the p-type impurity region in the uppermost n−-type epitaxial layer forming the parallel p-n layer. Next, an n−-type epitaxial layer is deposited on the n−-type epitaxial layer. Next, a MOS gate structure is formed in the n−-type epitaxial layer. At this time, when carrying out a p-type base region diffusion process, the n-type and p-type impurity regions are caused to diffuse, thereby forming the n-type region and p-type region of the parallel p-n layer.", "label": "14-719409 - Semiconductor device manufacturing method", "leaf_samples": [{"index": 60, "patent_id": "14-719409", "title": "Semiconductor device manufacturing method", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "61", "index": 61, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "15-056013", "title": "Semiconductor device and method for manufacturing the same", "text_preview": "A semiconductor device of an embodiment includes a first GaN-based semiconductor layer, a second GaN-based semiconductor layer provided on the first GaN-based semiconductor layer and having a larger bandgap than the first GaN-based semiconductor layer, a source electrode provided on the second GaN-based semiconductor layer, a drain electrode provided on the second GaN-based semiconductor layer, a recess provided between the source electrode and the drain electrode in the second GaN-based semiconductor layer, a gate insulating film provided on a surface of the recess, and a gate electrode provided on the gate insulating film and having an end portion in a gate width direction, located in the recess.", "label": "15-056013 - Semiconductor device and method for manufacturing the same", "leaf_samples": [{"index": 61, "patent_id": "15-056013", "title": "Semiconductor device and method for manufacturing the same", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "62", "index": 62, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "15-405420", "title": "Semiconductor device and method of manufacturing the same", "text_preview": "A semiconductor device includes a device isolation layer provided on a substrate, the device isolation layer defining first and second sub-active patterns, first and second gate electrodes crossing the first and second sub-active patterns, respectively, and an isolation structure provided on the device isolation layer between the first and second sub-active patterns. The first and second sub-active patterns extend in a first direction and are spaced apart from each other in the first direction. The device isolation layer includes a diffusion break region disposed between the first and second sub-active patterns. The isolation structure covers a top surface of the diffusion break region.", "label": "15-405420 - Semiconductor device and method of manufacturing the same", "leaf_samples": [{"index": 62, "patent_id": "15-405420", "title": "Semiconductor device and method of manufacturing the same", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "63", "index": 63, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "15-444396", "title": "Secure chips with serial numbers", "text_preview": "An electronic device comprising a semiconductor chip which comprises a plurality of structures formed in the semiconductor chip, wherein the semiconductor chip is a member of a set of semiconductor chips, the set of semiconductor chips comprises a plurality of subsets of semiconductor chips, and the semiconductor chip is a member of only one of the subsets. The plurality of structures of the semiconductor chip includes a set of common structures which is the same for all of the semiconductor chips of the set, and a set of non-common structures, wherein the non-common structures of the semiconductor chip of the subset is different from a non-common circuit of the semiconductor chips in every other subset. At least a first portion of the non-common structures and a first portion of the common structures form a first non-common circuit, wherein the first non-common circuit of the semiconductor chips of each subset is different from a non-common circuit of the semiconductor chips in every other subset. At least a second portion of the non-common structures is adapted to store or generate a first predetermined value which uniquely identifies the first non-common circuit, wherein the first predetermined value is readable from outside the semiconductor chip by automated reading means.", "label": "15-444396 - Secure chips with serial numbers", "leaf_samples": [{"index": 63, "patent_id": "15-444396", "title": "Secure chips with serial numbers", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "64", "index": 64, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "15-585949", "title": "Metal oxide semiconductor device having recess and manufacturing method thereof", "text_preview": "The present invention provides a MOS (Metal-Oxide-Silicon) device and a manufacturing method thereof. The MOS device includes: a semiconductor substrate, a gate, a source, a drain, and two LDDs (Lightly-Doped-Drains). At least one recess is formed at an upper surface of the semiconductor substrate. The recess has a depth which is deeper than the depth of the two LDDs. The recess is filled with a conductive material. A vertical connection portion is formed at a boundary of the recess in the vertical direction, to at least connect one of the LDDs to the drain. The LDD closer to the drain is not laterally in contact with the drain but is connected to the drain by the vertical direction.", "label": "15-585949 - Metal oxide semiconductor device having recess and manufacturin...", "leaf_samples": [{"index": 64, "patent_id": "15-585949", "title": "Metal oxide semiconductor device having recess and manufacturing method thereof", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "65", "index": 65, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "15-775924", "title": "Manufacturing method of smoothing a semiconductor surface", "text_preview": "A method is provided for preparing semiconductor structure, e.g., a semiconductor on insulator structure, comprising a device layer having a smooth surface. The method provided involves smoothing a semiconductor substrate surface by making use of stress enhanced surface diffusion at elevated temperatures. The purpose of this method is to reach atomic scale surface smoothness (for example, smoothness in the range of between 1.0 and 1.5 angstroms as measured according to root mean square over a 30 um×30 um AFM measurement), which is required in advanced (sub 28 nm) CMOS device fabrication.", "label": "15-775924 - Manufacturing method of smoothing a semiconductor surface", "leaf_samples": [{"index": 65, "patent_id": "15-775924", "title": "Manufacturing method of smoothing a semiconductor surface", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "66", "index": 66, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "15-796076", "title": "Semiconductor device", "text_preview": "The semiconductor device including: two fins having rectangular parallelepiped shapes arranged in parallel in X-direction; and a gate electrode arranged thereon via a gate insulating film and extending in Y-direction is configured as follows. First, a drain plug is provided over a drain region located on one side of the gate electrode and extending in Y-direction. Then, two source plugs are provided over a source region located on the other side of the gate electrode and extending in Y-direction. Also, the drain plug is arranged in a displaced manner so that its position in Y-direction may not overlap with the two source plugs. According to such a configuration, the gate-drain capacitance can be made smaller than the gate-source capacitance and a Miller effect-based circuit delay can be suppressed. Further, as compared with capacitance on the drain side, capacitance on the source side increases, thereby improving stability of circuit operation.", "label": "15-796076 - Semiconductor device", "leaf_samples": [{"index": 66, "patent_id": "15-796076", "title": "Semiconductor device", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "67", "index": 67, "layer": 0, "node_type": "leaf", "children": [], "parents": ["205"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "15-994284", "title": "Semiconductor device", "text_preview": "There is provided a semiconductor device including a memory region and a logic region. The memory region includes a transistor (memory transistor) that stores information by accumulating charge in a sidewall insulating film. The width of the sidewall insulating film of the memory transistor included in the memory region is made larger than the width of a sidewall insulating film of a transistor (logic transistor) included in the logic region.", "label": "15-994284 - Semiconductor device", "leaf_samples": [{"index": 67, "patent_id": "15-994284", "title": "Semiconductor device", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "68", "index": 68, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "16-060058", "title": "Power semiconductor device and method of manufacturing power semiconductor device", "text_preview": "A power semiconductor device according to the present invention has a super junction structure, and includes a low-resistance semiconductor layer, an n−-type column region, p−-type column regions, a base region, trenches, gate insulation films, gate electrodes, source regions, interlayer insulation films, contact holes, metal plugs, p+-type diffusion regions, a source electrode and a gate pad electrode. An active element part includes an n−-type column region between a predetermined p−-type column region disposed closest to a gate pad part and a predetermined n−-type column region disposed closest to the gate pad part among the n−-type column regions which are in contact with the trenches. The present invention provides a power semiconductor device which can satisfy a demand for reduction in cost and downsizing of electronic equipment, can lower ON resistance while maintaining a high withstand voltage, and can possess a large breakdown resistance.", "label": "16-060058 - Power semiconductor device and method of manufacturing power se...", "leaf_samples": [{"index": 68, "patent_id": "16-060058", "title": "Power semiconductor device and method of manufacturing power semiconductor device", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "69", "index": 69, "layer": 0, "node_type": "leaf", "children": [], "parents": ["225"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "16-440716", "title": "Integrated circuit device", "text_preview": "An integrated circuit device is provided. The integrated circuit device includes a semiconductor substrate having a circuit area and a guarding area surrounding the circuit area. A guarding structure is formed in the guarding area, and includes a diffusion region in the semicon
