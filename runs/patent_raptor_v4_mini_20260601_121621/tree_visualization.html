uctor substrate. The guarding structure also includes a gate stack disposed on the semiconductor substrate and positioned adjacent to the diffusion region. The guarding structure further includes a guarding layer disposed on the gate stack. The gate stack extends in a first direction while the guarding layer extends in a second direction that is different from the first direction. The guarding layer is electrically insulated from the diffusion region. Thus, an integrated circuit device including a guarding structure with several capacitors is provided.", "label": "16-440716 - Integrated circuit device", "leaf_samples": [{"index": 69, "patent_id": "16-440716", "title": "Integrated circuit device", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "70", "index": 70, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "16-503363", "title": "Semiconductor assemblies including vertically integrated circuits and methods of manufacturing the same", "text_preview": "Semiconductor assemblies including thermal management configurations for reducing heat transfer between vertically stacked devices and associated systems and methods are disclosed herein. In some embodiments, the semiconductor assemblies comprise at least one memory device mounted over a logic device with a thermally conductive layer, a thermal-insulator interposer, or a combination thereof disposed between the memory device and the logic device. The thermally conductive layer includes a structure configured to transfer the thermal energy across a horizontal plane. The thermal-insulator interposer includes a structure configured to reduce heat transfer between the logic device and the memory device.", "label": "16-503363 - Semiconductor assemblies including vertically integrated circui...", "leaf_samples": [{"index": 70, "patent_id": "16-503363", "title": "Semiconductor assemblies including vertically integrated circuits and methods of manufacturing the same", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "71", "index": 71, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "16-883153", "title": "System-in-package module", "text_preview": "A system-in-package module includes a substrate, an application specific integrated circuit (ASIC) chip on the substrate, first wafer level package (WLP) memories on the substrate spaced apart from the ASIC chip in a first direction parallel to an upper surface of the substrate, and second WLP memories on the substrate spaced apart from the ASIC chip in a direction opposite to the first direction.", "label": "16-883153 - System-in-package module", "leaf_samples": [{"index": 71, "patent_id": "16-883153", "title": "System-in-package module", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "72", "index": 72, "layer": 0, "node_type": "leaf", "children": [], "parents": ["203"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "16-905612", "title": "Semiconductor device and method for manufacturing semiconductor device", "text_preview": "A semiconductor device includes a semiconductor layer of a first conductivity type, a second semiconductor layer of a second conductivity type embedded in the semiconductor layer, a first trench and a second trench formed in the semiconductor layer such that the first trench and the second trench penetrate the second semiconductor layer, a first insulating film formed on at least a side surface of the first trench, a second insulating film formed on at least a side surface of the second trench, a first sinker layer of the second conductivity type formed in a first portion of the semiconductor layer, a second sinker layer of the second conductivity type formed in the first portion of the semiconductor layer, a diode impurity region of the first conductivity type which is formed on the first surface of the semiconductor layer and forms a Zener diode by pn junction between the first sinker layer and the diode impurity region, a first wiring electrically connected to the diode impurity region, and a second wiring electrically connected to the second sinker layer.", "label": "16-905612 - Semiconductor device and method for manufacturing semiconductor...", "leaf_samples": [{"index": 72, "patent_id": "16-905612", "title": "Semiconductor device and method for manufacturing semiconductor device", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "73", "index": 73, "layer": 0, "node_type": "leaf", "children": [], "parents": ["222"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "16-945220", "title": "Charge-balance power device, and process for manufacturing the charge-balance power device", "text_preview": "A charge-balance power device includes a semiconductor body having a first conductivity type. A trench gate extends in the semiconductor body from a first surface toward a second surface. A body region has a second conductivity type that is opposite the first conductivity type, and the body region faces the first surface of the semiconductor body and extends on a first side and a second side of the trench gate. Source regions having the first conductivity type extend in the body region and face the first surface of the semiconductor body. A drain terminal extends on the second surface of the semiconductor body. The device further comprises a first and a second columnar region having the second conductivity, which extend in the semiconductor body adjacent to the first and second sides of the trench gate, and the first and second columnar regions are spaced apart from the body region and from the drain terminal.", "label": "16-945220 - Charge-balance power device, and process for manufacturing the ...", "leaf_samples": [{"index": 73, "patent_id": "16-945220", "title": "Charge-balance power device, and process for manufacturing the charge-balance power device", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "74", "index": 74, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "16-948788", "title": "Lateral transistor with extended source finger contact", "text_preview": "Semiconductor devices, such as a lateral HEMT, may display current flow between a plurality of interdigitated source fingers and drain fingers, and controlled by a common gate connection. An extended source finger contact may enable improved voltage control across the source fingers, even for large devices with many and/or lengthy source fingers. In this way, unwanted subthreshold operations and switching oscillations may be avoided by reliably maintaining a source voltage at a desired level, to thereby provide fast and reliable switching.", "label": "16-948788 - Lateral transistor with extended source finger contact", "leaf_samples": [{"index": 74, "patent_id": "16-948788", "title": "Lateral transistor with extended source finger contact", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "75", "index": 75, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "17-014695", "title": "Semiconductor memory device and erase verify operation", "text_preview": "A semiconductor memory device according to an embodiment includes a string, a bit line, a well line, and a sequencer. The string includes first and second select transistors, and memory cell transistors using a ferroelectric material. The bit line and the well line are connected to the first and second select transistors, respectively. At a time in an erase verify operation, the sequencer is configured to apply a first voltage to the memory cell transistors, to apply a second voltage lower than the first voltage to the first select transistor, to apply a third voltage lower than the first voltage to the second select transistor, to apply a fourth voltage to the bit line, and to apply a fifth voltage higher than the fourth voltage to the well line.", "label": "17-014695 - Semiconductor memory device and erase verify operation", "leaf_samples": [{"index": 75, "patent_id": "17-014695", "title": "Semiconductor memory device and erase verify operation", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "76", "index": 76, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "17-100171", "title": "Semiconductor package including interposer", "text_preview": "Provided is a semiconductor package including an interposer. The semiconductor package includes: a package base substrate; a lower redistribution line structure disposed on the package base substrate and including a plurality of lower redistribution line patterns; at least one interposer including a plurality of first connection pillars spaced apart from each other on the lower redistribution line structure and connected respectively to portions of the plurality of lower redistribution line patterns, and a plurality of connection wiring patterns; an upper redistribution line structure including a plurality of upper redistribution line patterns connected respectively to the plurality of first connection pillars and the plurality of connection wiring patterns, on the plurality of first connection pillars and the at least one interposer; and at least two semiconductor chips adhered on the upper redistribution line structure while being spaced apart from each other.", "label": "17-100171 - Semiconductor package including interposer", "leaf_samples": [{"index": 76, "patent_id": "17-100171", "title": "Semiconductor package including interposer", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "77", "index": 77, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "17-368837", "title": "Opossum redistribution frame for configurable memory devices", "text_preview": "The present disclosure relates to a semiconductor package that may include a package substrate with a first surface and an opposing second surface, a first device coupled to the first surface of the package substrate, a redistribution frame coupled to the second surface of the package substrate, a plurality of solder balls coupled to the second surface of the package substrate, a second device coupled to the redistribution frame, and a printed circuit board coupled to the plurality of solder balls on the second surface of substrate, wherein the redistribution frame coupled with the second device and the plurality of solder balls are positioned between the package substrate and the printed circuit board.", "label": "17-368837 - Opossum redistribution frame for configurable memory devices", "leaf_samples": [{"index": 77, "patent_id": "17-368837", "title": "Opossum redistribution frame for configurable memory devices", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "78", "index": 78, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "17-407224", "title": "Semiconductor package including lid with integrated heat pipe for thermal management and methods for forming the same", "text_preview": "A semiconductor package including a lid having one or more heat pipes located on and/or within the lid to provide improved thermal management. A lid for a semiconductor package having one or more heat pipes thermally integrated with the lid may provide more uniform heat loss from the semiconductor package, reduce the risk of damage to the package due to excessive heat accumulation, and may enable the lid to be fabricated using less expensive materials, thereby reducing the costs of a semiconductor package.", "label": "17-407224 - Semiconductor package including lid with integrated heat pipe f...", "leaf_samples": [{"index": 78, "patent_id": "17-407224", "title": "Semiconductor package including lid with integrated heat pipe for thermal management and methods for forming the same", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "79", "index": 79, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "17-478843", "title": "3d stack of split graphics processing logic dies", "text_preview": "A packaging technology to improve performance of an AI processing system resulting in an ultra-high bandwidth system. An IC package is provided which comprises: a substrate; a first die on the substrate, and a second die stacked over the first die. The first die can be a first logic die (e.g., a compute chip, CPU, GPU, etc.) while the second die can be a compute chiplet comprising ferroelectric or paraelectric logic. Both dies can include ferroelectric or paraelectric logic. The ferroelectric/paraelectric logic may include AND gates, OR gates, complex gates, majority, minority, and/or threshold gates, sequential logic, etc. The IC package can be in a 3D or 2.5D configuration that implements logic-on-logic stacking configuration. The 3D or 2.5D packaging configurations have chips or chiplets designed to have time distributed or spatially distributed processing. The logic of chips or chiplets is segregated so that one chip in a 3D or 2.5D stacking arrangement is hot at a time.", "label": "17-478843 - 3d stack of split graphics processing logic dies", "leaf_samples": [{"index": 79, "patent_id": "17-478843", "title": "3d stack of split graphics processing logic dies", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "80", "index": 80, "layer": 0, "node_type": "leaf", "children": [], "parents": ["216"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "17-562751", "title": "Systems and methods for distributed rendering using two-level binning", "text_preview": "Systems and methods for distributed rendering using two-level binning include processing primitives of a frame to be rendered at a first graphics processing unit (GPU) chiplet in a set of GPU chiplets to generate visibility information of primitives for each coarse bin and providing the visibility information to the other GPU chiplets in the set of GPU chiplets. Each coarse bin is then assigned to one of the GPU chiplets of the set of GPU chiplets and rendered at the assigned GPU chiplet based on the corresponding visibility information.", "label": "17-562751 - Systems and methods for distributed rendering using two-level b...", "leaf_samples": [{"index": 80, "patent_id": "17-562751", "title": "Systems and methods for distributed rendering using two-level binning", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "81", "index": 81, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "17-712380", "title": "Self-regulating power management for a neural network system", "text_preview": "A neural network runs a known input data set using an error free power setting and using an error prone power setting. The differences in the outputs of the neural network using the two different power settings determine a high level error rate associated with the output of the neural network using the error prone power setting. If the high level error rate is excessive, the error prone power setting is adjusted to reduce errors by changing voltage and/or clock frequency utilized by the neural network system. If the high level error rate is within bounds, the error prone power setting can remain allowing the neural network to operate with an acceptable error tolerance and improved efficiency. The error tolerance can be specified by the neural network application.", "label": "17-712380 - Self-regulating power management for a neural network system", "leaf_samples": [{"index": 81, "patent_id": "17-712380", "title": "Self-regulating power management for a neural network system", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "82", "index": 82, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "17-811338", "title": "Multi-stage knowledge graph construction using models", "text_preview": "A knowledge graph is constructed as part of a multi-stage process using pretrained language models. Input text in a natural language format is received. In a first stage, a plurality of nodes is generated using a pretrained language model, where the nodes correspond to entities of the input text. In the second stage edges to interconnect the plurality of nodes are generated. The edges are generated responsive to generating each of the plurality of nodes.", "label": "17-811338 - Multi-stage knowledge graph construction using models", "leaf_samples": [{"index": 82, "patent_id": "17-811338", "title": "Multi-stage knowledge graph construction using models", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "83", "index": 83, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "17-977535", "title": "Power semiconductor device with an auxiliary gate structure", "text_preview": "A heterojunction device having at least three terminals, the at least three terminals comprising a high voltage terminal, a low voltage terminal and a control terminal. The heterojunction device further comprises at least one main power heterojunction transistor, an auxiliary gate circuit comprising at least one first low-voltage heterojunction transistor, a pull-down circuit comprising a capacitor and a charging path for the capacitor. The heterojunction device further comprises at least one monolithically integrated component, wherein the capacitor is configured to provide an internal rail voltage for the at least one monolithically integrated component.", "label": "17-977535 - Power semiconductor device with an auxiliary gate structure", "leaf_samples": [{"index": 83, "patent_id": "17-977535", "title": "Power semiconductor device with an auxiliary gate structure", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "84", "index": 84, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "18-027074", "title": "Three-dimensional stacked processing systems", "text_preview": "Aspects of the present technology are directed toward three-dimensional (3D) stacked processing systems characterized by high memory capacity, high memory bandwidth, low power consumption and small form factor. The 3D stacked processing systems include a plurality of processor chiplets and input/output circuits directly coupled to each of the plurality of processor chiplets.", "label": "18-027074 - Three-dimensional stacked processing systems", "leaf_samples": [{"index": 84, "patent_id": "18-027074", "title": "Three-dimensional stacked processing systems", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "85", "index": 85, "layer": 0, "node_type": "leaf", "children": [], "parents": ["203"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "18-307798", "title": "Semiconductor substrate", "text_preview": "A method for manufacturing a semiconductor device includes the steps of forming a fixing layer, coupling a third substrate different from the first substrate and the second substrate to the fixing layer, separating the semiconductor thin film layer from the first substrate by moving the third substrate away from the base material substrate with the third substrate coupled to the coupling region, and bonding the semiconductor thin film layer to the second substrate after separation from the base material substrate, wherein the forming the fixing layer forms the fixing layer having a thickness such that a crack is generated between the fixing layer formed on the first substrate and the fixing layer formed on a side surface of the semiconductor thin film layer by a force for moving the third substrate.", "label": "18-307798 - Semiconductor substrate", "leaf_samples": [{"index": 85, "patent_id": "18-307798", "title": "Semiconductor substrate", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "86", "index": 86, "layer": 0, "node_type": "leaf", "children": [], "parents": ["216"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "18-363333", "title": "Distributed geometry", "text_preview": "Systems, apparatuses, and methods for performing geometry work in parallel on multiple chiplets are disclosed. A system includes a chiplet processor with multiple chiplets for performing graphics work in parallel. Instead of having a central distributor to distribute work to the individual chiplets, each chiplet determines on its own the work to be performed. For example, during a draw call, each chiplet calculates which portions to fetch and process of one or more index buffer(s) corresponding to one or more graphics object(s) of the draw call. Once the portions are calculated, each chiplet fetches the corresponding indices and processes the indices. The chiplets perform these tasks in parallel and independently of each other. When the index buffer(s) are processed, one or more subsequent step(s) in the graphics rendering process are performed in parallel by the chiplets.", "label": "18-363333 - Distributed geometry", "leaf_samples": [{"index": 86, "patent_id": "18-363333", "title": "Distributed geometry", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "87", "index": 87, "layer": 0, "node_type": "leaf", "children": [], "parents": ["223"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "18-375138", "title": "Multi-die chiplet-based application specific integrated circuit", "text_preview": "Systems and methods for distributed ledger interactions, for instance for mining cryptocurriencie(s), are disclosed. In some examples, an Application Specific Integrated Circuit (ASIC) for mining cryptocurrency includes a plurality of hash dies arranged to perform application-specific processing. The ASIC includes a control die arranged to control the plurality of hash dies. The control die is formed using a larger node than the plurality of hash dies. The ASIC includes one or more interconnectors electrically connecting the control die to the one or more hash dies. The ASIC includes an integrated circuit package enclosing the control die and the one or more hash dies.", "label": "18-375138 - Multi-die chiplet-based application specific integrated circuit", "leaf_samples": [{"index": 87, "patent_id": "18-375138", "title": "Multi-die chiplet-based application specific integrated circuit", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "88", "index": 88, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "18-447263", "title": "Ergonomic and high-performance power supplies for computers", "text_preview": "An ergonomic power supply for a computer system includes a printed circuit board assembly configured to convert a mains electricity input to voltage-regulated, direct-current (DC) outputs. The printed circuit board assembly defines a mains input and has one or more DC output connectors. An enclosure houses a fan and the printed circuit board assembly. The enclosure has a rear panel, a front panel positioned opposite the rear panel relative to the printed circuit board assembly. A side panel is positioned between the front and rear panel. The mains connector extends through an aperture defined by the rear panel of the enclosure. The one or more DC output connectors extend through the side panel. Such an arrangement provides significantly easier access to the power supply outputs compared to conventional power supplies. Associated computer systems also are described.", "label": "18-447263 - Ergonomic and high-performance power supplies for computers", "leaf_samples": [{"index": 88, "patent_id": "18-447263", "title": "Ergonomic and high-performance power supplies for computers", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "89", "index": 89, "layer": 0, "node_type": "leaf", "children": [], "parents": ["216"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "18-480466", "title": "Multi-accelerator compute dispatch", "text_preview": "Techniques for executing computing work by a plurality of chiplets are provided. The techniques include assigning workgroups of a kernel dispatch packet to the chiplets; by each chiplet, executing the workgroups assigned to that chiplet; for each chiplet, upon completion of all workgroups assigned to that chiplet for the kernel dispatch packet, notifying the other chiplets of such completion; and upon completion of all workgroups of the kernel dispatch packet, notifying a client of such completion and proceeding to a subsequent kernel dispatch packet.", "label": "18-480466 - Multi-accelerator compute dispatch", "leaf_samples": [{"index": 89, "patent_id": "18-480466", "title": "Multi-accelerator compute dispatch", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "90", "index": 90, "layer": 0, "node_type": "leaf", "children": [], "parents": ["203"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "18-494253", "title": "Backside isolation of semiconductor structures", "text_preview": "Semiconductor structures and methods for fabricating semiconductor structures are provided. A semiconductor structure includes a first fin extending in an X-direction and a second fin parallel to the first fin and distanced from the first fin in a Y-direction perpendicular to the X-direction. Each fin is formed with a first device area and a second device area aligned in the X-direction; an isolation region disposed between the fins; an isolation structure disposed between the device areas in each fin; and an isolation layer disposed under the fins. The isolation region contacts the isolation layer, the isolation structure contacts the isolation layer, and the isolation region contacts the isolation structure to isolate the first fin from the second fin and to isolate the first device area from the second device area in each fin.", "label": "18-494253 - Backside isolation of semiconductor structures", "leaf_samples": [{"index": 90, "patent_id": "18-494253", "title": "Backside isolation of semiconductor structures", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "91", "index": 91, "layer": 0, "node_type": "leaf", "children": [], "parents": ["203"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "18-583892", "title": "Semiconductor device and method of manufacturing semiconductor device", "text_preview": "According to one embodiment, a method of manufacturing a semiconductor device includes: forming a laser peeling film above a first semiconductor substrate; forming, inside the laser peeling film, a thermal diffusion layer including a member has a coefficient of thermal conductivity higher than that of the laser peeling film is distributed in a plane parallel to a front surface of the first semiconductor substrate; forming a circuit layer including a semiconductor circuit above the laser peeling film; bonding the first and a second semiconductor substrates; applying a laser beam to a back surface of the first semiconductor substrate; and peeling the first semiconductor substrate to maintain the circuit layer on a side of the second semiconductor substrate.", "label": "18-583892 - Semiconductor device and method of manufacturing semiconductor ...", "leaf_samples": [{"index": 91, "patent_id": "18-583892", "title": "Semiconductor device and method of manufacturing semiconductor device", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "92", "index": 92, "layer": 0, "node_type": "leaf", "children": [], "parents": ["222"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "2018-0020931", "title": "정전척 및 반도체처리장치의 제어장치(electrostatic chuck and device of controlling a semiconductor processing apparatus)", "text_preview": "정전척은 베이스와, 베이스 상에 배치되고 유전체물질로 이루어지는 지지플레이트와, 지지플레이트 내에 배치되는 적어도 하나의 전극과, 지지플레이트의 상기 제1 영역에 배치되는 다수의 발열소자와, 지지플레이트의 제2 영역에 배치되는 다수의 열전소자와, 지지플레이트의 제1 영역에 배치되는 제1 공급라인과, 지지플레이트의 제2 영역에 배치되는 다수의 제2 공급라인을 포함한다. 제2 공급라인은 수직 방향으로 배치되는 제1 라인영역과, 제1 라인영역의 일단으로부터 수직 방향과 다른 방향으로 경사지되도록 배치되는 제2 라인영역을 포함할 수 있다.", "label": "2018-0020931 - 정전척 및 반도체처리장치의 제어장치(electrostatic chuck and device of controlli...", "leaf_samples": [{"index": 92, "patent_id": "2018-0020931", "title": "정전척 및 반도체처리장치의 제어장치(electrostatic chuck and device of controlling a semiconductor processing apparatus)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "93", "index": 93, "layer": 0, "node_type": "leaf", "children": [], "parents": ["222"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "2020-0117172", "title": "반도체 패키지(semiconductor package)", "text_preview": "기판; 및 상기 기판 상의 반도체 칩; 을 포함하되, 상기 기판은: 내부 절연층; 상기 내부 절연층 내의 재배선층; 상기 내부 절연층 상의 외부 절연층; 상기 재배선층과 전기적으로 연결되는 상기 외부 절연층 내의 연결 패드; 및 상기 외부 절연층 내의 그라운드 전극; 을 포함하고, 상기 연결 패드의 상면은 상기 외부 절연층의 상면에 의해 노출되되, 상기 연결 패드의 상면의 레벨은 상기 외부 절연층의 상면의 레벨보다 낮고, 상기 그라운드 전극의 하면의 레벨은 상기 재배선층의 상면의 레벨보다 높으며, 상기 외부 절연층은 상기 그라운드 전극의 상면을 덮는 반도체 패키지가 제공된다.", "label": "2020-0117172 - 반도체 패키지(semiconductor package)", "leaf_samples": [{"index": 93, "patent_id": "2020-0117172", "title": "반도체 패키지(semiconductor package)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "94", "index": 94, "layer": 0, "node_type": "leaf", "children": [], "parents": ["205"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "2021-0082497", "title": "바이오 프로세싱 엘리먼트 및 바이오 프로세싱 엘리먼트들을 포함하는 신경망 프로세서(bio processing element and neural network processor including bio processing elements)", "text_preview": "배양된 생체 뉴런들에 기반한 동작을 수행하는 바이오 프로세싱 엘리먼트는 생체 뉴런들에 연결되는 전극들을 포함하는 전극 레이어, 생체 뉴런들을 위한 적층된 회로들을 포함하고, 전극 레이어와 적층되는 회로 레이어들, 및 전극 레이어와 회로 레이어들 간을 연결하는 연결 소자들을 포함한다.", "label": "2021-0082497 - 바이오 프로세싱 엘리먼트 및 바이오 프로세싱 엘리먼트들을 포함하는 신경망 프로세서(bio processing el...", "leaf_samples": [{"index": 94, "patent_id": "2021-0082497", "title": "바이오 프로세싱 엘리먼트 및 바이오 프로세싱 엘리먼트들을 포함하는 신경망 프로세서(bio processing element and neural network processor including bio processing elements)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "95", "index": 95, "layer": 0, "node_type": "leaf", "children": [], "parents": ["215"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "2021-0122071", "title": "3d 적층 칩 및 그 3d 적층 칩을 포함한 반도체 패키지(3d(3-dimentional) stack chip, and semiconductor package comprising the stack chip)", "text_preview": "본 발명의 기술적 사상은, 큰 사이즈를 갖는 고전력, 고성능의 로직 칩의 열적 특성을 최적화할 수 있는 구조의 3D 적층 칩 및 그 3D 적층 칩을 포함한 반도체 패키지를 제공한다. 그 3D 적층 칩은 내부에 제1 관통 전극을 포함한 제1 반도체 칩; 상기 제1 반도체 칩에 수평으로 인접하여 배치된 제2 반도체 칩; 및 상기 제1 반도체 칩과 제2 반도체 칩 상에 배치된 제3 반도체 칩;을 포함하고, 상기 제3 반도체 칩은 상기 제1 반도체 칩보다 큰 사이즈를 갖는다.", "label": "2021-0122071 - 3d 적층 칩 및 그 3d 적층 칩을 포함한 반도체 패키지(3d(3-dimentional) stack chip, ...", "leaf_samples": [{"index": 95, "patent_id": "2021-0122071", "title": "3d 적층 칩 및 그 3d 적층 칩을 포함한 반도체 패키지(3d(3-dimentional) stack chip, and semiconductor package comprising the stack chip)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "96", "index": 96, "layer": 0, "node_type": "leaf", "children": [], "parents": ["209"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "2021-0182352", "title": "포인트 클라우드 기반 3차원 객체 인지 모델의 컨텍스트 별 학습 방법(context specific training method for point cloud-based 3d object recognition model)", "text_preview": "포인트 클라우드 기반 3차원 객체 인지 모델의 컨텍스트 별 학습 방법이 제공된다. 본 발명의 실시예에 따른 객체 인지 모델 학습 방법은, 3차원 영상 데이터를 입력받고, 입력된 3차원 영상의 컨텍스트를 추정하며, 추정된 컨텍스트에 매칭되는 객체 그룹을 선택하고, 선택된 객체 그룹에 포함된 각 객체들에 대한 앵커 박스들을 결정하며, 객체들을 인지하기 위한 인공지능 모델인 객체 인지 모델을 결정 결과에 따라 설정하고, 입력된 3차원 영상 데이터를 이용하여 설정된 객체 인지 모델을 학습시킨다. 이에 의해, 영상 컨텍스트에 따라 인식할 관심 객체들을 제한하고, 관심 객체의 클래스에 따라 적용할 앵커 박스를 적응적으로 결정하여, 객체 인지 모델을 생성하고 설정하여 학습시킴으로써, 트레이드 오프 관계에 있는 객체 인지 모델의 정확도와 속도 모두를 향상시킬 수 있게 된다.", "label": "2021-0182352 - 포인트 클라우드 기반 3차원 객체 인지 모델의 컨텍스트 별 학습 방법(context specific trainin...", "leaf_samples": [{"index": 96, "patent_id": "2021-0182352", "title": "포인트 클라우드 기반 3차원 객체 인지 모델의 컨텍스트 별 학습 방법(context specific training method for point cloud-based 3d object recognition model)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "97", "index": 97, "layer": 0, "node_type": "leaf", "children": [], "parents": ["215"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "2023-0099831", "title": "반도체 패키지(semiconductor package)", "text_preview": "본 발명의 기술적 사상은 캐비티를 포함하는 세라믹 기판; 상기 세라믹 기판의 하면에 배치되고, 상기 세라믹 기판에 전기적으로 연결되는 하부 재배선 구조물; 상기 세라믹 기판의 상면에 배치되고, 상기 세라믹 기판에 전기적으로 연결되는 상부 재배선 구조물; 상기 상부 재배선 구조물 상에서 수평방향으로 배열된 복수의 반도체 칩; 및 상기 캐비티에 수용되고, 상기 복수의 반도체 칩을 전기적으로 연결하는 브릿지 칩을 포함하는 브릿지 칩 구조체를 포함하는 것을 특징으로 반도체 패키지를 제공한다.", "label": "2023-0099831 - 반도체 패키지(semiconductor package)", "leaf_samples": [{"index": 97, "patent_id": "2023-0099831", "title": "반도체 패키지(semiconductor package)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "98", "index": 98, "layer": 0, "node_type": "leaf", "children": [], "parents": ["215"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "2023-0113176", "title": "이상 감지 방법 및 이를 포함하는 반도체 소자 제조 방법(anomaly detection method and semiconductor device manufacturing method including the same)", "text_preview": "본 개시의 기술적 사상은 반도체 공정 변수에 대한 데이터를 수신하는 단계; 컨볼루션(convolution) 알고리즘 및 트랜스포머(transformer) 알고리즘을 통해 이상 감지 모델을 생성하는 단계; 상기 생성된 이상 감지 모델로 상기 데이터를 분류하는 단계;를 포함하는 것을 특징으로 하는 이상 감지 방법을 제공한다.", "label": "2023-0113176 - 이상 감지 방법 및 이를 포함하는 반도체 소자 제조 방법(anomaly detection method and se...", "leaf_samples": [{"index": 98, "patent_id": "2023-0113176", "title": "이상 감지 방법 및 이를 포함하는 반도체 소자 제조 방법(anomaly detection method and semiconductor device manufacturing method including the same)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "99", "index": 99, "layer": 0, "node_type": "leaf", "children": [], "parents": ["206"], "child_count": 0, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "2024-0024567", "title": "웨이퍼 최적 위치를 결정하는 방법 및 이를 지원하는 전자 장치(method for determining optimal wafer position and electronic device supporting the same)", "text_preview": "본 개시는 웨이퍼의 최적 위치를 결정하는 방법에 관한 것으로, 일 실시 예에 따른 웨이퍼의 최적 위치를 결정하는 방법은, 위치 결정의 대상이 되는 대상 웨이퍼의 공정 수율과 관련된 공정 데이터를 획득하는 동작, 상기 공정 데이터를 기반으로 상기 대상 웨이퍼가 기저장된 최적 위치로부터 벗어난 이탈 범위를 판단하는 동작, 학습된 인공지능 모델을 이용하여 상기 대상 웨이퍼의 결함 데이터에 대응되는 척의 유형을 결정하는 동작, 및 상기 결정된 척의 유형 및 상기 이탈 범위에 기반하여 상기 대상 웨이퍼의 최적 위치를 결정하는 동작을 포함한다.", "label": "2024-0024567 - 웨이퍼 최적 위치를 결정하는 방법 및 이를 지원하는 전자 장치(method for determining optim...", "leaf_samples": [{"index": 99, "patent_id": "2024-0024567", "title": "웨이퍼 최적 위치를 결정하는 방법 및 이를 지원하는 전자 장치(method for determining optimal wafer position and electronic device supporting the same)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "100", "index": 100, "layer": 0, "node_type": "leaf", "children": [], "parents": ["203"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "12-938001", "title": "Semiconductor device", "text_preview": "To provide a semiconductor device capable of reducing the line width of a fuse.In the semiconductor device, a dummy fuse is provided adjacent to a fuse, each wiring width of the fuse and the dummy fuse is set to the minimum line width, and the interval between the fuse and the dummy fuse is set to the minimum interval. Consequently, the exposure condition of the fuse and the dummy fuse is optimized by OPC, and therefore, it is possible to form the fuse with the minimum line width.", "label": "12-938001 - Semiconductor device", "leaf_samples": [{"index": 100, "patent_id": "12-938001", "title": "Semiconductor device", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "101", "index": 101, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "13-485920", "title": "Logic-based multiple time programming memory cell", "text_preview": "A non-volatile memory system includes one or more non-volatile memory cells. Each non-volatile memory cell provides a floating gate, a coupling device, a first floating gate transistor, and a second floating gate transistor. The coupling device is located in a first conductivity region. The first floating gate transistor is located in a second conductivity region, and supplies read current sensed during a read operation. The second floating gate transistor is located in a third conductivity region. Such non-volatile memory cell further provides two transistors for injecting negative charge into the floating gate during a programming operation, and removing negative charge from the second floating gate transistor during an erase operation. The floating gate is shared by the first floating gate transistor, the coupling device, and the second floating gate transistor, and extends over active regions of the first floating gate transistor, the coupling device and the second floating gate transistor.", "label": "13-485920 - Logic-based multiple time programming memory cell", "leaf_samples": [{"index": 101, "patent_id": "13-485920", "title": "Logic-based multiple time programming memory cell", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "102", "index": 102, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "14-172636", "title": "Semiconductor storage device", "text_preview": "A memory cell power supply circuit for each column includes a first PMOS transistor and a second PMOS transistor connected together in series between a first power supply and a second power supply. A connection point between the first and second PMOS transistors is output as a memory cell power supply. A control signal which is based on a column select signal and a write control signal is input to a gate terminal of the first PMOS transistor. A signal which is an inverted version of the signal input to the gate terminal of the first PMOS transistor is input to a gate terminal of the second PMOS transistor.", "label": "14-172636 - Semiconductor storage device", "leaf_samples": [{"index": 102, "patent_id": "14-172636", "title": "Semiconductor storage device", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "103", "index": 103, "layer": 0, "node_type": "leaf", "children": [], "parents": ["225"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "15-065746", "title": "Methods for updating memory maps of a system-on-chip", "text_preview": "This disclosure relates to techniques for updating a memory map maintained by processing circuitry that is coupled to programmable logic circuitry. One of the techniques may involve detecting reconfiguration of a device component formed on a portion of the programmable logic circuitry using monitoring circuitry. The technique may further include generating a notification event based on the reconfiguration of the device component using the monitoring circuitry. The notification event may then be sent to the processing circuitry using the monitoring circuitry. The technique may further involve updating, using the processing circuitry, the memory map based on the notification event.", "label": "15-065746 - Methods for updating memory maps of a system-on-chip", "leaf_samples": [{"index": 103, "patent_id": "15-065746", "title": "Methods for updating memory maps of a system-on-chip", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "104", "index": 104, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "15-389273", "title": "Prefetching weights for use in a neural network processor", "text_preview": "A circuit for performing neural network computations for a neural network, the circuit comprising: a systolic array comprising a plurality of cells; a weight fetcher unit configured to, for each of the plurality of neural network layers: send, for the neural network layer, a plurality of weight inputs to cells along a first dimension of the systolic array; and a plurality of weight sequencer units, each weight sequencer unit coupled to a distinct cell along the first dimension of the systolic array, the plurality of weight sequencer units configured to, for each of the plurality of neural network layers: shift, for the neural network layer, the plurality of weight inputs to cells along the second dimension of the systolic array over a plurality of clock cycles and where each cell is configured to compute a product of an activation input and a respective weight input using multiplication circuitry.", "label": "15-389273 - Prefetching weights for use in a neural network processor", "leaf_samples": [{"index": 104, "patent_id": "15-389273", "title": "Prefetching weights for use in a neural network processor", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "105", "index": 105, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "15-426033", "title": "Dpu architecture", "text_preview": "A dynamic random access memory (DRAM) processing unit (DPU) may include at least one computing cell array having a plurality of DRAM-based computing cells arranged in an array having at least one column in which the at least one column may include at least three rows of DRAM-based computing cells configured to provide a logic function that operates on a first and a second row of the at least three rows and configured to store a result of the logic function in a third row of the at least three rows; and a controller that may be coupled to the at least one computing cell array to configure the at least one computing cell array to perform a DPU operation.", "label": "15-426033 - Dpu architecture", "leaf_samples": [{"index": 105, "patent_id": "15-426033", "title": "Dpu architecture", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "106", "index": 106, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "15-594891", "title": "Semiconductor memory devices, memory systems including the same and methods of operating the same", "text_preview": "A semiconductor memory device includes a memory cell array, a control logic circuit, an internal processing circuit, and an error correction circuit. The control logic circuit generates an internal processing mode signal in response to a command from a memory controller. The internal processing circuit selectively performs the internal processing operation on a first set of data read from the memory cell array to output a processing result data, in response to the internal processing mode signal. The error correction circuit performs an error correction code (ECC) encoding on the processing result data to generate a second parity data and stores the processing result data and the second parity data in the memory cell array. The error correction circuit generates the second parity data by selecting the same ECC of a plurality of ECCs as a first ECC.", "label": "15-594891 - Semiconductor memory devices, memory systems including the same...", "leaf_samples": [{"index": 106, "patent_id": "15-594891", "title": "Semiconductor memory devices, memory systems including the same and methods of operating the same", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "107", "index": 107, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "15-645238", "title": "Simulating access lines", "text_preview": "Examples of the present disclosure provide apparatuses and methods for simulating access lines in a memory. An example method can include receiving a first bit-vector and a second bit-vector in a format associated with storing the first bit-vector in memory cells coupled to a first access line and a first number of sense lines and storing the second bit-vector in memory cells coupled to a second access line and the first number of sense lines. The method can include storing the first bit-vector in a number of memory cells coupled to the first access line and a second number of sense lines and storing the second bit-vector in a number of memory cells coupled to the first access line and a third number of sense lines, wherein a quantity of the first number of sense lines is less than a quantity of the second and third number of sense lines.", "label": "15-645238 - Simulating access lines", "leaf_samples": [{"index": 107, "patent_id": "15-645238", "title": "Simulating access lines", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "108", "index": 108, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "15-693378", "title": "Processing in memory", "text_preview": "Apparatuses and methods are provided for processing in memory. An example apparatus comprises a host and a processing in memory (PIM) capable device coupled to the host via an interface comprising a sideband channel. The PIM capable device comprises an array of memory cells coupled to sensing circuitry and is configured to perform bit vector operations on data stored in the array, and the host comprises a PIM control component to perform virtual address resolution for PIM operations prior to providing a number of corresponding bit vector operations to the PIM capable device via the sideband channel.", "label": "15-693378 - Processing in memory", "leaf_samples": [{"index": 108, "patent_id": "15-693378", "title": "Processing in memory", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "109", "index": 109, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "15-780070", "title": "Die and package", "text_preview": "Provided efficiently and at low cost are: a package for core number ratios appropriate for all types of computers; and dies included in the package.This package includes at least one die provided with: at least one of a first core formed of a CPU core or a latency core and a second core formed of an accelerator core or a throughput core; an external interface; memory interfaces 24 to 26; and a die interface 23 which is connected to another die.The die includes a first type die and a second type die each including both the first core and the second core and the core number ratio between the first core and the second core in the first type die differs from that in the second type die.Moreover, the memory interfaces include an interface conforming to TCI.In addition, the memory interfaces further include an interface conforming to HBM.", "label": "15-780070 - Die and package", "leaf_samples": [{"index": 109, "patent_id": "15-780070", "title": "Die and package", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "110", "index": 110, "layer": 0, "node_type": "leaf", "children": [], "parents": ["203"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "15-962881", "title": "Method for manufacturing semiconductor device that comprises a fin structure", "text_preview": "A semiconductor device manufacturing method is presented. The method entails providing a semiconductor structure comprising a substrate, one or more semiconductor fins on the substrate, and a trench isolation structure around each semiconductor fin, wherein the trench isolation structure comprises a first component intersecting an extension direction of the semiconductor fin and a second component parallel with the extension direction; etching the trench isolation structure to expose a portion of the semiconductor fin; forming a patterned buffer layer on the semiconductor structure covering the second component and having an opening exposing the first component; forming an insulation layer in the opening, with upper surfaces of the insulation layer and the semiconductor fin substantially on the same horizontal level; and removing the buffer layer. This inventive concept reduces, if not eliminates, oxide loss in Single Diffusion Break (SDB) region.", "label": "15-962881 - Method for manufacturing semiconductor device that comprises a ...", "leaf_samples": [{"index": 110, "patent_id": "15-962881", "title": "Method for manufacturing semiconductor device that comprises a fin structure", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "111", "index": 111, "layer": 0, "node_type": "leaf", "children": [], "parents": ["218"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "16-133054", "title": "Self-adaptive batch dataset partitioning for distributed deep learning using hybrid set of accelerators", "text_preview": "Systems and methods are provided for implementing a self-adaptive batch dataset partitioning control process which is utilized in conjunction with a distributed deep learning model training process to optimize load balancing among a set of accelerator resources. An iterative batch size tuning process is configured to determine an optimal job partition ratio for partitioning mini-batch datasets into sub-batch datasets for processing by a set of hybrid accelerator resources, wherein the sub-batch datasets are partitioned into optimal batch sizes for processing by respective accelerator resources to minimize a time for completing the deep learning model training process.", "label": "16-133054 - Self-adaptive batch dataset partitioning for distributed deep l...", "leaf_samples": [{"index": 111, "patent_id": "16-133054", "title": "Self-adaptive batch dataset partitioning for distributed deep learning using hybrid set of accelerators", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "112", "index": 112, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "16-138346", "title": "Memory device with improved writing features", "text_preview": "The present invention relates to a method of performing a write access phase for a memory device and comprising:transferring a write data from a local input and output line to a bit line to write the data into a memory cell via the bit line by activating a column switch provided between the bit line and the local input and output line during a first period; andtransferring a read data read out from the memory cell to the local input and output line via the bit line by activating the column switch during a second period;wherein the first period is longer than the second period.", "label": "16-138346 - Memory device with improved writing features", "leaf_samples": [{"index": 112, "patent_id": "16-138346", "title": "Memory device with improved writing features", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "113", "index": 113, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "16-224498", "title": "Apparatuses and methods for memory device as a store for block program instructions", "text_preview": "The apparatuses and methods related to a memory device as the store to program instructions. An example apparatus comprises a memory device having an array of memory cells and sensing circuitry coupled to the array. The sensing circuitry includes a sense amplifier and a compute component configured to implement logical operations. A memory controller, coupled to the array and the sensing circuitry is configured to receive a block of instructions including a plurality of program instructions. The memory controller is configured to store the block of instructions in the array and retrieve program instructions to perform logical operations on the compute component.", "label": "16-224498 - Apparatuses and methods for memory device as a store for block ...", "leaf_samples": [{"index": 113, "patent_id": "16-224498", "title": "Apparatuses and methods for memory device as a store for block program instructions", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "114", "index": 114, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "16-272997", "title": "Customizable chip for ai applications", "text_preview": "In one embodiment, a computing device includes an input sensor providing an input data; a programmable logic device (PLD) implementing a convolutional neural network (CNN), wherein: each compute block of the PLD corresponds to one of a multiple of convolutional layers of the CNN, each compute block of the PLD is placed in proximity to at least two memory blocks, a first one of the memory blocks serves as a buffer for the corresponding layer of the CNN, and a second one of the memory blocks stores model-specific parameters for the corresponding layer of the CNN.", "label": "16-272997 - Customizable chip for ai applications", "leaf_samples": [{"index": 114, "patent_id": "16-272997", "title": "Customizable chip for ai applications", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "115", "index": 115, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "16-287587", "title": "Semiconductor device", "text_preview": "A semiconductor device includes: a first cell; a second cell; a first match line and a second match line; a first search line pair, first data being transmitted through the first search line pair; a second search line pair, second data being transmitted through the second search line pair; a first logical operation cell connected to the first search line pair and the first match line, and configured to drive the first match line based on a result of comparison between information held by the first and second cells and the first data; and a second logical operation cell connected to the second search line pair and the second match line, and configured to drive the second match line based on a result of comparison between information held by the first and second cells and the second data.", "label": "16-287587 - Semiconductor device", "leaf_samples": [{"index": 115, "patent_id": "16-287587", "title": "Semiconductor device", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "116", "index": 116, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "16-440477", "title": "Apparatuses and methods for logic/memory devices", "text_preview": "Apparatuses and methods are provided for logic/memory devices. An example apparatus comprises a plurality of memory components adjacent to and coupled to one another. A logic component is coupled to the plurality of memory components. At least one memory component comprises a memory device having an array of memory cells and sensing circuitry coupled to the array. The sensing circuitry includes a sense amplifier and a compute component. Timing circuitry is coupled to the array and sensing circuitry and configured to control timing of operations for the sensing circuitry. The logic component comprises control logic coupled to the timing circuitry. The control logic is configured to execute instructions to cause the sensing circuitry to perform the operations.", "label": "16-440477 - Apparatuses and methods for logic/memory devices", "leaf_samples": [{"index": 116, "patent_id": "16-440477", "title": "Apparatuses and methods for logic/memory devices", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "117", "index": 117, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "16-503692", "title": "Crystal seed layer for magnetic random access memory (mram)", "text_preview": "Some embodiments relate to a memory device. The memory device includes a magnetoresistive random-access memory (MRAM) cell comprising a magnetic tunnel junction (MTJ). The MTJ device comprises a stack of layers, comprising a bottom electrode disposed over a substrate. A seed layer disposed over the bottom electrode. A buffer layer is disposed between the bottom electrode and the seed layer. The buffer layer prevents diffusion of a diffusive species from the bottom electrode to the seed layer.", "label": "16-503692 - Crystal seed layer for magnetic random access memory (mram)", "leaf_samples": [{"index": 117, "patent_id": "16-503692", "title": "Crystal seed layer for magnetic random access memory (mram)", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "118", "index": 118, "layer": 0, "node_type": "leaf", "children": [], "parents": ["220"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "16-744067", "title": "Implementing logic function and generating analog signals using nor memory strings", "text_preview": "NOR memory strings may be used for implementations of logic functions involving many Boolean variables, or to generate analog signals whose magnitudes are each representative of the bit values of many Boolean variables. The advantage of using NOR memory strings in these manners is that the logic function or analog signal generation may be accomplished within one simultaneous read operation on the NOR memory strings.", "label": "16-744067 - Implementing logic function and generating analog signals using...", "leaf_samples": [{"index": 118, "patent_id": "16-744067", "title": "Implementing logic function and generating analog signals using nor memory strings", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "119", "index": 119, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "16-871815", "title": "Flash memory device and computing device including flash memory cells", "text_preview": "A flash memory device includes: first pads; second pads; third pads; a memory cell array; a row decoder block; a buffer block that stores a command and an address received from an external semiconductor chip through the first pads and provides the address to the row decoder block; a page buffer block that is connected to the memory cell array through bit lines, is connected to the third pads through data lines, and exchanges data signals with the external semiconductor chip through the data lines and the third pads; and a control logic block that receives the command from the buffer block, receives control signals from the external semiconductor chip through the second pads, and controls the row decoder block and the page buffer block based on the received command and the received control signals.", "label": "16-871815 - Flash memory device and computing device including flash memory...", "leaf_samples": [{"index": 119, "patent_id": "16-871815", "title": "Flash memory device and computing device including flash memory cells", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "120", "index": 120, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-133711", "title": "Technologies for memory and i/o efficient operations on homomorphically encrypted data", "text_preview": "Technologies for memory and I/O efficient operations on homomorphically encrypted data are disclosed. In the illustrative embodiment, a cloud compute device is to perform operations on homomorphically encrypted data. In order to reduce memory storage space and network and I/O bandwidth, ciphertext blocks can be manipulated as data structures, allowing operands for operations on a compute engine to be created on the fly as the compute engine is performing other operations, using orders of magnitude less storage space and bandwidth.", "label": "17-133711 - Technologies for memory and i/o efficient operations on homomor...", "leaf_samples": [{"index": 120, "patent_id": "17-133711", "title": "Technologies for memory and i/o efficient operations on homomorphically encrypted data", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "121", "index": 121, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-134936", "title": "Prefetching weights for use in a neural network processor", "text_preview": "A circuit for performing neural network computations for a neural network, the circuit comprising: a systolic array comprising a plurality of cells; a weight fetcher unit configured to, for each of the plurality of neural network layers: send, for the neural network layer, a plurality of weight inputs to cells along a first dimension of the systolic array; and a plurality of weight sequencer units, each weight sequencer unit coupled to a distinct cell along the first dimension of the systolic array, the plurality of weight sequencer units configured to, for each of the plurality of neural network layers: shift, for the neural network layer, the plurality of weight inputs to cells along the second dimension of the systolic array over a plurality of clock cycles and where each cell is configured to compute a product of an activation input and a respective weight input using multiplication circuitry.", "label": "17-134936 - Prefetching weights for use in a neural network processor", "leaf_samples": [{"index": 121, "patent_id": "17-134936", "title": "Prefetching weights for use in a neural network processor", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "122", "index": 122, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-139318", "title": "Scalable neural network accelerator architecture", "text_preview": "A scalable neural network accelerator may include a first circuit for selecting a sub array of an array of registers, wherein the sub array comprises LH rows of registers and LW columns of registers, and wherein LH and RH are integers. The accelerator may also include a register for storing a value that determines LH. In addition, the accelerator may include a first load circuit for loading data received from the memory bus into registers of the sub array.", "label": "17-139318 - Scalable neural network accelerator architecture", "leaf_samples": [{"index": 122, "patent_id": "17-139318", "title": "Scalable neural network accelerator architecture", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "123", "index": 123, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-185769", "title": "Storage device and neural network apparatus", "text_preview": "A storage device according to an embodiment is for storing weights being continuous values. The storage device includes: a shift register, an initialization circuit, an update control circuit, and a readout control circuit. The shift resistor includes a plurality of cells, each being arranged in series and storing information. A position of each of the plurality of cells corresponds to the weight. The initialization circuit writes the information to a cell in the shift register. The update control circuit shifts a position of the cell storing the information in a direction corresponding to a sign of an update amount by a number of cells corresponding to an absolute value of the update amount. The readout control circuit reads out the information and outputs an output value according to the weight corresponding to the position of the cell storing the information.", "label": "17-185769 - Storage device and neural network apparatus", "leaf_samples": [{"index": 123, "patent_id": "17-185769", "title": "Storage device and neural network apparatus", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "124", "index": 124, "layer": 0, "node_type": "leaf", "children": [], "parents": ["203"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-229748", "title": "Semiconducting metal oxide memory device using hydrogen-mediated threshold voltage modulation and methods for forming the same", "text_preview": "A memory device is provided, which may include a first electrode, a memory layer stack including at least one semiconducting metal oxide layer and at least one hydrogen-containing metal layer, and a second electrode. A semiconductor device is provided, which may include a semiconducting metal oxide layer containing a source region, a drain region, and a channel region, a hydrogen-containing metal layer located on a surface of the channel region, and a gate electrode located on the hydrogen-containing metal layer. Each hydrogen-containing metal layer may include at least one metal selected from platinum, iridium, osmium, and ruthenium at an atomic percentage that is at least 90%, and may include hydrogen atoms at an atomic percentage in a range from 0.001% to 10%. Hydrogen atoms may be reversibly impregnated into a respective semiconducting metal oxide layer to change resistivity and to encode a memory bit.", "label": "17-229748 - Semiconducting metal oxide memory device using hydrogen-mediate...", "leaf_samples": [{"index": 124, "patent_id": "17-229748", "title": "Semiconducting metal oxide memory device using hydrogen-mediated threshold voltage modulation and methods for forming the same", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "125", "index": 125, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-408323", "title": "Method and apparatus for managing power of ferroelectric or paraelectric logic and cmos based logic", "text_preview": "A packaging technology to improve performance of an AI processing system resulting in an ultra-high bandwidth system. An IC package is provided which comprises: a substrate; a first die on the substrate, and a second die stacked over the first die. The first die can be a first logic die (e.g., a compute chip, CPU, GPU, etc.) while the second die can be a compute chiplet comprising ferroelectric or paraelectric logic. Both dies can include ferroelectric or paraelectric logic. The ferroelectric/paraelectric logic may include AND gates, OR gates, complex gates, majority, minority, and/or threshold gates, sequential logic, etc. The IC package can be in a 3D or 2.5D configuration that implements logic-on-logic stacking configuration. The 3D or 2.5D packaging configurations have chips or chiplets designed to have time distributed or spatially distributed processing. The logic of chips or chiplets is segregated so that one chip in a 3D or 2.5D stacking arrangement is hot at a time.", "label": "17-408323 - Method and apparatus for managing power of ferroelectric or par...", "leaf_samples": [{"index": 125, "patent_id": "17-408323", "title": "Method and apparatus for managing power of ferroelectric or paraelectric logic and cmos based logic", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "126", "index": 126, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-468574", "title": "System of multiple stacks in a processor devoid of an effective address generator", "text_preview": "In one implementation devoid of an effective address generator a method of call operation comprises pushing one or more parameters onto a first stack, pushing the contents of one or more registers onto a second stack, popping off the first stack one or more of the parameters into one or more of the registers whose contents were pushed onto the second stack, performing register to register operations on the one or more registers whose contents were pushed onto the second stack with a result of the register to register operations being stored in a result register, the result register being one of the one or more registers whose contents were pushed onto the second stack, popping off the second stack the contents of all the one or more registers into their respective registers from which they came, and returning control to an instruction following the call.", "label": "17-468574 - System of multiple stacks in a processor devoid of an effective...", "leaf_samples": [{"index": 126, "patent_id": "17-468574", "title": "System of multiple stacks in a processor devoid of an effective address generator", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "127", "index": 127, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-556436", "title": "Heterogeneous memory system", "text_preview": "An example apparatus having a heterogenous memory system includes a first sensor layer, of a plurality of stacked sensor layers, including an array of pixels; and one or more semiconductor layers of the plurality of stacked sensor layers located beneath the first sensor layer, the one or more semiconductor layers configured to process pixel data output by the array of pixels, the one or more semiconductor layers including a first memory to store most significant bits (“MSBs”) of data involved in the processing of the pixel data; a second memory to store least significant bits (“LSBs”) of the data; and wherein the first memory has a lower bit error rate (“BER”) than the second memory.", "label": "17-556436 - Heterogeneous memory system", "leaf_samples": [{"index": 127, "patent_id": "17-556436", "title": "Heterogeneous memory system", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "128", "index": 128, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-561406", "title": "Approach for providing indirect addressing in memory modules", "text_preview": "An approach provides indirect addressing support for PIM. Indirect PIM commands include address translation information that allows memory modules to perform indirect addressing. Processing logic in a memory module processes an indirect PIM command and retrieves, from a first memory location, a virtual address of a second memory location. The processing logic calculates a corresponding physical address for the virtual address using the address translation information included with the indirect PIM command and retrieves, from the second memory location, a virtual address of a third memory location. This process is repeated any number of times until one or more indirection stop criteria are satisfied. The indirection stop criteria stop the process when work has been completed normally or to prevent errors. Implementations include the processing logic in the memory module working in cooperation with a memory controller to perform indirect addressing.", "label": "17-561406 - Approach for providing indirect addressing in memory modules", "leaf_samples": [{"index": 128, "patent_id": "17-561406", "title": "Approach for providing indirect addressing in memory modules", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "129", "index": 129, "layer": 0, "node_type": "leaf", "children": [], "parents": ["210"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-561454", "title": "Approach for managing near-memory processing commands and non-near-memory processing commands in a memory controller", "text_preview": "An approach is provided for managing PIM commands and non-PIM commands at a memory controller. A memory controller enqueues PIM commands and non-PIM commands and selects the next command to process based upon various selection criteria. The memory controller maintains and uses a page table to properly configure memory elements, such as banks in a memory module, for the next memory command, whether a PIM command or a non-PIM command. The page table tracks the status of memory elements as of the most recent memory command that was issued. The page table includes an “All Bank” entry that indicates the status of banks after processing the most recent PIM command. For example, the All Banks entry indicates whether all the banks have a row open and if so, specifies the open row for all the banks.", "label": "17-561454 - Approach for managing near-memory processing commands and non-n...", "leaf_samples": [{"index": 129, "patent_id": "17-561454", "title": "Approach for managing near-memory processing commands and non-near-memory processing commands in a memory controller", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "130", "index": 130, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-694184", "title": "Processing in memory implementing vliw controller", "text_preview": "An example apparatus includes a processing in memory (PIM) capable device having an array of memory cells and sensing circuitry coupled to the array. The PIM capable includes a row address strobe (RAS) component selectably coupled to the array. The RAS component is configured to select, retrieve a data value from, and input a data value to a specific row in the array. The PIM capable device also includes a RAS manager select
