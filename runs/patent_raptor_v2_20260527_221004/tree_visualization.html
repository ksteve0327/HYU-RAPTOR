26", "title": "뉴럴 프로세서, 이를 포함하는 뉴럴 프로세싱 장치 및 뉴럴 프로세싱 장치의 데이터 통신 모드 결정 방법(neural processor, neural processing device including the same, and method for determining data communication mode of neural processing device)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "217", "index": 217, "layer": 1, "node_type": "summary", "children": ["58", "70", "76", "77", "78", "100"], "parents": ["233"], "child_count": 6, "descendant_leaf_count": 6, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 5, "AC": 1}, "patent_id": "", "title": "", "text_preview": "제시된 특허들은 주로 반도체 패키지의 적층 구조, 재배선/인터포저 구성, 열 관리 및 미세 배선 형성 기술에 관한 것이다. 핵심 기술은 수직 적층된 반도체 패키지에서 칩 간 전기적 연결과 방열 성능을 개선하는 구조이다. 제1·제2 인쇄회로기판을 적층하고, 연결 구조물을 통해 두 기판을 접속하며, 제1 칩 아래에는 열 비아와 히트싱크를 배치해 방열을 강화한다. 또한 메모리 소자와 로직 소자 사이에 열전도층 또는 열절연 인터포저를 배치하여 열을 수평 방향으로 분산하거나 소자 간 열 전달을 줄인다. 다른 구성으로는 패키지 베이스 기판 위에 하부 재배선 구조, 연결 필러와 배선 패턴을 포함하는 인터포저, 상부 재배선 구조를 차례로 형성하고, 그 위에 복수의 반도체 칩을 이격 배치하는 패키지가 포함된다. 이는 칩 간 연결 경로를 확보하고 고집적 패키지 구성을 가능하게 한다. 또한 패키지 기판의 한쪽 면에는 제1 소자를, 반대쪽 면에는 재배선 프레임과 솔더볼을 배치하며, 재배선 프레임에는 제2 소자를 결합하고 솔더볼을 통해 인쇄회로기판과 연결하는 구조가 제안된다. 이 구조는 기판과 PCB 사이 공간을 활용해 추가 소자를 실장하고 재배선 기능을 제공한다. 열 관리 측면에서는 반도체 패키지의 리드 내부 또는 표면에 히트파이프를 통합하여 열 손실을 균일화하고 과열로 인한 패키지 손상 위험을 줄이며, 저가 재료 사용 가능성을 통해 비용 절감 효과도 기대한다. 마지막으로, 퓨즈 배선 폭을 줄이기 위해 퓨즈 인접 위치에 더미 퓨즈를 배치하고, 퓨즈 및 더미 퓨즈의 폭과 간격을 최소 설계 규칙으로 설정한다. 이를 통해 OPC 노광 조건을 최적화하여 최소 선폭의 퓨즈 형성을 가능하게 한다.", "label": "node 217 / layer 1 / leaves 6", "leaf_samples": [{"index": 58, "patent_id": "13-896472", "title": "Stacked semiconductor package", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 70, "patent_id": "16-503363", "title": "Semiconductor assemblies including vertically integrated circuits and methods of manufacturing the same", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 76, "patent_id": "17-100171", "title": "Semiconductor package including interposer", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 77, "patent_id": "17-368837", "title": "Opossum redistribution frame for configurable memory devices", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 78, "patent_id": "17-407224", "title": "Semiconductor package including lid with integrated heat pipe for thermal management and methods for forming the same", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 100, "patent_id": "12-938001", "title": "Semiconductor device", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "218", "index": 218, "layer": 1, "node_type": "summary", "children": ["49", "81", "104", "114", "121", "131", "139", "178", "187", "192"], "parents": ["229"], "child_count": 10, "descendant_leaf_count": 10, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AA": 1, "AB": 1, "AC": 5, "AD": 3}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 신경망 연산을 효율적으로 수행하기 위한 NPU/병렬 프로세서, 메모리 구조, 전력 제어, PIM 및 뉴로모픽 회로 기술에 관한 것이다. 핵심 기술은 인공신경망 모델의 구조 데이터나 데이터 지역성 정보를 이용해 프로세싱 엘리먼트 어레이와 NPU 메모리 시스템을 제어하는 스케줄링 구조이다. 이를 통해 신경망 연산 데이터의 배치와 접근을 최적화하여 처리 효율을 높인다. 또한 신경망 시스템의 전력 설정을 오류 없는 기준 설정과 오류 가능 설정으로 비교하여 출력 차이로 고수준 오류율을 산출하고, 오류율이 허용 범위를 넘으면 전압 또는 클록 주파수를 조정한다. 목적은 애플리케이션별 허용 오류 범위 내에서 에너지 효율을 개선하는 것이다. 연산 회로 측면에서는 다수의 셀로 구성된 시스토릭 어레이, 가중치 fetcher, 가중치 sequencer를 이용해 각 신경망 계층의 가중치를 어레이의 두 차원으로 순차 이동시키며, 각 셀이 활성값과 가중치의 곱을 수행한다. 이는 계층별 행렬/신경망 연산을 병렬화하기 위한 구성이다. PLD 기반 CNN 구현에서는 각 연산 블록이 CNN의 합성곱 계층에 대응하고, 각 블록 인근에 버퍼용 메모리와 모델 파라미터 저장용 메모리를 배치한다. 이를 통해 계층별 데이터 접근 지연을 줄이고 하드웨어 구현 효율을 높인다. 뉴로모픽 장치는 가중치를 저장하는 메모리 셀 어레이, 셀 전류를 디지털 데이터로 변환하는 ADC, 기준 셀과 기준 ADC, 그리고 셀 데이터와 기준 데이터를 비교하는 비교 회로를 포함한다. 목적은 메모리 기반 신경망 가중치 연산 및 판별을 수행하는 것이다. 메모리 장치 기술에서는 복수의 메모리 칩과 뱅크, 로직 회로를 이용해 호스트 명령과 주소에 따라 데이터를 기록하고, 서로 다른 입력 데이터에 기반한 PIM 연산을 모드별로 수행한다. 이는 메모리 내부 처리 기능을 통해 데이터 이동 부담을 줄이려는 구성이다. 또 다른 기술은 반복 가능한 난수 벡터 시퀀스와 보조 신경망의 소수 파라미터를 사용해 주 신경망 계층의 더 많은 파라미터를 생성한다. 목적은 저장해야 하는 파라미터 수를 줄이면서 필요한 계층 파라미터를 생성하는 것이다. 공유 물리 메모리 구조에서는 독립 접근 가능한 여러 메모리 섹션을 논리 메모리에 할당하고, 논리 주소를 섹션 표시와 행 주소로 매핑한다. 이를 통해 특정 애플리케이션 구성에 맞춰 다중 메모리 접근 명령을 처리한다. 마지막으로 병렬 프로세서는 행·열로 배열된 프로세싱 소자 어레이, 행 메모리 그룹, 열 메모리 그룹, 제1·제2 주소를 생성하는 제어기를 포함한다. 제어기가 제1 주소 생성 방식을 변경함으로써 서로 다른 형태의 콘볼루션 연산을 지원하는 것이 특징이다.", "label": "node 218 / layer 1 / leaves 10", "leaf_samples": [{"index": 49, "patent_id": "2023-7022541", "title": "신경망 프로세싱 유닛을 포함하는 전자 장치(electronic device including neural network processing unit)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 81, "patent_id": "17-712380", "title": "Self-regulating power management for a neural network system", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 104, "patent_id": "15-389273", "title": "Prefetching weights for use in a neural network processor", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 114, "patent_id": "16-272997", "title": "Customizable chip for ai applications", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 121, "patent_id": "17-134936", "title": "Prefetching weights for use in a neural network processor", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 131, "patent_id": "17-747491", "title": "Neuromorphic device and electronic device including the same", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 139, "patent_id": "18-515565", "title": "Memory device for processing in memory and operating method of memory device", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 178, "patent_id": "18-145236", "title": "Neural network with on-the-fly generation of the network parameters", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 187, "patent_id": "18-714655", "title": "Neural network device with configurable shared memory", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 192, "patent_id": "2021-0034787", "title": "병렬 프로세서, 병렬 프로세서의 주소 생성기, 그리고 병렬 프로세서를 포함하는 전자 장치(parallel processor, address generator of parallel processor, and electronic device including parallel processor)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "219", "index": 219, "layer": 1, "node_type": "summary", "children": ["105", "167", "168", "173"], "parents": ["229"], "child_count": 4, "descendant_leaf_count": 4, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AC": 1, "AD": 3}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 메모리 기반 연산과 데이터 전송 효율화를 통해 DNN 및 병렬 처리 성능을 높이는 하드웨어 기술에 관한 것이다. 핵심 기술은 DRAM 기반 컴퓨팅 셀을 배열로 구성한 DPU, 합성곱 계층 처리를 위한 다중 convolution engine, 멀티캐스트 DMA 전송, 그리고 복수 DMA 엔진에 의한 전송 명령 분할 처리이다. DRAM 처리 유닛은 하나 이상의 컴퓨팅 셀 배열과 컨트롤러를 포함한다. 각 열은 적어도 세 개의 DRAM 기반 셀 행을 가지며, 두 행의 데이터를 대상으로 논리 연산을 수행하고 그 결과를 제3 행에 저장한다. 컨트롤러는 해당 셀 배열이 DPU 연산을 수행하도록 설정한다. DNN 합성곱 처리 하드웨어는 여러 convolution engine을 사용하며, 입력 데이터와 가중치를 메모리에서 읽은 뒤 최소 두 개의 필터 윈도우 계산에 재사용할 수 있는 순서로 공급한다. 예를 들어 여러 엔진이 같은 가중치와 서로 다른 입력 데이터를 처리하되, 각 엔진의 입력 데이터는 적어도 두 사이클 동안 유지되어 연속 계산에 재사용된다. DMA 관련 기술은 시스템 메모리의 데이터를 타깃 메모리의 여러 파티션으로 멀티캐스트하거나, 하나의 DMA 전송 명령을 복수 DMA 엔진이 나누어 처리하는 방식이다. 멀티캐스트 DMA는 각 파티션에 유효 데이터를 쓰고, 추가로 필러 데이터를 null device 주소에 쓰는 동작을 생성할 수 있다. 복수 DMA 엔진 방식은 하나의 명령에서 전송 구간을 나누어 각각 수행한 뒤 전체 전송 완료 신호를 생성한다. 효과는 메모리 내부 또는 근접 연산을 통한 데이터 이동 감소, 합성곱 연산에서 입력 데이터와 가중치 재사용 증가, DMA 전송의 병렬성 및 메모리 로딩 효율 향상이다.", "label": "node 219 / layer 1 / leaves 4", "leaf_samples": [{"index": 105, "patent_id": "15-426033", "title": "Dpu architecture", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 167, "patent_id": "17-165014", "title": "Hardware implementation of convolutional layer of deep neural network", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 168, "patent_id": "17-301344", "title": "Data replication for accelerator", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 173, "patent_id": "17-515976", "title": "Dma engines configured to perform first portion data transfer commands with a first dma engine and second portion data transfer commands with second dma engine", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "220", "index": 220, "layer": 1, "node_type": "summary", "children": ["37", "107", "112", "113", "126", "134", "148", "175", "189", "190", "199"], "parents": ["235"], "child_count": 11, "descendant_leaf_count": 11, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AA": 1, "AC": 6, "AD": 4}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 주로 인공지능 연산기, 메모리/메모리-내 연산, 명령 실행 및 메모리 자원 관리 기술에 관한 것이다. 핵심 기술은 다음과 같다. 인공지능 연산 분야에서는 웨이트와 인풋 액티베이션을 저장하는 레지스터, 모드·오버플로우·언더플로우 상태에 따라 서로 다른 정밀도로 곱셈을 수행하는 플렉서블 멀티플라이어, 결과를 누산하는 새츄레이팅 애더를 포함하는 프로세싱 엘리먼트가 제시된다. 또한 2차원 매트릭스 연산으로 아웃풋 액티베이션을 생성하는 프로세싱 유닛과, 현재 작업 및 다음 대기 작업의 로드/스토어를 처리하는 로드/스토어 유닛을 포함하는 인공지능 코어 구조가 개시된다. 메모리 관련 기술로는 접근 라인 및 센스 라인 구성을 달리하여 비트 벡터 저장 형식을 시뮬레이션하는 방법, 쓰기 구간을 읽기 구간보다 길게 설정해 메모리 셀에 데이터를 기록하는 쓰기 접근 방법, 메모리 어레이와 센싱 회로의 컴퓨트 컴포넌트를 이용해 프로그램 명령을 저장·검색하고 논리 연산을 수행하는 구조가 포함된다. 또한 비동기 처리 자원을 이용해 클록 신호 없이 메모리 장치 내 비동기 프로세스 토폴로지를 생성하는 기술도 제시된다. 프로세서 및 명령 처리 분야에서는 유효 주소 생성기 없이 두 개의 스택과 레지스터 간 연산을 이용해 호출 동작을 수행하는 방법, 메모리 요청의 유틸리티와 에너지 비용에 기초해 요청 실행 순서를 스케줄링하는 메모리 컨트롤러 구조가 포함된다. 오프로드 명령어와 일반 명령어 사이의 메모리 순서를 보존하기 위해 메모리 주소 잠금, 캐시 동작 완료 후 잠금 해제, 멀티스레드 환경에서 젊은 비-오프로드 명령어 실행 제한을 수행하는 방식도 개시된다. 네트워크 및 메모리 풀 관리 분야에서는 사용자가 선택한 기준에 따라 네트워크 어댑터의 내부 로직이 패킷 지연 관련 이벤트 데이터를 샘플링하도록 명령을 생성하는 방법과, 클라이언트 API를 통해 애플리케이션 서버의 요청을 메모리 풀 동작으로 변환하여 RDMA, 메모리 할당/해제, 오프로드 작업을 수행하는 방법이 포함된다. 전체적으로 이들 발명의 목적은 인공지능 연산의 정밀도와 데이터 이동 효율을 높이고, 메모리 접근·연산·스케줄링을 개선하며, 오프로드 및 원격 메모리 자원 활용 시 명령 순서와 처리 효율을 보장하는 데 있다. 기대 효과는 연산 유연성 향상, 메모리 처리 효율 개선, 에너지 비용을 고려한 요청 처리, 프로그램 명령의 메모리 내 실행 지원, 오프로드 환경에서의 일관성 유지 및 메모리 풀 활용성 증대이다.", "label": "node 220 / layer 1 / leaves 11", "leaf_samples": [{"index": 37, "patent_id": "2022-0030597", "title": "프로세싱 엘리먼트, 이를 포함하는 뉴럴 프로세싱 장치 및 그의 연산 방법(processing element, neural processing device including same and method for calculating thereof)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 107, "paten  반도체 관련 구조에서 공간 활용, 온도 제어, 전기적 연결 및 접지 배치를 개선하기 위한 기술이다. 1. **커패시턴스 셀** 표준 셀 영역 외곽에 프레임 형상의 커패시턴스를 배치하는 구조이다. 기판 구조층의 확산 영역, 배선층의 전원 공급선, 제1·제2 전극과 유전체, 기판 콘택 및 커패시턴스 콘택으로 구성된다. 전원 공급선, 확산 영역, 커패시턴스 전극을 연결함으로써 표준 셀 주변 공간을 활용해 커패시턴스를 형성하고 전기적 연결을 제공한다. 2. **정전척** 유전체 지지플레이트 내부에 전극, 발열소자, 열전소자 및 공급라인을 배치한 구조이다. 제1 영역에는 발열소자와 제1 공급라인을, 제2 영역에는 열전소자와 제2 공급라인을 배치하며, 제2 공급라인은 수직 라인영역과 경사진 라인영역을 포함할 수 있다. 이를 통해 지지플레이트의 영역별 온도 제어가 가능하다. 3. **반도체 패키지** 기판과 반도체 칩을 포함하고, 기판 내부에 재배선층, 연결 패드 및 그라운드 전극을 형성한 패키지 구조이다. 연결 패드는 재배선층과 연결되며 외부 절연층 상면을 통해 노출되되 그 높이는 절연층 상면보다 낮다. 그라운드 전극은 재배선층보다 높은 위치에 형성되고 외부 절연층으로 덮인다. 패드와 접지 전극의 높이 및 절연층 배치를 조정해 패키지 내 전기적 연결 및 접지 구조를 구현한다.", "label": "node 230 / layer 2 / leaves 3", "leaf_samples": [{"index": 52, "patent_id": "13-064599", "title": "Semiconductor integrated circuit device", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 92, "patent_id": "2018-0020931", "title": "정전척 및 반도체처리장치의 제어장치(electrostatic chuck and device of controlling a semiconductor processing apparatus)", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 93, "patent_id": "2020-0117172", "title": "반도체 패키지(semiconductor package)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "231", "index": 231, "layer": 2, "node_type": "summary", "children": ["210"], "parents": ["243"], "child_count": 1, "descendant_leaf_count": 5, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 2, "AC": 2, "AD": 1}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 고성능 컴퓨팅용 IC 패키징 및 다이 구성 기술에 관한 것이다. 핵심 기술은 3D/2.5D 패키지에서 로직 다이와 컴퓨트 칩렛을 적층하거나, 제어 다이와 복수의 해시 다이를 하나의 IC 패키지에 집적하는 구조이다. AI 처리 시스템용 패키지는 기판, 제1 다이, 그 위에 적층된 제2 다이를 포함하며, CPU·GPU 등 로직 다이와 강유전 또는 준강유전 로직 기반 컴퓨트 칩렛을 포함할 수 있다. 해당 로직은 AND/OR 게이트, 복합 게이트, 다수결·소수결·임계값 게이트, 순차 로직 등을 포함한다. 목적은 AI 처리에서 초고대역폭 성능을 구현하고, 로직-온-로직 적층을 통해 시간적 또는 공간적으로 분산된 처리를 가능하게 하는 것이다. 적층 구조에서는 한 번에 하나의 칩 또는 칩렛만 고활성 상태가 되도록 로직을 분리해 운용하는 구성이 제시된다. 분산원장 처리용 ASIC 기술은 복수의 해시 다이, 이를 제어하는 제어 다이, 전기적 인터커넥터 및 IC 패키지를 포함한다. 제어 다이는 해시 다이보다 큰 공정 노드로 형성되어 기능별 다이를 분리하고 패키지 수준에서 통합한다. 또 다른 패키지 기술은 CPU 또는 지연시간 중심 코어인 제1 코어와, 가속기 또는 처리량 중심 코어인 제2 코어를 포함하는 다이를 사용한다. 각 다이는 외부 인터페이스, TCI 및 HBM 대응 메모리 인터페이스, 다이 간 인터페이스를 포함하며, 제1형 다이와 제2형 다이는 두 종류의 코어를 모두 갖되 코어 수 비율이 다르다. 효과는 고대역폭·고성능 처리 구현, 기능별 다이 최적화, 다양한 컴퓨팅 요구에 맞춘 코어 구성 유연성 확보, 패키지 수준의 비용 효율 향상이다.", "label": "node 231 / layer 2 / leaves 5", "leaf_samples": [{"index": 79, "patent_id": "17-478843", "title": "3d stack of split graphics processing logic dies", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 87, "patent_id": "18-375138", "title": "Multi-die chiplet-based application specific integrated circuit", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 109, "patent_id": "15-780070", "title": "Die and package", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 125, "patent_id": "17-408323", "title": "Method and apparatus for managing power of ferroelectric or paraelectric logic and cmos based logic", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 170, "patent_id": "17-408251", "title": "Method and apparatus to process an instruction for a distributed logic having tightly coupled accelerator core and processor core in a multi-dimensional packaging", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "232", "index": 232, "layer": 2, "node_type": "summary", "children": ["203"], "parents": ["243"], "child_count": 1, "descendant_leaf_count": 3, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1, "AB": 1, "AD": 1}, "patent_id": "", "title": "", "text_preview": "세 특허는 모두 인공지능 및 뉴럴 네트워크 처리 기술에 관한 것이다. 첫 번째 기술은 뉴럴 네트워크 장치에서 복수의 연산 그룹을 처리하기 위한 방법이다. 입력 피처맵, 커널, 태그 정보를 포함하는 연산 그룹을 획득하고, 유휴 연산 유닛을 할당해 컨벌루션 연산으로 중간 피처맵을 생성한다. 이후 태그 정보에 따라 후처리 유닛을 결정해 출력 피처맵을 생성한다. 이를 통해 연산 유닛과 후처리 유닛을 효율적으로 배정하여 뉴럴 네트워크 연산 성능을 높이는 것이 목적이다. 두 번째 기술은 사전학습 언어모델을 이용해 자연어 입력 텍스트로부터 지식 그래프를 구축하는 방법이다. 입력 텍스트에서 엔티티에 대응하는 노드를 생성하고, 생성된 노드 간 관계를 나타내는 엣지를 생성한다. 자연어 문장의 엔티티와 관계 구조를 추출해 지식 그래프 형태로 구성하는 것이 핵심이다. 세 번째 기술은 뉴럴 네트워크 모델의 가중치를 암호화해 보호하는 방법이다. 계층별 노드 연결을 나타내는 행렬의 가중치를 암호화하고, 뉴럴 네트워크 실행이 감지되면 동일한 방식으로 복호화하여 연산에 사용한다. 모델 가중치의 보안을 유지하면서 실행 시 필요한 처리를 가능하게 하는 효과가 있다.", "label": "node 232 / layer 2 / leaves 3", "leaf_samples": [{"index": 31, "patent_id": "2018-0160341", "title": "뉴럴 네트워크에서의 부하 균형을 위한 장치 및 방법(method and apparatus for load balancing in neural network)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 82, "patent_id": "17-811338", "title": "Multi-stage knowledge graph construction using models", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 165, "patent_id": "16-888885", "title": "Systems and methods for protecting neural network weights", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "233", "index": 233, "layer": 2, "node_type": "summary", "children": ["202", "213", "217"], "parents": ["243"], "child_count": 3, "descendant_leaf_count": 32, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AA": 3, "AB": 26, "AC": 3}, "patent_id": "", "title": "", "text_preview": "제시된 특허들은 반도체 소자 구조, 제조 공정, 패키징, 검사 및 열 관리 기술을 포괄한다. 핵심 기술은 이중 게이트·전하저장층 기반 시냅스 가중치 제어 소자, FinFET/핀 게이트 구조, GaN/HEMT 트랜지스터, 슈퍼정션 전력소자, Zener 다이오드 내장 구조, CAM 매치라인 구동 구조, 다층 오믹 전극 및 미세 퓨즈 배선 형성 기술이다. 또한 OPC 레이아웃의 꼭지점 좌표를 트랜스포머 모델에 입력해 MRC 위반 여부를 판단하는 제조 검증 기술도 포함된다. 목적은 반도체 소자의 전류 구동 능력, 고내압 특성, 온저항, 항복 내성, 스위칭 안정성, 회로 지연 특성 및 미세화 한계를 개선하는 것이다. 패키징 분야에서는 칩 간 전기적 연결성, 고집적 적층 구현, 방열 성능, 열 간섭 저감 및 패키지 신뢰성 향상을 목표로 한다. 주요 구성 요소는 소스/드레인, 게이트 절연막, 전하저장층, 리세스, 트렌치, 싱커층, 컬럼 영역, 핀, 소자 분리층, 확산 차단 영역, 도전성 플러그, 재배선 구조물, 인터포저, 연결 필러, 브릿지 칩, 관통 전극, 열 비아, 히트싱크, 히트파이프, 리드프레임, 본딩 패드 및 본딩 와이어 등이다. GaN/HEMT 구조에서는 평행한 소스·드레인 스트립, 빗살형 패드, 공통 게이트 및 확장 소스 핑거 접촉 구조가 사용된다. 제조 공정으로는 병렬 p-n층 반복 형성 및 확산, SDB 영역 산화막 손실 저감, 응력 보강 표면 확산을 이용한 원자 수준 평탄화, 레이저 박리층과 열확산층을 이용한 기판 박리, 박막층 전사 및 본딩, 진공 분위기 이온 도핑을 통한 태양전지 제조가 제안된다. 패키지 기술은 인쇄회로기판 적층, 재배선/인터포저 기반 칩 연결, 세라믹 기판 캐비티 내 브릿 을 메모리 내부에서 직접 처리하는 것이다. 일부 기술은 가상 주소 해석, 간접 주소 지정, 주소 변환 정보 포함 PIM 명령, 사이드밴드 채널, PIM 명령 큐, 페이지 테이블 및 뱅크 상태 추적을 통해 PIM 명령 실행 효율을 높인다. 주요 구성 요소는 호스트, 메모리 컨트롤러, PIM 가능 메모리 장치, 메모리 셀 어레이, 센싱 회로, RAS 구성요소와 RAS 관리자, PIM 명령 큐, 페이지 테이블, 주소 변환 정보, HBM 내 PIM 회로, 일관성 디렉토리 제어기, PimPF, 프로세싱 유닛, 메모리 뱅크, SRAM, MAC 유닛, 시프트 레지스터, 스파이킹 뉴럴 유닛, 다중 포트 메모리 장치, 인-메모리 처리 회로, 적층 메모리·산술 장치, MRAM/플래시 관련 회로 등이다. 구체적으로는 메모리 내부 로직이 주소 변환과 연쇄 간접 참조를 수행하거나, HBM과 일반 메모리가 공존하는 이종 메모리에서 물리 주소 공간별 명령어 세트를 생성한다. 또한 RAS 관리자가 계산 서브 연산 순서를 조정하고, PIM 요청의 버스트 길이를 늘려 페이지 단위 연산을 지원하며, 여러 인-메모리 연산을 하나의 매크로 연산 요청으로 처리한다. AI 연산 측면에서는 부동소수점 벡터를 고정소수점과 지수로 변환해 내적을 계산하거나, 다양한 정밀도의 MAC 연산을 지원하는 구조도 포함된다. 효과는 대용량 데이터를 CPU로 이동시키지 않고 메모리 내부에서 처리해 메모리 인터페이스 병목, 연산 지연, 전력 소모를 줄이는 것이다. 또한 PIM 전용 일관성 디렉토리와 다중 뱅크 병렬 처리 구조는 PIM 로드·저장 및 브로드캐스트 명령 처리 성능을 높이고, 적층 구조와 전극 연결은 신호 전달 지연과 소비 전력을 줄일 수 있다. MRAM 버퍼층, 플래시 인터페이스, 다중 칩 패키징 관련 기술은 메모리 신뢰성, 외부 칩과의 통신 효율, 공유 메모리 접근 제어 효율을 개선한다.", "label": "node 234 / layer 2 / leaves 21", "leaf_samples": [{"index": 6, "patent_id": "16-553537", "title": "Spiking neural unit", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 38, "patent_id": "2022-0102500", "title": "모델들에 의하여 공통으로 이용되는 정보에 기반하여 모델들을 구동하기 위한 전자 장치 및 그 방법(electronic device for driving models based on information commonly used by models and method thereof)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 108, "patent_id": "15-693378", "title": "Processing in memory", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 117, "patent_id": "16-503692", "title": "Crystal seed layer for magnetic random access memory (mram)", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 119, "patent_id": "16-871815", "title": "Flash memory device and computing device including flash memory cells", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 123, "patent_id": "17-185769", "title": "Storage device and neural network apparatus", "category": "AC", "category_name": "시스템 통합 및 데이터 f_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "", "title": "", "text_preview": "이 기술은 고전 컴퓨터에서 보손 양자비트의 동작을 시뮬레이션하기 위한 방법이다. 보손 큐비트를 위상공간 표현으로 모델링하고, 이를 복수의 가우시안 함수의 선형결합으로 구성한다. 각 가우시안 함수는 평균, 공분산 행렬, 가중 계수로 정의되며, 이 값들은 사용자 설정 에너지 파라미터와 큐비트 종류에 따라 결정된다. 시뮬레이션 중에는 양자 논리 게이트 변환 및 측정 연산을 적용하면서 각 가우시안 함수의 평균, 공분산 행렬, 가중 계수를 갱신한다. 이를 통해 실제 양자 하드웨어 없이도 고전 컴퓨터상에서 보손 큐비트의 상태 변화와 연산 과정을 모사할 수 있으며, 보손 기반 양자 시스템의 분석과 검증에 활용될 수 있다.", "label": "node 239 / layer 2 / leaves 1", "leaf_samples": [{"index": 18, "patent_id": "17-889900", "title": "System and method of bosonic qubits simulation", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "240", "index": 240, "layer": 2, "node_type": "summary", "children": ["214"], "parents": ["242"], "child_count": 1, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "", "title": "", "text_preview": "본 기술은 웨이퍼 공정에서 대상 웨이퍼의 최적 위치를 산출하는 방법이다. 공정 수율과 관련된 공정 데이터를 획득해 기존 저장 최적 위치로부터의 이탈 범위를 판단하고, 학습된 인공지능 모델로 웨이퍼 결함 데이터에 대응하는 척 유형을 결정한다. 이후 결정된 척 유형과 이탈 범위를 함께 고려하여 대상 웨이퍼의 최적 위치를 보정한다. 이를 통해 웨이퍼별 결함 특성과 공정 상태를 반영한 위치 결정이 가능하며, 공정 수율 향상과 위치 산출 정확도 개선을 목적으로 한다.", "label": "node 240 / layer 2 / leaves 1", "leaf_samples": [{"index": 99, "patent_id": "2024-0024567", "title": "웨이퍼 최적 위치를 결정하는 방법 및 이를 지원하는 전자 장치(method for determining optimal wafer position and electronic device supporting the same)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "241", "index": 241, "layer": 2, "node_type": "summary", "children": ["201"], "parents": ["242"], "child_count": 1, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "", "title": "", "text_preview": "NOR 메모리 스트링을 동시에 읽어 다수의 불리언 변수를 포함한 논리 함수를 구현하거나, 변수 비트값에 따른 아날로그 신호를 생성하는 기술이다. 하나의 동시 읽기 연산으로 논리 처리 또는 신호 생성을 메모리 , 팝카운트, 내적, MAC, 벡터 연산을 메모리 내부에서 수행합니다.\n- HBM, 적층 메모리, 3D 메모리, 메모리 결합 가속기처럼 메모리와 처리 회로를 물리적으로 가깝게 배치해 신호 이동 거리와 지연을 줄입니다.\n- PIM 명령 큐, 주소 변환 정보, 페이지 테이블, 간접 주소 지정, 사이드밴드 채널 등을 사용해 메모리 내부 연산 명령을 효율적으로 실행합니다.\n- 여러 인-메모리 연산을 하나의 매크로 연산이나 버스트 단위 요청으로 묶어 처리합니다.\n- DMA, NoC, 멀티뱅크 병렬 처리, 브로드캐스트 명령 등을 활용해 필요한 데이터 전송만 병렬·효율적으로 수행합니다.\n\n즉, 핵심은 **연산을 데이터가 있는 곳으로 이동시켜 CPU-메모리 간 왕복 전송을 줄이고, 대역폭 병목·지연·전력 소모를 낮추는 것**입니다.", "judge_score": "5", "judge_supported": "True", "judge_explanation": "답변은 데이터를 CPU/호스트로 이동시키지 않고 메모리 내부 또는 근접 위치에서 직접 연산한다는 공통 전략을 정확히 설명한다. PIM 회로, 센스 앰프, 메모리 셀 어레이, MAC, 내적, 팝카운트, HBM/3D 적층, 주소 변환 및 PIM 명령 처리 등 retrieved context에 명시된 요소들과도 잘 부합한다. reference answer의 핵심인 데이터 왕복 감소, 인터페이스 병목 완화, 지연·전력 감소도 의미적으로 일치한다.", "hit": "1", "rank": "1", "mrr": "1.0", "latency_seconds": "0.6353631019592285", "source_nodes": [{"rank": 1, "node_index": 243, "layer": 3, "score": 0.5103043913841248, "token_count": 429, "descendant_patent_ids": ["16-507493", "13-488459", "15-994284", "16-945220", "17-014695", "17-977535", "13-485920", "14-172636", "15-594891", "17-229748", "17-830981", "15-851449", "17-473428", "18-474579", "2023-0151359", "16-133054", "18-170753", "16-443858", "17-016053", "2022-0115796", "18-031065", "18-534487", "18-064121", "18-472482", "2020-0056641", "2021-0082497", "2022-0031987", "2023-0164326", "2023-7022541", "17-712380", "15-389273", "16-272997", "17-134936", "17-747491", "18-515565", "18-145236", "18-714655", "2021-0034787", "15-426033", "17-165014", "17-301344", "17-515976", "17-284480", "18-198579", "18-814438", "16-883153", "17-139318", "15-230388", "18-206526", "18-333377", "18-388161", "18-781029", "2019-0038606", "16-440716", "18-747118", "17-399694", "16-973087", "18-787752", "2018-0059775", "2022-0104522", "17-562751", "18-363333", "18-480466", "16-440477", "17-556436", "17-850517", "18-105442", "18-414782", "15-521856", "15-786346", "17-429873", "2024-7013765", "16-009456", "16-245406", "17-289227", "15-065746", "18-173242", "16-260331", "     let x;
    if (children.length === 0) {
      x = xCursor;
      xCursor += xGap;
    } else {
      const xs = children.map(childId => {
        edges.push([id, childId]);
        return place(childId, depth + 1);
      });
      x = xs.reduce((sum, value) => sum + value, 0) / xs.length;
    }
    const y = 70 + (maxLayer - node.layer) * yGap;
    positions.set(id, { x, y, depth });
    rows.push(id);
    return x;
  }

  const rootChildren = visibleChildren(null, query, mode);
  const rootXs = rootChildren.map(childId => place(childId, 1));
  const width = Math.max(980, xCursor + 86);
  const height = Math.max(760, 160 + (maxLayer + 1) * yGap);
  const rootX = rootXs.length ? rootXs.reduce((sum, value) => sum + value, 0) / rootXs.length : 90;
  positions.set(rootId, { x: rootX, y: 28, depth: 0 });
  return { positions, edges, visibleIds, width, height, query, mode };
}

function edgePath(a, b) {
  const dy = Math.max(42, (b.y - a.y) * 0.45);
  return `M ${a.x} ${a.y} C ${a.x} ${a.y + dy}, ${b.x} ${b.y - dy}, ${b.x} ${b.y}`;
}

function render() {
  currentHighlights = activeSourceSets();
  const layout = buildLayout();
  svg.setAttribute("width", layout.width);
  svg.setAttribute("height", layout.height);
  svg.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);
  svg.dataset.baseWidth = String(layout.width);
  svg.dataset.baseHeight = String(layout.height);
  svg.innerHTML = "";

  const labelLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
  for (let layer = Number(meta.num_layers); layer >= 0; layer--) {
    const y = 70 + (Number(meta.num_layers) - layer) * 210;
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", 18);
    text.setAttribute("y", y - 24);
    text.setAttribute("class", "column-label");
    text.textContent = layer === 0 ? `Layer 0 | leaves (${meta.layer_sizes[String(layer)]})` : `Layer ${layer} (${meta.layer_sizes[String(layer)]})`;
    labelLayer.appendChild(text);
  }
  svg.appendChild(labelLayer);

  const edgeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
  for (const [sourceId, targetId] of layout.edges) {
    const a = layout.positions.get(sourceId);
    const b = layout.positions.get(targetId);
    if (!a || !b) continue;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", edgePath(a, b));
    const selectedPath = selectedId && (sourceId === selectedId || targetId === selectedId);
    const qaPath = currentHighlights.path.has(sourceId) && currentHighlights.path.has(targetId);
    path.setAttribute("class", selectedPath || qaPath ? "edge highlight" : "edge");
    edgeLayer.appendChild(path);
  }
  svg.appendChild(edgeLayer);

  const nodeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const renderedIds = Array.from(layout.visibleIds).sort((a, b) => {
    const pa = layout.positions.get(a);
    const pb = layout.positions.get(b);
    return (pa?.x || 0) - (pb?.x || 0) || (pa?.y || 0) - (pb?.y || 0);
  });
  for (const id of renderedIds) {
    const node = byId.get(id);
    const pos = layout.positions.get(id);
    if (!node || !pos) continue;
    const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const matches = nodeMatches(node, layout.query);
    const isSource = currentHighlights.source.has(id);
    const isExpected = currentHighlights.expected.has(id);
    const isQaPath = currentHighlights.path.has(id);
    group.setAttribute(
      "class",
      `node ${node.node_type}${isQaPath ? " qa-path" : ""}${isSource ? " source" : ""}${isExpected ? " expected" : ""}${id === selectedId ? " selected" : ""}${matches ? " match" : ""}`
    );
    group.setAttribute("transform", `translate(${pos.x},${pos.y})`);
    group.setAttribute("data-id", id);
    group.addEventListener("click", () => {
      selectedId = id;
      render();
      renderDetails(node);
    });

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    const radius = node.node_type === "leaf" ? 5 : Math.min(18, 8 + Math.sqrt(node.descendant_leaf_count) * 1.25);
    circle.setAttribute("r", radius);
    circle.setAttribute("fill", nodeColor(node));
    group.appendChild(circle);

    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    const sourceRank = currentHighlights.rankById.get(id);
    title.textContent = `${node.label}\nchildren: ${node.child_count}\nleaves: ${node.descendant_leaf_count}${sourceRank ? "\nsource rank: " + sourceRank : ""}`;
    group.appendChild(title);

    const showLabel = layout.mode === "full"
      ? Number(node.layer) === 0
      : layout.mode === "all"
        ? node.node_type !== "leaf" || Number(node.layer) === 0 || matches
        : node.node_type !== "leaf" || matches;
    if (showLabel) {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      if (node.layer === 0) {
        text.setAttribute("x", 0);
        text.setAttribute("y", radius + 14);
        text.setAttribute("text-anchor", "middle");
      } else {
        text.setAttribute("x", radius + 7);
        text.setAttribute("y", 0);
      }
      text.setAttribute("class", node.node_type === "leaf" ? "muted-label" : "");
      text.textContent = node.node_type === "leaf"
        ? truncate(node.patent_id || node.title || node.label, layout.mode === "full" ? 18 : 44)
        : `#${node.index} | ${node.descendant_leaf_count} leaves`;
      group.appendChild(text);
    }
    if (sourceRank) {
      const rankText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      rankText.setAttribute("x", -3);
      rankText.setAttribute("y", 1);
      rankText.setAttribute("text-anchor", "middle");
      rankText.setAttribute("class", "source-rank");
      rankText.textContent = sourceRank;
      group.appendChild(rankText);
    }
    nodeLayer.appendChild(group);
  }
  svg.appendChild(nodeLayer);
  updateStats(layout.visibleIds.size);
  renderQaSummary();
  applyZoom(false);
}

function truncate(value, limit) {
  const text = String(value || "");
  return text.length > limit ? text.slice(0, limit - 1) + "..." : text;
}

function updateStats(visibleCount) {
  document.getElementById("stats").innerHTML = [
    ["Nodes", meta.total_nodes],
    ["Visible", visibleCount],
    ["Leaves", meta.leaf_nodes],
    ["Roots", meta.root_nodes.length]
  ].map(([label, value]) => `<div class="stat"><strong>${value}</strong><span>${label}</span></div>`).join("");
}

function renderLayers() {
  const rows = Object.entries(meta.layer_sizes)
    .sort((a, b) => Number(b[0]) - Number(a[0]))
    .map(([layer, size]) => `<div class="layer-row"><span>Layer ${escapeHtml(layer)}</span><strong>${size}</strong></div>`)
    .join("");
  document.getElementById("layers").innerHTML = `<h3>Layer Sizes</h3>${rows}`;
}

function renderLegend() {
  const rows = categoryKeys.map(key => {
    const name = meta.category_names[key] || key;
    const count = meta.categories[key] || 0;
    return `<div class="legend-row">
      <span class="legend-name"><span class="swatch" style="background:${colorByCategory.get(key)}"></span><span>${escapeHtml(key)} | ${escapeHtml(name)}</span></span>
      <strong>${count}</strong>
    </div>`;
  }).join("");
  document.getElementById("legend").innerHTML = `
    <h3>Node Color</h3>
    <div class="legend-note">Node fill color is category color. Blue/orange/green/red filled nodes are categories, not retrieval status. For summary nodes, fill color is the dominant descendant leaf category.</div>
    ${rows}
    <h3>Node Outline</h3>
    <div class="outline-legend">
      <div class="outline-row"><span class="outline-swatch source"></span><span>Retrieved source context for the selected QA/method</span></div>
      <div class="outline-row"><span class="outline-swatch expected"></span><span>Expected answer patent leaf</span></div>
      <div class="outline-row"><span class="outline-swatch both"></span><span>Both retrieved source and expected answer</span></div>
      <div class="outline-row"><span class="outline-swatch path"></span><span>On the highlighted source/answer tree path</span></div>
    </div>
  `;
}

function renderQaControls() {
  const container = document.getElementById("qaControls");
  if (!qaSources.qa_items || !qaSources.qa_items.length) {
    container.innerHTML = "<h3>QA Sources</h3><p class='subtitle'>No QA source map loaded.</p>";
    document.getElementById("qaSummary").style.display = "none";
    return;
  }
  document.getElementById("qaSummary").style.display = "block";
  const qa = activeQa() || qaSources.qa_items[0];
  activeQaIndex = qa.qa_index;
  const availableMethods = methodOrder.filter(method => qa.methods && qa.methods[method]);
  if (!availableMethods.includes(activeMethod)) activeMethod = availableMethods[0] || activeMethod;

  const qaOptions = qaSources.qa_items.map(item => {
    const label = `QA ${item.qa_index} | ${item.category || ""} | ${truncate(item.question, 74)}`;
    return `<option value="${escapeHtml(item.qa_index)}" ${Number(item.qa_index) === Number(activeQaIndex) ? "selected" : ""}>${escapeHtml(label)}</option>`;
  }).join("");
  const methodOptions = availableMethods.map(method => (
    `<option value="${escapeHtml(method)}" ${method === activeMethod ? "selected" : ""}>${escapeHtml(method)}</option>`
  )).join("");

  container.innerHTML = `
    <h3>QA Source Overlay</h3>
    <label>QA item
      <select id="qaSelect">${qaOptions}</select>
    </label>
    <label>Retrieval method
      <select id="methodSelect">${methodOptions}</select>
    </label>
    <button id="focusSources" type="button">Select first source node</button>
  `;

  document.getElementById("qaSelect").addEventListener("change", event => {
    activeQaIndex = Number(event.target.value);
    const nextQa = activeQa();
    const nextMethods = nextQa ? methodOrder.filter(method => nextQa.methods && nextQa.methods[method]) : [];
    if (!nextMethods.includes(activeMethod)) activeMethod = nextMethods[0] || activeMethod;
    renderQaControls();
    render();
    renderDetails(byId.get(selectedId));
  });
  document.getElementById("methodSelect").addEventListener("change", event => {
    activeMethod = event.target.value;
    render();
    renderDetails(byId.get(selectedId));
  });
  document.getElementById("focusSources").addEventListener("click", () => {
    const method = activeMethodData();
    const first = method && method.source_node_indices && method.source_node_indices.length
      ? String(method.source_node_indices[0])
      : null;
    if (first && byId.has(first)) {
      selectedId = first;
      render();
      renderDetails(byId.get(first));
    }
  });
}

function renderQaSummary() {
  const target = document.getElementById("qaSummary");
  if (!qaSources.qa_items || !qaSources.qa_items.length) return;
  const qa = activeQa();
  const method = activeMethodData();
  if (!qa || !method) {
    target.innerHTML = "No QA source selected.";
    return;
  }
  const sourceCount = (method.source_node_indices || []).length;
  const expectedCount = (qa.expected_node_indices || []).length;
  const sourceList = (method.source_nodes || []).slice(0, 8).map(source => {
    const expected = source.contains_expected ? "yes" : "no";
    return `#${source.node_index} L${source.layer} r${source.rank} expected=${expected}`;
  }).join("<br>");
  target.innerHTML = `
    <strong>Question type</strong><br>${escapeHtml(qa.question_type || "")}<br><br>
    <strong>Question</strong><br>${escapeHtml(qa.question)}<br><br>
    <strong>Method</strong>: ${escapeHtml(activeMethod)} |
    <strong>score</strong>: ${escapeHtml(method.judge_score || "-")} |
    <strong>hit/rank</strong>: ${escapeHtml(method.hit || "-")}/${escapeHtml(method.rank || "-")}<br>
    <strong>source nodes</strong>: ${sourceCount} |
    <strong>expected leaves</strong>: ${expectedCount}<br>
    <span class="subtitle">Fill color = category. Black outline = retrieved context source. Red outline = expected answer patent leaf. Green outline = both. Dashed outline = highlighted path.</span><br><br>
    ${sourceList ? `<strong>Top source nodes</strong><br>${sourceList}` : ""}
  `;
}

function categoryBars(node) {
  const entries = Object.entries(node.category_counts || {}).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return "";
  const max = Math.max(...entries.map(([, value]) => value));
  return `<div class="bar">${entries.map(([key, value]) => {
    const pct = max ? Math.round((value / max) * 100) : 0;
    return `<div class="bar-row">
      <span>${escapeHtml(key)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%;background:${colorByCategory.get(key) || "#94a3b8"}"></span></span>
      <strong>${value}</strong>
    </div>`;
  }).join("")}</div>`;
}

function connectedLeafList(node) {
  if (Number(node.layer) !== 1) return "";
  const leaves = (node.children || [])
    .map(childId => byId.get(String(childId)))
    .filter(child => child && Number(child.layer) === 0)
    .sort((a, b) => Number(a.index) - Number(b.index));
  if (!leaves.length) return "";
  return leaves.map(leaf => `
    <div class="connected-leaf">
      <strong>#${escapeHtml(leaf.index)} ${escapeHtml(leaf.patent_id || "")}</strong>
      <span>${escapeHtml(leaf.category || "")} | ${escapeHtml(truncate(leaf.title || leaf.text_preview || "", 92))}</span>
    </div>
  `).join("");
}

function renderDetails(node) {
  if (!node) {
    details.innerHTML = `<div class="empty">Select a node to inspect details.</div>`;
    return;
  }
  const highlights = activeSourceSets();
  const nodeId = String(node.index);
  const source = highlights.sourceById.get(nodeId);
  const badges = [];
  if (source) {
    badges.push(`<span class="badge source">QA source rank ${escapeHtml(source.rank)}</span>`);
    if (source.contains_expected) badges.push(`<span class="badge source">contains expected patent</span>`);
  }
  if (highlights.expected.has(nodeId)) {
    badges.push(`<span class="badge expected">expected answer patent leaf</span>`);
  }
  const leafSamples = (node.leaf_samples || []).map(leaf => `
    <div class="leaf-item">
      <strong>${escapeHtml(leaf.patent_id || "#" + leaf.index)}</strong>
      <span>${escapeHtml(leaf.category)} | ${escapeHtml(leaf.category_name)}</span><br>
      <span>${escapeHtml(truncate(leaf.title, 110))}</span>
    </div>
  `).join("");
  const connectedLeaves = connectedLeafList(node);
  details.innerHTML = `
    <h2>${escapeHtml(node.node_type === "leaf" ? "Leaf Patent" : "Summary Node")} #${escapeHtml(node.index)}</h2>
    ${badges.length ? `<div class="badge-row">${badges.join("")}</div>` : ""}
    <dl class="detail-kv">
      <dt>Layer</dt><dd>${escapeHtml(node.layer)}</dd>
      <dt>Children</dt><dd>${escapeHtml(node.child_count)}</dd>
      <dt>Desc. leaves</dt><dd>${escapeHtml(node.descendant_leaf_count)}</dd>
      <dt>Patent ID</dt><dd>${escapeHtml(node.patent_id || "-")}</dd>
      <dt>Category</dt><dd>${escapeHtml(node.category || node.dominant_category || "-")} | ${escapeHtml(node.category_name || "-")}</dd>
      <dt>Parents</dt><dd>${escapeHtml((node.parents || []).join(", ") || "-")}</dd>
      <dt>Child IDs</dt><dd>${escapeHtml((node.children || []).join(", ") || "-")}</dd>
      <dt>Source score</dt><dd>${source ? escapeHtml(Number(source.score || 0).toFixed(4)) : "-"}</dd>
      <dt>Source tokens</dt><dd>${source ? escapeHtml(source.token_count || "-") : "-"}</dd>
    </dl>
    <h3>Category Mix</h3>
    ${categoryBars(node) || "<p class='subtitle'>No category mix available.</p>"}
    <h3>Text Preview</h3>
    <div class="preview">${escapeHtml(node.text_preview || "")}</div>
    ${connectedLeaves ? `<h3>Connected L0 Leaves</h3><div class="connected-leaves">${connectedLeaves}</div>` : ""}
    <h3>Sample Leaf Patents</h3>
    <div class="leaf-list">${leafSamples || "<p class='subtitle'>No leaf samples.</p>"}</div>
  `;
}

function collapseSummaries() {
  collapsed = new Set(nodes.filter(node => node.node_type !== "leaf" && node.layer < Number(meta.num_layers)).map(node => node.id));
  for (const root of roots) collapsed.delete(root);
  render();
}

document.getElementById("expandAll").addEventListener("click", () => {
  collapsed.clear();
  render();
});
document.getElementById("collapseAll").addEventListener("click", collapseSummaries);
leftPanelButton.addEventListener("click", () => {
  layoutRoot.classList.toggle("left-collapsed");
  updatePanelButtons();
  applyZoom(false);
});
rightPanelButton.addEventListener("click", () => {
  layoutRoot.classList.toggle("right-collapsed");
  updatePanelButtons();
  applyZoom(false);
});
document.getElementById("zoomOutButton").addEventListener("click", () => {
  setZoom(zoomLevel - zoomStep);
});
document.getElementById("zoomInButton").addEventListener("click", () => {
  setZoom(zoomLevel + zoomStep);
});
document.getElementById("zoomResetButton").addEventListener("click", () => {
  setZoom(1);
});
document.getElementById("fitButton").addEventListener("click", () => {
  setZoom(1, false);
  canvasWrap.scrollTo({ top: 0, left: 0, behavior: "smooth" });
});
canvasWrap.addEventListener("wheel", event => {
  event.preventDefault();
  const factor = event.deltaY < 0 ? 1.12 : 0.88;
  setZoomAtPoint(zoomLevel * factor, event.clientX, event.clientY);
}, { passive: false });
canvasWrap.addEventListener("mousedown", event => {
  if (event.button !== 0) return;
  if (event.target.closest && event.target.closest(".node")) return;
  isPanning = true;
  panStartX = event.clientX;
  panStartY = event.clientY;
  panStartLeft = canvasWrap.scrollLeft;
  panStartTop = canvasWrap.scrollTop;
  canvasWrap.classList.add("panning");
  event.preventDefault();
});
window.addEventListener("mousemove", event => {
  if (!isPanning) return;
  const dx = event.clientX - panStartX;
  const dy = event.clientY - panStartY;
  canvasWrap.scrollLeft = panStartLeft - dx;
  canvasWrap.scrollTop = panStartTop - dy;
});
window.addEventListener("mouseup", () => {
  if (!isPanning) return;
  isPanning = false;
  canvasWrap.classList.remove("panning");
});
searchBox.addEventListener("input", render);
depthSelect.addEventListener("change", render);

renderLayers();
renderLegend();
renderQaControls();
updatePanelButtons();
render();
renderDetails(byId.get(selectedId));
</script>
</body>
</html>
