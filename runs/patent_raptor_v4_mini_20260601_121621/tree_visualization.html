egory": "AC", "category_counts": {"AC": 1}, "patent_id": "2024-7023709", "title": "근접 메모리 컴퓨팅 요소들에 대한 일관성 디렉토리 제어기 오버헤드를 줄이기 위한 메커니즘(mechanism for reducing coherence directory controller overhead for near-memory compute elements)", "text_preview": "PimPF(Processing In-Memory Probe Filter)으로 또한 지칭되는 병렬 프로세싱(PP) 레벨 일관성 디렉토리가 일관성 디렉토리 제어기에 추가된다. 일관성 디렉토리 제어기가 호스트로부터 브로드캐스트 PIM 커맨드를 수신하거나, 다수의 메모리 뱅크들로 병렬로 지향되는 PIM 커맨드를 수신하면, PimPF는 일관성 디렉토리 제어기의 기존 시스템 레벨 디렉토리들과 별개인 캐시 일관성을 위한 디렉토리를 유지함으로써 PIM 커맨드의 프로세싱을 가속화한다. PimPF는 브로드캐스트 PIM 커맨드에 의해 영향을 받는 메모리 주소들을 정의하는 주소 서명들에 따라 디렉토리를 유지한다. 2개의 구현들, 즉 레지스터들로의 PIM 로드들을 가속화하는 경량 구현과 레지스터들로의 PIM 로드들 및 메모리로의 PIM 저장들 둘 모두를 가속화하는 중량 구현이 설명된다.", "label": "2024-7023709 - 근접 메모리 컴퓨팅 요소들에 대한 일관성 디렉토리 제어기 오버헤드를 줄이기 위한 메커니즘(mechanism for...", "leaf_samples": [{"index": 149, "patent_id": "2024-7023709", "title": "근접 메모리 컴퓨팅 요소들에 대한 일관성 디렉토리 제어기 오버헤드를 줄이기 위한 메커니즘(mechanism for reducing coherence directory controller overhead for near-memory compute elements)", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "150", "index": 150, "layer": 0, "node_type": "leaf", "children": [], "parents": ["218"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "13-805649", "title": "Methods and systems for machine-learning based simulation of flow", "text_preview": "There is provided a method for modeling a hydrocarbon reservoir that includes generating a reservoir model comprising a plurality of sub regions. At least one of the sub regions is simulated using a training simulation to obtain a set of training parameters comprising state variables and boundary conditions of the at least one sub region. A machine learning algorithm is used to approximate, based on the set of training parameters, an inverse operator of a matrix equation that provides a solution to fluid flow through a porous media. The hydrocarbon reservoir can be simulated using the inverse operator approximated for the at least one sub region. The method also includes generating a data representation of a physical hydrocarbon reservoir can be generated in a non-transitory, computer-readable, medium based, at least in part, on the results of the simulation.", "label": "13-805649 - Methods and systems for machine-learning based simulation of fl...", "leaf_samples": [{"index": 150, "patent_id": "13-805649", "title": "Methods and systems for machine-learning based simulation of flow", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "151", "index": 151, "layer": 0, "node_type": "leaf", "children": [], "parents": ["225"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "14-748203", "title": "System and method for reducing functional ambiguity in visual contents", "text_preview": "The present disclosure relates to a method and a system for reducing functional ambiguity from an image. In one embodiment, an input image is received and processed to identify objects. Spatial proximity score of the identified objects are determined based on which functional proximity score of functionalities associated with the identified objects is further determined. Upon determining the functional proximity score, possible domain of all the functionalities associated with the identified objects is determined. Further, a domain score is determined based on which the ambiguity of the domain related to the input image is reduced. A text summary of objects, functionalities and possible domains associated with the input image is then generated upon mapping with one or more user profiles and displayed to end user.", "label": "14-748203 - System and method for reducing functional ambiguity in visual c...", "leaf_samples": [{"index": 151, "patent_id": "14-748203", "title": "System and method for reducing functional ambiguity in visual contents", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "152", "index": 152, "layer": 0, "node_type": "leaf", "children": [], "parents": ["223"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-230388", "title": "Mechanism for throttling untrusted interconnect agents", "text_preview": "A host system-on-chip (SoC) includes a network on chip (NoC) for transmitting local traffic between internal blocks of the SoC, an external processor link for receiving messages at the host SoC from an untrusted device. A traffic controller in the host SoC that is coupled with the external processor link monitors an amount of external traffic from the untrusted device over a set of one or more time intervals, detects a violation of a traffic policy based on the amount of external traffic, and in response to detecting the violation, reduces traffic in the NoC resulting from the messages from the untrusted device.", "label": "15-230388 - Mechanism for throttling untrusted interconnect agents", "leaf_samples": [{"index": 152, "patent_id": "15-230388", "title": "Mechanism for throttling untrusted interconnect agents", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "153", "index": 153, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-521856", "title": "Method and apparatus for distributed and cooperative computation in artificial neural networks", "text_preview": "An apparatus and method are described for distributed and cooperative computation in artificial neural networks. For example, one embodiment of an apparatus comprises: an input/output (I/O) interface; a plurality of processing units communicatively coupled to the I/O interface to receive data for input neurons and synaptic weights associated with each of the input neurons, each of the plurality of processing units to process at least a portion of the data for the input neurons and synaptic weights to generate partial results; and an interconnect communicatively coupling the plurality of processing units, each of the processing units to share the partial results with one or more other processing units over the interconnect, the other processing units using the partial results to generate additional partial results or final results. The processing units may share data including input neurons and weights over the shared input bus.", "label": "15-521856 - Method and apparatus for distributed and cooperative computatio...", "leaf_samples": [{"index": 153, "patent_id": "15-521856", "title": "Method and apparatus for distributed and cooperative computation in artificial neural networks", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "154", "index": 154, "layer": 0, "node_type": "leaf", "children": [], "parents": ["224"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-786346", "title": "Software-defined buffer/transposer for general matrix multiplication in a programmable ic", "text_preview": "Methods and apparatus are described for simultaneously buffering and reformatting (e.g., transposing) a matrix for high-speed data streaming in general matrix multiplication (GEMM), which may be implemented by a programmable integrated circuit (IC). Examples of the present disclosure increase the effective double data rate (DDR) memory throughput for streaming data into GEMM digital signal processing (DSP) engine multifold, as well as eliminate slow data reformatting on a host central processing unit (CPU). This may be accomplished through software-defined (e.g., C++) data structures and access patterns that result in hardware logic that simultaneously buffers and reorganizes the data to achieve linear DDR addressing.", "label": "15-786346 - Software-defined buffer/transposer for general matrix multiplic...", "leaf_samples": [{"index": 154, "patent_id": "15-786346", "title": "Software-defined buffer/transposer for general matrix multiplication in a programmable ic", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "155", "index": 155, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-793539", "title": "Neural bit embeddings for graphs", "text_preview": "An approach is provided in which a system transforms a set of embedding approximation values corresponding to a set of knowledge graph nodes into a set of binary valued embedding vectors. The system evaluates the set of binary valued embedding vectors against a query and a selects one of the binary valued embedding vectors based on the evaluation. The system then identifies one of the knowledge graph nodes that corresponds to the selected binary valued embedding vector and in turn, provides a result to the query based on the identified knowledge graph node.", "label": "15-793539 - Neural bit embeddings for graphs", "leaf_samples": [{"index": 155, "patent_id": "15-793539", "title": "Neural bit embeddings for graphs", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "156", "index": 156, "layer": 0, "node_type": "leaf", "children": [], "parents": ["223"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-851449", "title": "Inline ecc function for system-on-chip", "text_preview": "An example integrated circuit (IC) includes a network-on-chip (NoC), a master device coupled to the NoC, a memory controller coupled to the NoC configured to control a memory coupled to the IC, and an inline error-correcting code (ECC) circuit coupled to the NoC. The ECC circuit is configured to receive read and write transactions from the master device that target the memory, compute ECC data based on the read and write transactions, and provide outgoing transactions to the memory controller.", "label": "15-851449 - Inline ecc function for system-on-chip", "leaf_samples": [{"index": 156, "patent_id": "15-851449", "title": "Inline ecc function for system-on-chip", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "157", "index": 157, "layer": 0, "node_type": "leaf", "children": [], "parents": ["225"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-934496", "title": "Method for modifying segmentation model based on artificial intelligence, device and storage medium", "text_preview": "Embodiments of the present disclosure disclose a method for modifying a segmentation model based on artificial intelligence, a device and a storage medium. The method may include: acquiring a model parameter of the segmentation model, and performing a training on a feature vector corresponding to a preset generalized feature of a first training corpus via a neural network so as to acquire a model parameter of the preset generalized feature; performing a word segmentation on the first training corpus according to the model parameter of the segmentation model and the model parameter of the preset generalized feature, so as to acquire a segmentation result; and comparing the segmentation result with the first training corpus according to a preset rule, and modifying the model parameter of the segmentation model and a parameter of the neural network according to a comparison result.", "label": "15-934496 - Method for modifying segmentation model based on artificial int...", "leaf_samples": [{"index": 157, "patent_id": "15-934496", "title": "Method for modifying segmentation model based on artificial intelligence, device and storage medium", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "158", "index": 158, "layer": 0, "node_type": "leaf", "children": [], "parents": ["223"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-964901", "title": "Flexible address mapping for a noc in an integrated circuit", "text_preview": "Embodiments herein describe a SoC that includes a mapper that identifies a destination ID for routing a transaction through a NoC. In one embodiment, the NoC includes ingress and egress logic blocks which permit hardware elements in the SoC to transmit and receive data using the NoC. In one embodiment, the ingress logic blocks can include the mapper that identifies a destination ID for each transaction. In one embodiment, the mapper can receive a destination ID from the hardware element that submitted the transaction to the ingress logic block. In this case, the mapper can bypass the address map by using the provided destination ID. If a destination ID is not provided, however, the mapper can use an address provided in the transaction to identify the destination ID.", "label": "15-964901 - Flexible address mapping for a noc in an integrated circuit", "leaf_samples": [{"index": 158, "patent_id": "15-964901", "title": "Flexible address mapping for a noc in an integrated circuit", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "159", "index": 159, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-172515", "title": "Apparatus and methods for vector operations", "text_preview": "Aspects for vector operations in neural network are described herein. The aspects may include a vector caching unit configured to store a first vector and a second vector, wherein the first vector includes one or more first elements and the second vector includes one or more second elements. The aspects may further include one or more adders and a combiner. The one or more adders may be configured to respectively add each of the first elements to a corresponding one of the second elements to generate one or more addition results. The combiner may be configured to combine a combiner configured to combine the one or more addition results into an output vector.", "label": "16-172515 - Apparatus and methods for vector operations", "leaf_samples": [{"index": 159, "patent_id": "16-172515", "title": "Apparatus and methods for vector operations", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "160", "index": 160, "layer": 0, "node_type": "leaf", "children": [], "parents": ["217"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-260331", "title": "Generation of executable files corresponding to neural network models", "text_preview": "In an example, a neural network program corresponding to a neural network model is received. The neural network program includes matrices, vectors, and matrix-vector multiplication (MVM) operations. A computation graph corresponding to the neural network model is generated. The computation graph includes a plurality of nodes, each node representing a MVM operation, a matrix, or a vector. Further, a class model corresponding to the neural network model is populated with a data structure pointing to the computation graph. The computation graph is traversed based on the class model. Based on the traversal, the plurality of MVM operations are assigned to MVM units of a neural network accelerator. Each MVM unit can perform a MVM operation. Based on assignment of the plurality of MVM operations, an executable file is generated for execution by the neural network accelerator.", "label": "16-260331 - Generation of executable files corresponding to neural network ...", "leaf_samples": [{"index": 160, "patent_id": "16-260331", "title": "Generation of executable files corresponding to neural network models", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "161", "index": 161, "layer": 0, "node_type": "leaf", "children": [], "parents": ["214"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-318104", "title": "Method and system for fast determining time-delay stability margin of power system", "text_preview": "The present disclosure discloses a method for fast determining a time-delay stability margin of a power system, which focuses on three steps, i.e., Jordan standardization, Taylor separation and Schur simplification, to reconstruct a new time delay system and reduce the system dimension. In this method, firstly, a time delay model is Jordan standardized; further, Taylor expansion is applied in a process for separating state variables with time delay from stage variables without time delay; then, balanced model reduction is realized by Schur simplification; and finally, a WSCC 3-generator-9-bus power system with multiple delays will be used to validate the proposed method via several typical criteria.", "label": "16-318104 - Method and system for fast determining time-delay stability mar...", "leaf_samples": [{"index": 161, "patent_id": "16-318104", "title": "Method and system for fast determining time-delay stability margin of power system", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "162", "index": 162, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-443858", "title": "Constructing answers to queries through use of a deep model", "text_preview": "Various technologies relating to constructing an answer to a query are described herein, wherein the answer is in list form. The answer includes a header and a list element. A deep model receives content of a webpage that is deemed relevant to the query by a search engine and constructs the answer to the webpage upon receipt of the query.", "label": "16-443858 - Constructing answers to queries through use of a deep model", "leaf_samples": [{"index": 162, "patent_id": "16-443858", "title": "Constructing answers to queries through use of a deep model", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "163", "index": 163, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-528553", "title": "Systems and methods for power management of hardware utilizing virtual multilane architecture", "text_preview": "Aspects of the present disclosure are presented for a power management system of a multilane AI system architecture. The system may include an orchestrator configured to control power and other operations of a lane. An uber orchestrator manages the overall system, and may know all of the multilane systems within the AI virtual multilane system that need to be active at a given frequency and power envelope for given price, and performance constraints. The orchestrator of each lane knows the compute/logic blocks that need to be active for a given AI app model AI processing chain execution. The orchestrator may be configured to send commands to turn off power to certain components that are not utilized in performing an AI execution sequence, deactivate operation to the lane when its functions are completed, and also modulate the clock frequency of a lane to fit the computation demands while minimizing power usage.", "label": "16-528553 - Systems and methods for power management of hardware utilizing ...", "leaf_samples": [{"index": 163, "patent_id": "16-528553", "title": "Systems and methods for power management of hardware utilizing virtual multilane architecture", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "164", "index": 164, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-831552", "title": "Answer selection method for question answering system and the system", "text_preview": "Disclosed are an answer selection method for a question answering system. With the method and system, a sentence distributed representation of a question and an answer is generated by adopting a hierarchical length-adaptive neural network structure with a purpose of extracting high-quality sentence features by using different neural feature extractors according to a length of an input sentence. First, one word distributed representation is generated for each word in the input sentence by connecting one fixed word embedding and one finely-adjusted word embedding. Next, a BiLSTM-based feature extractor is used for a short sentence and a Transformer-based feature extractor is used for a long sentence. Finally, a sentence vector representation for measuring a correlation between a question and a candidate answer is generated by using an attention pooling layer considering an interaction between a question sentence and an answer sentence.", "label": "16-831552 - Answer selection method for question answering system and the s...", "leaf_samples": [{"index": 164, "patent_id": "16-831552", "title": "Answer selection method for question answering system and the system", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "165", "index": 165, "layer": 0, "node_type": "leaf", "children": [], "parents": ["216"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-888885", "title": "Systems and methods for protecting neural network weights", "text_preview": "The disclosed computer-implemented method may include (i) identifying a neural network that comprises an interconnected set of nodes organized in a set of layers represented by a plurality of matrices that each comprise a plurality of weights, where each weight represents a connection between a node in the interconnected set of nodes that resides in one layer in the set of layers and an additional node in the set of interconnected nodes that resides in a different layer in the set of layers, (ii) encrypting, using an encryption cipher, the plurality of weights, (iii) detecting that execution of the neural network has been initiated, and (iv) decrypting, using the encryption cipher, the plurality of weights in response to detecting that the execution of the neural network has been initiated. Various other methods, systems, and computer-readable media are also disclosed.", "label": "16-888885 - Systems and methods for protecting neural network weights", "leaf_samples": [{"index": 165, "patent_id": "16-888885", "title": "Systems and methods for protecting neural network weights", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "166", "index": 166, "layer": 0, "node_type": "leaf", "children": [], "parents": ["202"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-016053", "title": "Memory controllers including examples of calculating hamming distances for neural network and data center applications", "text_preview": "Examples of systems and method described herein provide for the processing of image codes (e.g., a binary embedding) at a memory controller with various memory devices. Such images codes may generated by various endpoint computing devices, such as Internet of Things (IoT) computing devices, Such devices can generate a Hamming processing request, having an image code of the image, to compare that representation of the image to other images (e.g., in an image dataset) to identify a match or a set of neural network results. Advantageously, examples described herein may be used in neural networks to facilitate the processing of datasets, so as to increase the rate and amount of processing of such datasets. For example, comparisons of image codes can be performed “closer” to the memory devices, e.g., at the memory controller coupled to memory devices.", "label": "17-016053 - Memory controllers including examples of calculating hamming di...", "leaf_samples": [{"index": 166, "patent_id": "17-016053", "title": "Memory controllers including examples of calculating hamming distances for neural network and data center applications", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "167", "index": 167, "layer": 0, "node_type": "leaf", "children": [], "parents": ["224"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-165014", "title": "Hardware implementation of convolutional layer of deep neural network", "text_preview": "Hardware implementations of, and methods for processing, a convolution layer of a DNN that comprise a plurality of convolution engines wherein the input data and weights are provided to the convolution engines in an order that allows input data and weights read from memory to be used in at least two filter-window calculations performed either by the same convolution engine in successive cycles or by different convolution engines in the same cycle. For example, in some hardware implementations of a convolution layer the convolution engines are configured to process the same weights but different input data each cycle, but the input data for each convolution engine remains the same for at least two cycles so that the convolution engines use the same input data in at least two consecutive cycles.", "label": "17-165014 - Hardware implementation of convolutional layer of deep neural n...", "leaf_samples": [{"index": 167, "patent_id": "17-165014", "title": "Hardware implementation of convolutional layer of deep neural network", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "168", "index": 168, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-301344", "title": "Data replication for accelerator", "text_preview": "A direct memory access (DMA) engine can be used to multicast data from system memory to a target memory for loading into an array. The DMA engine may include a controller that is configured to receive a data transfer request, and generate a set of write operations for the output interface. The set of write operations can include, for each of multiple partitions of the target memory, a write operation to write usable data from the multicast data to an address offset in the corresponding partition, and an additional write operation to write filler data from the multicast data to a null device address.", "label": "17-301344 - Data replication for accelerator", "leaf_samples": [{"index": 168, "patent_id": "17-301344", "title": "Data replication for accelerator", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "169", "index": 169, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-399694", "title": "Stacked device system", "text_preview": "Multiple device stacks are interconnected in a ring topology. The inter-device stack communication may utilize a handshake protocol. This ring topology may include the host so that the host may initialize and load the device stacks with data and/or commands (e.g., software, algorithms, etc.). The inter-device stack interconnections may also be configured to include/remove the host and/or to implement varying numbers of separate ring topologies. By configuring the system with more than one ring topology, and assigning different problems to different rings, multiple, possibly unrelated, machine learning tasks may be performed in parallel by the device stack system.", "label": "17-399694 - Stacked device system", "leaf_samples": [{"index": 169, "patent_id": "17-399694", "title": "Stacked device system", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "170", "index": 170, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-408251", "title": "Method and apparatus to process an instruction for a distributed logic having tightly coupled accelerator core and processor core in a multi-dimensional packaging", "text_preview": "A packaging technology to improve performance of an AI processing system resulting in an ultra-high bandwidth system. An IC package is provided which comprises: a substrate; a first die on the substrate, and a second die stacked over the first die. The first die can be a first logic die (e.g., a compute chip, CPU, GPU, etc.) while the second die can be a compute chiplet comprising ferroelectric or paraelectric logic. Both dies can include ferroelectric or paraelectric logic. The ferroelectric/paraelectric logic may include AND gates, OR gates, complex gates, majority, minority, and/or threshold gates, sequential logic, etc. The IC package can be in a 3D or 2.5D configuration that implements logic-on-logic stacking configuration. The 3D or 2.5D packaging configurations have chips or chiplets designed to have time distributed or spatially distributed processing. The logic of chips or chiplets is segregated so that one chip in a 3D or 2.5D stacking arrangement is hot at a time.", "label": "17-408251 - Method and apparatus to process an instruction for a distribute...", "leaf_samples": [{"index": 170, "patent_id": "17-408251", "title": "Method and apparatus to process an instruction for a distributed logic having tightly coupled accelerator core and processor core in a multi-dimensional packaging", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "171", "index": 171, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-429873", "title": "Multi-tile architecture for graphics operations", "text_preview": "Embodiments are generally directed to a multi-tile architecture for graphics operations. An embodiment of an apparatus includes a multi-tile architecture for graphics operations including a multi-tile graphics processor, the multi-tile processor includes one or more dies; multiple processor tiles installed on the one or more dies; and a structure to interconnect the processor tiles on the one or more dies, wherein the structure to enable communications between processor tiles the processor tiles.", "label": "17-429873 - Multi-tile architecture for graphics operations", "leaf_samples": [{"index": 171, "patent_id": "17-429873", "title": "Multi-tile architecture for graphics operations", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "172", "index": 172, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-457502", "title": "Resizable scratchpad memory", "text_preview": "Techniques for implementing a dynamically resizable memory region for alternative use in a memory are described. The techniques may include using two concurrent address maps corresponding to two address ranges for a memory represented as an array of memory blocks. The first address range can be mapped to the memory with starting addresses of the memory blocks incrementing sequentially along each row. The second address range can be mapped to the memory with starting addresses of the memory blocks incrementing sequentially along each column. When an access request is received having a target address belonging to the first address range, the target address is provided as the memory address to access the memory. When an access request having a target address belonging to the second address range, the target address is translated by address translation logic into a memory address to access the memory.", "label": "17-457502 - Resizable scratchpad memory", "leaf_samples": [{"index": 172, "patent_id": "17-457502", "title": "Resizable scratchpad memory", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "173", "index": 173, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-515976", "title": "Dma engines configured to perform first portion data transfer commands with a first dma engine and second portion data transfer commands with second dma engine", "text_preview": "A method for hardware management of DMA transfer commands includes accessing, by a first DMA engine, a DMA transfer command and determining a first portion of a data transfer requested by the DMA transfer command. Transfer of a first portion of the data transfer by the first DMA engine is initiated based at least in part on the DMA transfer command. Similarly, a second portion of the data transfer by a second DMA engine is initiated based at least in part on the DMA transfer command. After transferring the first portion and the second portion of the data transfer, an indication is generated that signals completion of the data transfer requested by the DMA transfer command.", "label": "17-515976 - Dma engines configured to perform first portion data transfer c...", "leaf_samples": [{"index": 173, "patent_id": "17-515976", "title": "Dma engines configured to perform first portion data transfer commands with a first dma engine and second portion data transfer commands with second dma engine", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "174", "index": 174, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-778134", "title": "Information processing device", "text_preview": "A novel information processing device with least signal transmission delay and low power consumption is provided. A storage device includes a first layer, a second layer, and a third layer. The first layer is provided with a circuit. The second layer is provided with a memory cell portion. The third layer is provided with a first electrode. The circuit has a function of switching and performing reading or writing of first data or second data from or to the memory cell portion. At least part of the second layer is stacked above the first layer. At least part of the third layer is stacked above the second layer. An arithmetic device includes a fourth layer and a fifth layer. The fourth layer is provided with a central processing device. The fifth layer is provided with a second electrode. At least part of the fifth layer is stacked above the fourth layer. The circuit is electrically connected to the central processing device through the first electrode and the second electrode.", "label": "17-778134 - Information processing device", "leaf_samples": [{"index": 174, "patent_id": "17-778134", "title": "Information processing device", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "175", "index": 175, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-850595", "title": "Asynchronous process topology in a memory device", "text_preview": "Apparatuses and methods can be related to generating an asynchronous process topology in a memory device. The topology can be generated based on the results of a number of processes. The processes can be asynchronous given that the processing resources that implement the processes do not use a clock signal to generate the topology.", "label": "17-850595 - Asynchronous process topology in a memory device", "leaf_samples": [{"index": 175, "patent_id": "17-850595", "title": "Asynchronous process topology in a memory device", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "176", "index": 176, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-994123", "title": "Multi-chip module (mcm) with multi-port unified memory", "text_preview": "Semiconductor devices, packaging architectures and associated methods are disclosed. In one embodiment, a multi-chip module (MCM) is disclosed. The MCM includes a common substrate and a first integrated circuit (IC) chip disposed on the common substrate. The first IC chip includes a first memory interface. A second IC chip is disposed on the common substrate and includes a second memory interface. A first memory device is disposed on the common substrate and includes memory and a first port coupled to the memory. The first port is configured for communicating with the first memory interface of the first IC chip. A second port is coupled to the memory and communicates with the second memory interface of the second IC chip. In-memory processing circuitry is coupled to the memory and controls transactions between the first memory device and the first and second IC chips.", "label": "17-994123 - Multi-chip module (mcm) with multi-port unified memory", "leaf_samples": [{"index": 176, "patent_id": "17-994123", "title": "Multi-chip module (mcm) with multi-port unified memory", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "177", "index": 177, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-064121", "title": "Using a hardware sequencer in a direct memory access system of a system on a chip", "text_preview": "In various examples, a VPU and associated components may be optimized to improve VPU performance and throughput. For example, the VPU may include a min/max collector, automatic store predication functionality, a SIMD data path organization that allows for inter-lane sharing, a transposed load/store with stride parameter functionality, a load with permute and zero insertion functionality, hardware, logic, and memory layout functionality to allow for two point and two by two point lookups, and per memory bank load caching capabilities. In addition, decoupled accelerators may be used to offload VPU processing tasks to increase throughput and performance, and a hardware sequencer may be included in a DMA system to reduce programming complexity of the VPU and the DMA system. The DMA and VPU may execute a VPU configuration mode that allows the VPU and DMA to operate without a processing controller for performing dynamic region based data movement operations.", "label": "18-064121 - Using a hardware sequencer in a direct memory access system of ...", "leaf_samples": [{"index": 177, "patent_id": "18-064121", "title": "Using a hardware sequencer in a direct memory access system of a system on a chip", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "178", "index": 178, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-145236", "title": "Neural network with on-the-fly generation of the network parameters", "text_preview": "The present description concerns a circuit comprising: a number generator (205) configured to generate a sequence of vectors (207, 219) of size , the vector sequence being the same at each start-up of the number generator; a memory (211) configured to store a set of first parameters (Ω) of an auxiliary neural network (204); a processing device configured to generate a set of second parameters of a layer (201) of a main neural network by the application a plurality of times of a first operation (g), by the auxiliary neural network, performing a generation operation from each vector generated by the number generator, each generation delivering a vector of second parameters, the set of the vectors of second parameters forming said set of second parameters; and wherein the number of second parameters is greater than the number of first parameters.", "label": "18-145236 - Neural network with on-the-fly generation of the network parame...", "leaf_samples": [{"index": 178, "patent_id": "18-145236", "title": "Neural network with on-the-fly generation of the network parameters", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "179", "index": 179, "layer": 0, "node_type": "leaf", "children": [], "parents": ["223"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-206526", "title": "Autonomous vehicle system on chip mailbox architecture", "text_preview": "A system-on-chip (SoC) designed for an autonomous vehicle includes a central chiplet to coordinate the operations of the SoC constituent chiplets. The central chiplet includes a shared memory storing a number of programs associated with parallel workload pipelines, one or more processors to execute a scheduling program, and a cache memory accessible by the chiplets of the SoC. The SoC also includes a sensor data input chiplet to receive sensor data from vehicle sensors and store the sensor data in the cache memory. The scheduling program running on the central chiplet schedules the programs and causes respective workloads of the parallel workload pipelines to execute based, at least in part, on the sensor data stored in the cache memory.", "label": "18-206526 - Autonomous vehicle system on chip mailbox architecture", "leaf_samples": [{"index": 179, "patent_id": "18-206526", "title": "Autonomous vehicle system on chip mailbox architecture", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "180", "index": 180, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-211577", "title": "Constructing prompt information for submission to a language model by dynamically compressing source information", "text_preview": "A technique for interacting with a machine-trained language model uses dynamic prompt management. The technique includes: receiving an input query and creating prompt information that expresses the input query and targeted context information. The targeted context information is selected from candidate context information. Further, a part of the prompt information is formed by compressing source information by reducing a number of content units in the source information (where the source information includes the input query and/or the candidate context information). The method further includes submitting the prompt information to the machine-trained language model, and receiving a response from the machine-trained language model based on the prompt information. The technique has the overall effect of reducing the number of content units submitted to the language model, which, in turn, reduces the amount of resources and time required by the language model to process the input query.", "label": "18-211577 - Constructing prompt information for submission to a language mo...", "leaf_samples": [{"index": 180, "patent_id": "18-211577", "title": "Constructing prompt information for submission to a language model by dynamically compressing source information", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "181", "index": 181, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-237702", "title": "Look selection based on relationships in a virtual environment", "text_preview": "A processor of a host can define a plurality of relationships in a virtual environment. The processor of the host can also provide the plurality of inputs describing look preferences to an AI accelerator. The AI accelerator can receive the inputs. The AI accelerator can also generate a plurality of looks based on the plurality of relationships and the plurality of inputs.", "label": "18-237702 - Look selection based on relationships in a virtual environment", "leaf_samples": [{"index": 181, "patent_id": "18-237702", "title": "Look selection based on relationships in a virtual environment", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "182", "index": 182, "layer": 0, "node_type": "leaf", "children": [], "parents": ["204"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-328852", "title": "Chiplet aware adaptable quantization", "text_preview": "A chiplet-based architecture may quantize, or reduce, the number of bits at various stages of the data path in an artificial-intelligence processor. This architecture may leverage the synergy between quantizing multiple dimensions together to greatly decrease the memory usage and data path bandwidth. Internal weights may be quantized statically after a training procedure. Accumulator bits and activation bits may be quantized dynamically during an inference operation. New hardware logic may be configured to quantize the outputs of each operation directly from the core or other processing node before the tensor is stored in memory. Quantization may use a statistic from a previous tensor for a current output tensor, while also calculating a statistic to be used on a subsequent output tensor. In addition to quantizing based on a statistic, bits can be further quantized using a Kth percentile clamping operation.", "label": "18-328852 - Chiplet aware adaptable quantization", "leaf_samples": [{"index": 182, "patent_id": "18-328852", "title": "Chiplet aware adaptable quantization", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "183", "index": 183, "layer": 0, "node_type": "leaf", "children": [], "parents": ["223"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-333377", "title": "Hardware-based image/video processing in machine learning-accelerator system-on-chip", "text_preview": "A machine learning (ML)-accelerator system-on-chip (SoC) is described. The ML-accelerator SoC includes a set of ML-accelerator cores. The ML-accelerator SoC also includes a network-on-chip (NoC) coupled to the set of ML-accelerator cores. The ML-accelerator SoC further includes an inference video post processing (infVPP) module coupled to the NoC. The ML-accelerator SoC also includes a video decoder coupled to the NoC.", "label": "18-333377 - Hardware-based image/video processing in machine learning-accel...", "leaf_samples": [{"index": 183, "patent_id": "18-333377", "title": "Hardware-based image/video processing in machine learning-accelerator system-on-chip", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "184", "index": 184, "layer": 0, "node_type": "leaf", "children": [], "parents": ["210"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-388161", "title": "Error tolerant ai accelerators", "text_preview": "A compute engine including a compute-in-memory (CIM) hardware module and weight decomposition write circuitry is described. The CIM hardware module stores weights corresponding to a matrix. The CIM hardware module is configured to perform a vector-matrix multiplication (VMM) for the matrix. The weight decomposition write circuitry is coupled with the CIM hardware module and is configured to store weight decomposition data corresponding to the matrix. The weight decomposition write circuitry is also configured to determine a replacement matrix for the matrix from the weight decomposition data and to provide the replacement matrix to the CIM hardware module.", "label": "18-388161 - Error tolerant ai accelerators", "leaf_samples": [{"index": 184, "patent_id": "18-388161", "title": "Error tolerant ai accelerators", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "185", "index": 185, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-418293", "title": "Multi-chip module (mcm) with multi-port unified memory", "text_preview": "Semiconductor devices, packaging architectures and associated methods are disclosed. In one embodiment, a multi-chip module (MCM) is disclosed. The MCM includes a common substrate and a first integrated circuit (IC) chip disposed on the common substrate. The first IC chip includes a first memory interface. A second IC chip is disposed on the common substrate and includes a second memory interface. A first memory device is disposed on the common substrate and includes memory and a first port coupled to the memory. The first port is configured for communicating with the first memory interface of the first IC chip. A second port is coupled to the memory and communicates with the second memory interface of the second IC chip. In-memory processing circuitry is coupled to the memory and controls transactions between the first memory device and the first and second IC chips.", "label": "18-418293 - Multi-chip module (mcm) with multi-port unified memory", "leaf_samples": [{"index": 185, "patent_id": "18-418293", "title": "Multi-chip module (mcm) with multi-port unified memory", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "186", "index": 186, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-472482", "title": "Efficient direct convolution using simd instructions", "text_preview": "A computer comprising one or more processors offering vector instructions may implement a direct convolution on a source data set. The source data set may be one-dimensional or multi-dimensional. For a given vector width, w, of the vector instructions, w consecutive data elements of the output data set are computed in parallel using vector instructions. For multi-dimensional data sets, multiple vectors of the output data set are computed for a single load of a set of vectors from the source data set. New vector instructions are disclosed to improve the performance of the convolution and to enable full utilization of the arithmetic logic units within the one or more processors.", "label": "18-472482 - Efficient direct convolution using simd instructions", "leaf_samples": [{"index": 186, "patent_id": "18-472482", "title": "Efficient direct convolution using simd instructions", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "187", "index": 187, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-714655", "title": "Neural network device with configurable shared memory", "text_preview": "Please cancel the previous version of the Abstract, and enter the following substitute A neural network device includes a shared physical memory that has a plurality of independently accessible memory sections. The neural network device further includes a data processor core to execute instructions. The instructions include at least one instruction involving multiple memory access operations specifying respective logical memory addresses in a plurality of logical memories. During configuration of the neural network device for a particular application, respective memory sections of the plurality of independently accessible memory sections are assigned to respective logical memories of the plurality of logical memories. In accordance with the configuration, each logical memory address of the respective logical memory addresses is mapped to a physical address by providing an indication of a memory section of the plurality of independently accessible memory sections and a row address within the memory section.", "label": "18-714655 - Neural network device with configurable shared memory", "leaf_samples": [{"index": 187, "patent_id": "18-714655", "title": "Neural network device with configurable shared memory", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "188", "index": 188, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-809778", "title": "Reduced data representation memory controller and related chiplet sets", "text_preview": "A transform memory controller and method are described herein wherein the transform memory controller comprises logic elements configured to perform desired transform operations on data that flows to-and-from conventional computer memory elements. The transform operations are configured to perform operations on such data without the need for such data to travel to-and-from the conventional computer memory element via the processor (e.g., Central Processing Unit (CPU)) of the computer system. Several desirable transform operations are herein disclosed.", "label": "18-809778 - Reduced data representation memory controller and related chipl...", "leaf_samples": [{"index": 188, "patent_id": "18-809778", "title": "Reduced data representation memory controller and related chiplet sets", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "189", "index": 189, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-916370", "title": "Intelligent exposure of hardware latency statistics within an electronic device or system", "text_preview": "A method includes presenting, by a processing device, in a user interface of a display device, a set of menu items associated with a plurality of criteria and detecting one or more input signals from one or more selections of the set of menu items. The method includes creating a command that includes one or more criteria corresponding to selected options of the plurality of criteria derived from the one or more input signals. The method includes sending, by the processing device, the command to a network adapter device to trigger a polling operation to be performed that causes internal logic of the network adapter device to sample event data associated with a latency of data packets sent by a hardware process that is specific to the one or more criteria.", "label": "18-916370 - Intelligent exposure of hardware latency statistics within an e...", "leaf_samples": [{"index": 189, "patent_id": "18-916370", "title": "Intelligent exposure of hardware latency statistics within an electronic device or system", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "190", "index": 190, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-980592", "title": "Memory pool operation method and apparatus", "text_preview": "A memory pool operation method includes that a client provides a first interface, where the first interface includes one or more application programming interfaces (APIs) corresponding to algorithmic logic, and the algorithmic logic is used to convert an operation request sent by an application server into an operation on a memory pool. The client calls the first interface to generate a first operation request, and sends the first operation request to the memory pool, to perform one or more of the following operations on the memory pool based on the first operation request: a remote direct memory access (RDMA) operation, a memory allocation or release operation, and an offloading operation.", "label": "18-980592 - Memory pool operation method and apparatus", "leaf_samples": [{"index": 190, "patent_id": "18-980592", "title": "Memory pool operation method and apparatus", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "191", "index": 191, "layer": 0, "node_type": "leaf", "children": [], "parents": ["210"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2020-0044621", "title": "메모리에서 매크로 연산을 수행하기 위한 기술(technologies for performing macro operations in memory)", "text_preview": "인-메모리 매크로 연산들을 수행하기 위한 기술들은 메모리 매체에 접속된 매체 액세스 회로를 갖는 메모리를 포함한다. 매체 액세스 회로는 다수의 인-메모리 연산의 세트를 나타내는 인-메모리 매크로 연산을 수행하기 위한 요청을 수신한다. 매체 액세스 회로는 또한, 요청에 응답하여, 메모리 매체에 존재하는 데이터에 대해 인-메모리 매크로 연산을 수행한다.", "label": "2020-0044621 - 메모리에서 매크로 연산을 수행하기 위한 기술(technologies for performing macro oper...", "leaf_samples": [{"index": 191, "patent_id": "2020-0044621", "title": "메모리에서 매크로 연산을 수행하기 위한 기술(technologies for performing macro operations in memory)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "192", "index": 192, "layer": 0, "node_type": "leaf", "children": [], "parents": ["212"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2021-0034787", "title": "병렬 프로세서, 병렬 프로세서의 주소 생성기, 그리고 병렬 프로세서를 포함하는 전자 장치(parallel processor, address generator of parallel processor, and electronic device including parallel processor)", "text_preview": "본 발명은 병렬 프로세서에 관한 것이다. 본 발명의 병렬 프로세서는 행들 및 열들로 배열되는 복수의 프로세싱 소자들을 포함하는 프로세싱 소자 어레이, 프로세싱 소자들의 행들에 대응하는 행 메모리들을 포함하는 행 메모리 그룹, 프로세싱 소자들의 열들에 대응하는 열 메모리들을 포함하는 열 메모리 그룹, 그리고 제1 주소 및 제2 주소를 생성하고, 제1 주소를 행 메모리 그룹에 전달하고, 그리고 제2 주소를 열 메모리 그룹에 전달하는 제어기를 포함한다. 제어기는 제1 주소의 생성 방식을 변경함으로써, 서로 다른 형태의 콘볼루션 연산을 지원한다.", "label": "2021-0034787 - 병렬 프로세서, 병렬 프로세서의 주소 생성기, 그리고 병렬 프로세서를 포함하는 전자 장치(parallel proc...", "leaf_samples": [{"index": 192, "patent_id": "2021-0034787", "title": "병렬 프로세서, 병렬 프로세서의 주소 생성기, 그리고 병렬 프로세서를 포함하는 전자 장치(parallel processor, address generator of parallel processor, and electronic device including parallel processor)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "193", "index": 193, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2022-0115796", "title": "하이브리드 데이터베이스 가속 장치, 시스템 및 방법(device, system and method for hybrid database scan acceleration)", "text_preview": "가속기가 개시된다. 하드웨어는 데이터베이스에 대한 쿼리를 처리할 수 있다. 저장소는 데이터베이스에서 쿼리를 처리하는 소프트웨어를 저장할 수 있다. 코디네이터는 데이터베이스에 대한 쿼리의 결과를 생성하기 위해 쿼리에 적어도 부분적으로 기반하여 데이터베이스에 대한 쿼리를 처리하도록 하드웨어 및 소프트웨어를 관리할 수 있다.", "label": "2022-0115796 - 하이브리드 데이터베이스 가속 장치, 시스템 및 방법(device, system and method for hybr...", "leaf_samples": [{"index": 193, "patent_id": "2022-0115796", "title": "하이브리드 데이터베이스 가속 장치, 시스템 및 방법(device, system and method for hybrid database scan acceleration)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "194", "index": 194, "layer": 0, "node_type": "leaf", "children": [], "parents": ["212"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2023-0063492", "title": "연산 방법, 장치, 칩, 전자 기기 및 저장 매체(computing method, apparatus, chips, electronic devices and storage medium)", "text_preview": "본 발명은 컴퓨터 기술 분야에 관한 것으로, 특히 칩 기술 분야, 인공지능 분야에 관한 연산 방법, 장치, 칩, 전자 기기 및 저장 매체를 제공한다. 구현 방식은, 연산 장치에 입력된 제1 벡터의 다수의 제1 부동 소수점 및 제2 벡터의 다수의 제2 부동 소수점에 기반하여, 다수의 제1 부동 소수점에 상응하는 다수의 제1 고정 소수점 및 다수의 제1 지수, 및 다수의 제2 부동 소수점에 상응하는 다수의 제2 고정 소수점 및 다수의 제2 지수를 획득하고; 다수의 제1 고정 소수점 중의 각각의 제1 고정 소수점 및 이에 대응되는 제2 고정 소수점의 고정 소수점 곱셈 값 및 상응하는 고정 소수점 곱 지수를 획득하며; 다수의 고정 소수점 곱셈 값 중의 각각의 고정 소수점 곱셈 값에 상응하는 고정 소수점 곱 지수에 기반하여, 제1 벡터 및 제2 벡터의 고정 소수점 내적 계산 결과를 획득하고; 고정 소수점 내적 계산 결과에 기반하여, 고정 소수점 내적 계산 결과에 대응되는 부동 소수점 데이터 포맷의 부동 소수점 내적 계산 결과를 획득하는 것이다.", "label": "2023-0063492 - 연산 방법, 장치, 칩, 전자 기기 및 저장 매체(computing method, apparatus, chips,...", "leaf_samples": [{"index": 194, "patent_id": "2023-0063492", "title": "연산 방법, 장치, 칩, 전자 기기 및 저장 매체(computing method, apparatus, chips, electronic devices and storage medium)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "195", "index": 195, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2023-0104046", "title": "인공지능 모델을 이용하여 연산을 수행하는 전자 장치 및 전자 장치의 동작 방법(electronic device and operation method of electronic device for performing calculation using artificial intelligence model)", "text_preview": "MAC(multiply and accumulate)연산을 수행하는 전자 장치는 적어도 하나의 MAC 유닛, SRAM(static random access memory), 1개의 8bx8b 연산기, 2개의 8bx4b 연산기, 1개의 4bx4b 연산기, 비트 시프트(bit shift), 덧셈기, 적어도 하나의 누적회로(accumulator),및 프로세서를 포함하고, 프로세서는 12비트(bits)로 구성된 제 1 비트열 데이터 및 제 2 비트열 데이터를 수신하고, 제 1 비트열 데이터를 4개 비트 및 8개 비트로 분류하고, 제 2 비트열 데이터를 4개 비트 및 8개 비트로 분류하며, A8W8(activation 8-bit, weight 8-bit)의 결과를 출력하는 것으로 결정됨에 기반하여 비트 시프터와 제 1 누적회로를 이용하여 A8W8에 대응하는 두 개의 8비트 결과를 출력하고, A12W12(activation 12-bit, weight 12-bit)의 결과를 출력하는 것으로 결정됨에 기반하여 A12W12에 대응하는 1 개의 12비트 결과를 출력할 수 있다.", "label": "2023-0104046 - 인공지능 모델을 이용하여 연산을 수행하는 전자 장치 및 전자 장치의 동작 방법(electronic device a...", "leaf_samples": [{"index": 195, "patent_id": "2023-0104046", "title": "인공지능 모델을 이용하여 연산을 수행하는 전자 장치 및 전자 장치의 동작 방법(electronic device and operation method of electronic device for performing calculation using artificial intelligence model)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "196", "index": 196, "layer": 0, "node_type": "leaf", "children": [], "parents": ["212"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2023-0164326", "title": "뉴럴 프로세서, 이를 포함하는 뉴럴 프로세싱 장치 및 뉴럴 프로세싱 장치의 데이터 통신 모드 결정 방법(neural processor, neural processing device including the same, and method for determining data communication mode of neural processing device)", "text_preview": "본 발명은 뉴럴 프로세싱 장치에 대해 개시한다. 몇몇 실시예에 따른 뉴럴 프로세싱 장치는 제1 동작 주파수 및 상기 제1 동작 주파수와 다른 제2 동작 주파수에서 동작하는 제1 블록, 상기 제1 동작 주파수에서 동작하는 제2 블록 및 상기 제1 블록 및 상기 제2 블록의 데이터 통신을 제어하고, 상기 제1 블록 및 상기 제2 블록 사이의 제1 인터페이스에 대한 제1 데이터 통신 모드를 결정하는 데이터 통신 모드 결정기를 포함한다.", "label": "2023-0164326 - 뉴럴 프로세서, 이를 포함하는 뉴럴 프로세싱 장치 및 뉴럴 프로세싱 장치의 데이터 통신 모드 결정 방법(neura...", "leaf_samples": [{"index": 196, "patent_id": "2023-0164326", "title": "뉴럴 프로세서, 이를 포함하는 뉴럴 프로세싱 장치 및 뉴럴 프로세싱 장치의 데이터 통신 모드 결정 방법(neural processor, neural processing device including the same, and method for determining data communication mode of neural processing device)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "197", "index": 197, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2023-7024085", "title": "고정 기능 동작들을 사용하는 오프로딩된 명령어들의프로세서-안내된 실행(processor-guided execution of offloaded instructions using fixed function operations)", "text_preview": "고정 기능 동작(fixed function operation)들을 사용하는 _id": "2025-0016785", "title": "인공지능 코어, 인공지능 코어 시스템 및 인공지능 코어 시스템의 로드/스토어 방법(ai core, ai core system and load/store method of ai core system)", "text_preview": "본 발명은 인공지능 코어, 인공지능 코어 시스템 및 인공지능 코어 시스템의 로드/스토어 방법을 개시한다. 상기 인공지능 코어는, 인풋 액티베이션 및 웨이트를 수신하여 2차원 매트릭스 연산을 통해 아웃풋 액티베이션을 생성하는 프로세싱 유닛 및 외부 인터페이스를 통해서 수신한 상기 프로그램 및 상기 입력 데이터를 상기 온 칩 버퍼로 전달하고, 상기 출력 데이터를 상기 온 칩 버퍼로부터 상기 인터페이스로 전달하는 로드/스토어 작업을 수행하고, 상기 로드/스토어 작업은 상기 프로세싱 유닛이 수행하는 현재 실행 작업에 대한 메인 로드/스토어 작업과, 상기 프로세싱 유닛이 상기 현재 실행 작업 다음에 실행하는 대기 실행 작업에 대한 대기 로드/스토어 작업을 포함하는 로드/스토어 유닛을 포함한다.", "label": "2025-0016785 - 인공지능 코어, 인공지능 코어 시스템 및 인공지능 코어 시스템의 로드/스토어 방법(ai core, ai core ...", "leaf_samples": [{"index": 199, "patent_id": "2025-0016785", "title": "인공지능 코어, 인공지능 코어 시스템 및 인공지능 코어 시스템의 로드/스토어 방법(ai core, ai core system and load/store method of ai core system)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "200", "index": 200, "layer": 1, "node_type": "summary", "children": ["81", "141", "163", "177", "181"], "parents": ["229"], "child_count": 5, "descendant_leaf_count": 5, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AB": 1, "AC": 1, "AD": 3}, "patent_id": "", "title": "", "text_preview": "이 문서는 AI/신경망 시스템의 전력 효율, 데이터 처리 성능, 네트워크 I/O 최적화, 가상환경 기반 생성 기능을 다룬다. 핵심 기술은 신경망을 오류 없는 전력 설정과 오류 가능성이 있는 전력 설정에서 각각 실행해 출력 차이를 비교하고, 이를 통해 오류 가능성이 있는 전력 설정에서의 고수준 오류율을 산정하는 것이다. 오류율이 과도하면 전압이나 클록 주파수를 변경해 오류를 줄이고, 허용 범위 내이면 해당 전력 설정을 유지해 허용 가능한 오류 내에서 효율을 높일 수 있다. 오류 허용치는 신경망 애플리케이션이 지정할 수 있다. 또 다른 구성은 네트워크 패킷을 헤더와 페이로드를 포함하는 서로 다른 부분으로 분리하는 패브릭 어댑터 통신 시스템이다. 헤더는 하나 이상의 제어 호스트로 전달하고, 여러 페이로드는 하나 이상의 SGL에 기반해 번들 인터페이스를 통해 글로벌 메모리 풀의 복수 메모리 버퍼로 병렬 전달한다. 멀티레인 AI 시스템 아키텍처의 전력 관리에서는 레인별 오케스트레이터와 전체 시스템을 관리하는 상위 오케스트레이터가 전력, 주파수, 활성 컴포넌트를 제어할 수 있다. 오케스트레이터는 AI 실행 시퀀스에 사용되지 않는 컴포넌트의 전원을 끄고, 기능이 완료된 레인을 비활성화하며, 계산 수요에 맞춰 레인의 클록 주파수를 조절해 전력 사용을 최소화할 수 있다. VPU 관련 기술은 min/max 수집기, 자동 저장 조건화, 레인 간 공유가 가능한 SIMD 데이터 경로, stride 파라미터를 갖는 전치 load/store, permute 및 zero insertion load, 2점 및 2x2점 룩업을 지원하는 하드웨어·로직·메모리 배치, 메모리 뱅크별 로드 캐싱 등을 포함한다. 또한 분리형 가속기로 VPU 처리 작업을 오프로드하고, DMA 시스템의 하드웨어 시퀀서로 프로그래밍 복잡성을 줄이며, 처리 컨트롤러 없이 동적 영역 기반 데이터 이동을 수행하는 VPU 구성 모드를 실행할 수 있다. 마지막으로, 호스트 프로세서가 가상환경 내 복수 관계를 정의하고 look 선호를 설명하는 복수 입력을 AI 가속기에 제공하면, AI 가속기가 해당 관계와 입력을 바탕으로 복수의 look을 생성할 수 있다. 전반적으로 이 문서는 허용 가능한 오류 범위 내에서 신경망 전력 설정을 유지하거나 조정하는 방식, 네트워크 패킷 처리와 메모리 전달 방식, 멀티레인 AI 시스템의 전력 관리, VPU 성능 및 처리량 개선 구성, 가상환경 기반 look 생성 기능을 설명한다.", "label": "node 200 / layer 1 / leaves 5", "leaf_samples": [{"index": 81, "patent_id": "17-712380", "title": "Self-regulating power management for a neural network system", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 141, "patent_id": "18-747118", "title": "Optimally balanced network systems", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 163, "patent_id": "16-528553", "title": "Systems and methods for power management of hardware utilizing virtual multilane architecture", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 177, "patent_id": "18-064121", "title": "Using a hardware sequencer in a direct memory access system of a system on a chip", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 181, "patent_id": "18-237702", "title": "Look selection based on relationships in a virtual environment", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "201", "index": 201, "layer": 1, "node_type": "summary", "children": ["34", "40"], "parents": ["229"], "child_count": 2, "descendant_leaf_count": 2, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 2}, "patent_id": "", "title": "", "text_preview": "첫 번째 기술은 뉴럴 네트워크 파라미터를 다중 레벨로 단계적으로 양자화하는 방법 및 장치이다. 파라미터 값 중 설정값 이상의 높은 값부터 낮은 값 방향으로 임의 값을 선택해 기준 레벨을 설정하고, 해당 기준 레벨을 바탕으로 학습을 수행한다. 학습 결과가 설정 기준치를 만족하면서 학습 시 업데이트되는 변동 파라미터가 존재하지 않을 때까지 기준 레벨 설정과 학습을 반복한다. 두 번째 기술은 변동성 플로팅 포인트(FP) 뉴럴넷을 이동 표적으로 사용하여 바이너리 뉴럴넷을 자기지도학습 방식으로 학습하는 방법이다. 학습용 벡터가 획득되면, 바이너리 뉴럴넷은 학습용 벡터에 바이너리 연산을 인가하고, 변동성 FP 뉴럴넷은 학습용 벡터에 FP 연산을 가한다. 이후 바이너리 뉴럴넷의 학습용 바이너리 출력과 변동성 FP 뉴럴넷의 학습용 FP 출력을 참조해 커플링 로스를 생성하고, 이를 사용하여 바이너리 파라미터의 적어도 일부를 학습하면서 FP 파라미터의 적어도 일부를 학습한다.", "label": "node 201 / layer 1 / leaves 2", "leaf_samples": [{"index": 34, "patent_id": "2020-0056641", "title": "뉴럴 네트워크에서의 다중 레벨 단계적 양자화 방법 및 장치(method and apparatus for multi-level stepwise quantization for neural network)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 40, "patent_id": "2022-0136035", "title": "변동성 플로팅 포인트 뉴럴넷을 이동 표적으로 사용하여 바이너리 뉴럴넷을 학습하는 자기지도학습 방법 및 장치, 그리고 이를 이용한 테스트 방법 및 테스트 장치(learning method and learning device for self-supervised learning of binary neural network using variable floating point neural network as moving target, and testing method and testing device using the same)", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "202", "index": 202, "layer": 1, "node_type": "summary", "children": ["42", "43", "136", "166"], "parents": ["237"], "child_count": 4, "descendant_leaf_count": 4, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 2, "AC": 1, "AD": 1}, "patent_id": "", "title": "", "text_preview": "해당 특허 묶음은 이미지 분류, 동일 인물 이미지 검색, 이미지 코드 비교 처리 기술에 관한 것이다. 핵심 기술은 이미지 분류가 필요한 이미지 데이터를 라벨링 데이터와 비라벨링 데이터로 분류하고, 라벨링 데이터 일부로 프록시 모델을 학습한 뒤 샘플링 처리된 비라벨링 데이터 일부를 프록시 모델에 입력하여 학습하는 방법 및 장치, 얼굴 검출 및 파레트 데이터를 이용해 입력 데이터와 동일한 인물이 포함된 이미지 데이터를 출력하는 이미지 처리 시스템, 그리고 이미지의 이진 임베딩 등 이미지 코드를 메모리 시스템 또는 메모리 컨트롤러에서 해밍 처리로 비교하는 기술이다. 주요 구성 요소 및 절차는 이미지 데이터 획득, 라벨링 데이터 및 비라벨링 데이터 분류, 일부 라벨링 데이터를 이용한 프록시 모델 학습, 비라벨링 데이터 샘플링 및 분류, 분류된 비라벨링 데이터 일부의 프록시 모델 입력 학습, 이미지 데이터가 저장되는 제1 저장 모듈, 입력 모듈, 얼굴 검출 모듈, 파레트 데이터 생성 모듈, 이미지 출력 모듈, 그리고 이미지 코드 비교를 수행하는 해밍 처리 유닛 또는 메모리 컨트롤러를 포함한다. 이들 기술은 비전 기반 산업 응용 프로그램에서 프록시 모델을 활용한 라벨링 데이터를 획득하고, 입력 데이터와 동일한 인물이 포함된 이미지 데이터를 출력하며, IoT 등 단말 장치에서 생성된 이미지 코드를 다른 이미지 또는 이미지 데이터셋과 비교해 매칭 또는 신경망 결과를 식별하는 데 사용될 수 있다. 제시된 효과로는 이미지 코드 비교를 메모리 장치에 가까운 처리 유닛 또는 메모리 컨트롤러에서 수행함으로써 신경망에서 데이터셋 처리 속도와 처리량을 높일 수 있는 점이 포함된다.", "label": "node 202 / layer 1 / leaves 4", "leaf_samples": [{"index": 42, "patent_id": "2022-0163873", "title": "비전 기반 산업 응용 프로그램에서 프록시 모델을 활용한 라벨링 데이터를 획득하는 방법 및 그 장치(method for acquiring labeling data utilizing proxy models in vision-based industrial applications and apparatus thereof)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 43, "patent_id": "2022-0176479", "title": "인공 신경망을 사용하는 이미지 처리 방법 및 이를 위한 장치(image processing method using neural network and apparatus therefor)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 136, "patent_id": "18-170753", "title": "Memory systems including examples of calculating hamming distances for neural network and data center applications", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 166, "patent_id": "17-016053", "title": "Memory controllers including examples of calculating hamming distances for neural network and data center applications", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "203", "index": 203, "layer": 1, "node_type": "summary", "children": ["51", "55", "59", "60", "61", "62", "64", "65", "66", "68", "69", "72", "85", "90", "91", "100", "110", "124"], "parents": ["235"], "child_count": 18, "descendant_leaf_count": 18, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 15, "AC": 3}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 반도체 소자의 미세화, 절연 및 분리 구조, 전류 특성 향상, 온저항 저감, 고내압 유지, 회로 지연 억제, 표면 평탄화, 박막 분리·접합, 퓨즈 선폭 축소, 저항 변화 메모리 구성을 다룬다. 핵심 기술은 다음과 같다. - 소자 분리 영역, 홈, 트렌치, 절연막, 확산 차단 구조를 이용해 활성 영역, 핀, 서브 활성 패턴 또는 소자 영역을 분리한다. - 핀 게이트 구조는 동작 전류 개선을 목적으로 하며, 병렬 p-n층 및 슈퍼정션 구조는 온저항 저감, 고내압 유지, 항복 내성 확보와 관련된다. - GaN계 반도체층에는 소스 전극과 드레인 전극 사이의 리세스, 게이트 절연막, 게이트 전극이 형성된다. - MOS 소자는 리세스, LDD, 소스, 드레인 및 수직 연결부를 포함하며, LDD와 드레인을 수직 방향으로 연결하는 구조를 갖는다. - 도전층, 접촉 요소, 전기 커넥터, 유전체층 내 리세스 도전 부재를 이용해 반도체 칩과 전기 커넥터 사이의 전기 연결을 형성한다. - 응력 향상 표면 확산을 이용해 반도체 기판 표면을 원자 수준으로 평탄화하고, 양자 비트 클래스에 따라 결정된다. 이후 양자 논리 게이트 변환과 측정 연산을 적용하면서 각 가우시안 함수의 가중치, 평균, 공분산을 갱신함으로써 양자 비트의 동작을 고전 컴퓨터상에서 모사한다. 두 번째 기술은 칩렛 기반 AI 프로세서에서 데이터 경로의 여러 단계에 걸쳐 비트 수를 줄이는 양자화 구조이다. 학습 후 내부 가중치는 정적으로 양자화하고, 추론 중 누산기 비트와 활성화 비트는 동적으로 양자화한다. 연산 출력은 메모리에 저장되기 전에 코어 또는 처리 노드에서 직접 양자화되며, 현재 출력 텐서의 양자화에는 이전 텐서의 통계를 활용하고 동시에 다음 텐서에 사용할 통계를 계산한다. 또한 통계 기반 양자화와 함께 K번째 백분위수 클램핑을 적용해 비트 수를 추가로 줄일 수 있다. 핵심 효과는 첫 번째 기술의 경우 보손 양자 비트의 고전적 시뮬레이션을 가능하게 하는 것이며, 두 번째 기술의 경우 AI 프로세서의 메모리 사용량과 데이터 경로 대역폭을 크게 줄이는 것이다.", "label": "node 204 / layer 1 / leaves 2", "leaf_samples": [{"index": 18, "patent_id": "17-889900", "title": "System and method of bosonic qubits simulation", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 182, "patent_id": "18-328852", "title": "Chiplet aware adaptable quantization", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "205", "index": 205, "layer": 1, "node_type": "summary", "children": ["94"], "parents": ["229"], "child_count": 1, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "", "title": "", "text_preview": "배양된 생체 뉴런을 활용해 동작을 수행하는 바이오 프로세싱 엘리먼트에 관한 기술이다. 핵심 구성은 생체 뉴런과 연결되는 전극을 포함한 전극 레이어, 생체 뉴런 처리를 위한 적층 회로를 포함하는 회로 레이어들, 그리고 전극 레이어와 회로 레이어들을 연결하는 연결 소자이다. 이를 통해 생체 뉴런과 회로를 적층 구조로 집적하고 전기적으로 연결하여 바이오 기반 연산 또는 처리 동작을 수행할 수 있도록 한다.", "label": "node 205 / layer 1 / leaves 1", "leaf_samples": [{"index": 94, "patent_id": "2021-0082497", "title": "바이오 프로세싱 엘리먼트 및 바이오 프로세싱 엘리먼트들을 포함하는 신경망 프로세서(bio processing element and neural network processor including bio processing elements)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "206", "index": 206, "layer": 1, "node_type": "summary", "children": ["99"], "parents": ["230"], "child_count": 1, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "", "title": "", "text_preview": "본 개시는 웨이퍼의 최적 위치를 결정하는 하는 트리 구조 신경망으로 변환한 뒤, 기반 정보에 기초하여 이를 최적화하는 방법이 제시된다. 정밀도 및 데이터 처리와 관련해서는, 웨이트와 인풋 액티베이션을 이용해 모드 신호와 오버플로우/언더플로우 여부에 따라 서로 다른 정밀도로 곱셈을 수행하는 플렉서블 멀티플라이어와 새츄레이팅 애더가 개시된다. 가중치 데이터 처리 방법은 가중치 값의 범위를 복수 구간으로 나누어 가중치 레벨에 대응시키는 레벨링 가중치 데이터를 생성하여, 하드웨어 기반 인공 신경망 연산 장치 구현을 위해 가중치 데이터 값의 수를 줄이는 것을 포함한다. 그 밖에, 비휘발성 메모리에 저장된 제1 모델의 그래프와 휘발성 메모리에 저장된 다른 모델의 그래프 중 대응 그래프를 식별하고 이를 기반으로 제1 모델 제어 인스턴스를 획득하는 전자 장치, 신경망 모델 형태의 운영체제를 구성하여 뉴로모픽 컴퓨팅 시스템에 탑재하는 방법, 훈련된 신경망을 이용한 위변조 탐지, 확장 메모리 연산을 위한 통신 서브시스템, 행/열 메모리와 주소 생성 방식을 이용해 서로 다른 형태의 콘볼루션 연산을 지원하는 병렬 프로세서, 고정소수점 변환을 이용한 내적 계산, 데이터 통신 모드 결정기, SIMD 방식 벡터 프로세서와 행렬 곱셈 유닛을 포함하는 특수 목적 하드웨어 칩, 및 현재 실행 작업과 대기 실행 작업에 대한 로드/스토어 작업을 수행하는 인공지능 코어가 포함된다.", "label": "node 212 / layer 1 / leaves 17", "leaf_samples": [{"index": 4, "patent_id": "16-370570", "title": "Time-division multiplexed neurosynaptic module with implicit memory addressing for implementing a neural network", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 30, "patent_id": "2018-0059775", "title": "뉴럴 네트워크 프로세서(neural network processor)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 31, "patent_id": "2018-0160341", "title": "뉴럴 네트워크에서의 부하 균형을 위한 장치 및 방법(method and apparatus for load balancing in neural network)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 32, "patent_id": "2019-0038606", "title": "뉴럴 네트워크의 컨볼루션 연산을 처리하는 방법 및 장치(method and apparatus for processing convolution operation of neural network)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 36, "patent_id": "2020-0112148", "title": "다중 gpu 시스템을 위한 신경망의 최적화 방법 및 이를 이용하는 최적화 시스템(optimization method of neural network for multi-gpu system and optimization system using the same)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 37, "patent_id": "2022-0030597", "title": "프로세싱 엘리먼트, 이를 포함하는 뉴럴 프로세싱 장치 및 그의 연산 방법(processing element, neural processing device including same and method for calculating thereof)", "category": "AA", "category_name": "AI 코어 및  절차이다. 먼저 시간지연 모델을 Jordan 표준화하고, 이후 Taylor 전개를 이용해 시간지연이 있는 상태변수와 시간지연이 없는 단계변수를 분리한다. 이어 Schur 단순화를 통해 균형 모델 축소를 수행한다. 구성 요소는 Jordan 표준화, Taylor 분리, Schur 단순화의 세 단계로 정리된다. 제안 방법은 WSCC 3발전기 9버스 전력 시스템의 다중 지연 사례에 적용되어 여러 안정성 판정 기준으로 검증된다. 효과는 시간지연 안정성 여유 판정 시 시스템 차원을 낮추고 계산을 단순화하여 빠른 안정성 분석을 가능하게 하는 것이다.", "label": "node 214 / layer 1 / leaves 1", "leaf_samples": [{"index": 161, "patent_id": "16-318104", "title": "Method and system for fast determining time-delay stability margin of power system", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "215", "index": 215, "layer": 1, "node_type": "summary", "children": ["33", "46", "95", "97", "98", "146"], "parents": ["233"], "child_count": 6, "descendant_leaf_count": 6, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AA": 2, "AB": 3, "AC": 1}, "patent_id": "", "title": "", "text_preview": "제시된 특허들은 반도체 소자, 제조 검증, 패키징, 공정 이상 감지, 적층형 반도체 장치의 데이터 송수신 기술에 관한 것이다. 핵심 내용은 다음과 같다. - 제1/제2 게이트와 전하저장층을 포함하는 반도체 소자를 이용해 뉴럴 네트워크의 타겟 반도체 소자의 시냅스 가중치를 제어하는 방법에 관한 것이다. 바디, 소스·드레인, 게이트 절연막, 대향 게이트 및 절연막 스택을 주요 구성으로 한다. - OPC된 반도체 레이아웃 데이터에서 패턴 꼭지점 좌표를 추출하고, 이를 트랜스포머 모델에 입력해 MRC 위배 여부를 출력하는 반도체 장치 제조 방법 및 컴퓨팅 장치이다. - 큰 사이즈를 갖는 고전력, 고성능 로직 칩의 열적 특성을 최적화할 수 있는 구조의 3D 적층 칩 및 이를 포함하는 반도체 패키지 기술이다. 관통 전극을 포함한 제1 칩, 수평 인접 배치된 제2 칩, 그 위에 배치되며 제1 칩보다 큰 크기를 갖는 제3 칩으로 구성된다. - 캐비티가 있는 세라믹 기판, 상·하부 재배선 구조물, 복수의 반도체 칩, 캐비티 내 브릿지 칩을 포함하는 반도체 패키지 구조이다. 브릿지 칩은 복수의 반도체 칩을 전기적으로 연결한다. - 반도체 공정 변수 데이터를 수신하고, 컨볼루션 알고리즘과 트랜스포머 알고리즘을 통해 이상 감지 모델을 생성한 뒤, 생성된 모델로 데이터를 분류하는 이상 감지 방법이다. - 적층형 반도체 장치에서 상부 칩이 다수의 채널 및 전달 제어 회로를 포함하고, 채널 지정 신호와 위치 정보 신호에 따라 채널 커맨드를 출력하며, 해당 채널과 하부 칩 사이에서 제1 및 제2 데이터 워드를 송수신하는 구성이다. 전체적으로 이 묶음은 뉴럴 네트워크에서 시냅스 가중치를 제어하는 반도체 소자, 트랜스포머 모델을 이용한 MRC 위배 여부 출력, 3D 적층 칩 및 반도체 패키지 구조, 반도체 공정 이상 감지, 적층형 반도체 장치의 채널 및 데이터 워드 송수신 구성을 다룬다.", "label": "node 215 / layer 1 / leaves 6", "leaf_samples": [{"index": 33, "patent_id": "2019-0109164", "title": "더블 게이트를 갖는 반도체 소자 및 뉴럴 네트워크 내 타겟 반도
