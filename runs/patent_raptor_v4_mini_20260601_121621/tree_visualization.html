기 없이 각 칩렛이 드로우 콜의 인덱스 버퍼 중 자신이 가져와 처리할 부분을 독립적으로 계산하고, 해당 인덱스를 가져와 병렬로 처리하는 그래픽 작업 수행 구조 - 커널 디스패치 패킷의 워크그룹을 여러 칩렛에 할당하고, 각 칩렛이 할당된 워크그룹 완료 시 다른 칩렛에 알리며, 전체 워크그룹 완료 후 클라이언트에 완료를 알리고 후속 커널 디스패치 패킷으로 진행하는 방식 - 신경망의 계층 간 연결을 나타내는 복수의 가중치를 포함한 행렬들을 식별하고, encryption cipher를 사용해 해당 가중치들을 암호화하며, 신경망 실행 시작이 감지되면 동일한 encryption cipher를 사용해 가중치들을 복호화하는 방식 구성 요소로는 머신러닝 작업 가속기, SPU, 데이터 처리 유닛의 제어 회로, 제1·제2 실행 유닛, GPU 칩렛 집합, coarse bin 및 가시성 정보, 인덱스 버퍼, 커널 디스패치 패킷과 워크그룹, 신경망의 노드·계층·가중치 행렬 등이 포함된다. 효과 또는 처리 결과는 머신러닝 모델 데이터의 가속기 기반 처리, 처리 작업의 병렬 수행, 그래픽 렌더링 작업의 칩렛 간 분산, 각 칩렛의 독립적 그래픽 작업 수행, 커널 작업 완료 통지 및 후속 작업 진행, 신경망 가중치의 암호화 및 실행 시작 시 복호화로 요약된다.", "label": "node 216 / layer 1 / leaves 6", "leaf_samples": [{"index": 13, "patent_id": "17-359297", "title": "Compute in memory-based machine learning accelerator architecture", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 24, "patent_id": "18-474579", "title": "Methods and apparatus for processing data", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 80, "patent_id": "17-562751", "title": "Systems and methods for distributed rendering using two-level binning", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 86, "patent_id": "18-363333", "title": "Distributed geometry", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 89, "patent_id": "18-480466", "title": "Multi-accelerator compute dispatch", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 165, "patent_id": "16-888885", "title": "Systems and methods for protecting neural network weights", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "217", "index": 217, "layer": 1, "node_type": "summary", "children": ["1", "3", "14", "21", "29", "160"], "parents": ["229"], "child_count": 6, "descendant_leaf_count": 6, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 5, "AD": 1}, "patent_id": "", "title": "", "text_preview": "영상 처리, 신경망 연산 회로, 생성 모델 학습, 영상 복원 및 신경망 가속기 실행 파일 생성에 관한 기술들이 설명된다. 다중 입력 영상 채널 처리 기술은 입력 영상 채널들의 야코비안 행렬을 구하고, 그 외적의 주특성 벡터를 계산한 뒤, 픽셀을 해당 벡터 방향으로 투영했을 때 양의 스칼라값이 되도록 부호를 설정하여 픽셀별 투영으로 출력 영상을 생성한다. 신경망 연산 회로는 복수 계층을 포함하는 신경망에 대해 누적값 벡터를 수신하고 각 누적값에 함수를 적용해 활성화값 벡터를 생성하는 활성화 회로와, 각 활성화값으로부터 정규화값을 생성하는 정규화 회로를 포함한다. GP-VAE 관련 방법은 가우시안 프로세스 인코더와 신경망 디코더를 포함하는 GP-VAE를 제공하고, 데이터 공간에서 복수의 유도점을 선택하며, 이를 잠재 공간에 매핑한 후 학습 데이터셋을 사용해 GP-VAE를 학습한다. 또한 입력 공간의 잠재 코드를 매핑 신경망으로 처리해 중간 잠재 공간의 중간 잠재 코드를 생성하고, 이를 외형 벡터로 사용하여 합성 신경망이 영상을 생성하는 기술이 제시된다. 외형 벡터는 얼굴이 포함된 비디오 프레임, 오디오 등 데이터의 압축 인코딩일 수 있으며, 캡처 영상은 로컬 장치에서 외형 벡터로 변환되어 원격 장치로 전송되고, 원격 장치의 합성 신경망이 표시용 영상을 재구성할 수 있다. 고해상도 인체 영상 기술에서는 복수의 k2차원 입력 영상 행렬을 배열 및 결합해 k1차원 영상 행렬을 만들고, k1차원 인코딩 신경망으로 이를 인코딩해 중간 행렬을 생성한 뒤, k2차원 디코딩 신경망과 스킵 연결을 이용해 k2차원 출력 영상 행렬을 생성한다. 출력 영상 행렬의 해상도는 각 입력 영상 행렬의 해상도보다 높다. 신경망 가속기 관련 기술은 행렬, 벡터 및 행렬-벡터 곱(MVM) 연산을 포함하는 신경망 프로그램을 수신하고, 이에 대응하는 계산 그래프를 생성한다. 계산 그래프의 노드는 MVM 연산, 행렬 또는 벡터를 나타내며, 클래스 모델의 데이터 구조가 계산 그래프를 가리키도록 구성된다. 이후 클래스 모델에 기반해 계산 그래프를 순회하고, 복수의 MVM 연산을 신경망 가속기의 MVM 유닛에 할당한 뒤, 해당 할당에 기반하여 가속기에서 실행될 실행 파일을 생성한다.", "label": "node 217 / layer 1 / leaves 6", "leaf_samples": [{"index": 1, "patent_id": "15-779219", "title": "Method and system for generating an output image from a plurality of corresponding input image channels", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 3, "patent_id": "16-245406", "title": "Vector computation unit in a neural network processor", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 14, "patent_id": "17-465417", "title": "Anomaly detection using gaussian process variational autoencoder (gpvae)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 21, "patent_id": "18-079772", "title": "Generative adversarial neural network assisted video reconstruction", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 29, "patent_id": "19-004301", "title": "High resolution human imaging using neural network", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 160, "patent_id": "16-260331", "title": "Generation of executable files corresponding to neural network models", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "218", "index": 218, "layer": 1, "node_type": "summary", "children": ["35", "44", "47", "111", "150"], "parents": ["233"], "child_count": 5, "descendant_leaf_count": 5, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 3, "AC": 1, "AD": 1}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 딥러닝 분산 학습, 모델 학습 효율화, 모델 압축, 자원 부하 분산, 물리 시뮬레이션 가속 기술을 중심으로 한다. - **멀티 노드·멀티 GPU 분산 학습 시스템**: 사용자가 딥러닝 소스코드와 사용할 GPU 개수만 지정하면, GPU 자동 할당부가 노드별 가용 GPU 자원을 확인해 유휴 GPU를 할당하고 컨테이너를 생성한다. 이를 통해 학습 결과 도출 시간을 줄이고 유휴 GPU를 최소화해 자원 효율을 높인다. - **드롭아웃 기반 딥러닝 학습 방법**: 전체 학습 기간 동안 학습에 참여하는 서브 네트워크 수를 제한하고, 선택된 서브 네트워크를 정해진 반복 횟수만큼 학습시킨 뒤 행렬 곱셈 연산용 드롭아웃 마스크를 생성한다. 목적은 딥러닝 모델 학습을 효율화하는 것이다. - **인공지능 모델 국부 압축 기술**: 사전 학습된 모델에서 일부 레이어 그룹을 선정해 부분 압축하고, 해당 레이어 그룹에 대해 저장된 입력·출력 데이터를 기반으로 재학습한다. 모델 전체가 아니라 선택된 부분을 압축·재학습함으로써 모델 압축을 수행한다. - **분산 학습용 자기 적응형 배치 데이터 분할 제어**: 하이브리드 가속기 자원 간 부하 균형을 최적화하기 위해 미니배치 데이터를 각 가속기별 서브배치로 나누고, 반복적인 배치 크기 조정을 통해 최적 작업 분할 비율을 결정한다. 효과는 딥러닝 학습 완료 시간을 최소화하는 것이다. - **탄화수소 저장소 모델링 및 시뮬레이션 방법**: 저장소 모델을 여러 하위 영역으로 나누고, 일부 영역에 대한 훈련 시뮬레이션으로 상태 변수와 경계 조건을 얻는다. 머신러닝 알고리즘으로 다공성 매질 유체 흐름 해를 제공하는 행렬 방정식의 역연산자를 근사하고, 이를 이용해 저장소를 시뮬레이션하며 결과 기반의 물리 저장소 데이터 표현을 생성한다.", "label": "node 218 / layer 1 / leaves 5", "leaf_samples": [{"index": 35, "patent_id": "2020-0072392", "title": "멀티 노드와 멀티 gpu를 이용한 분산 학습 시스템 및 방법(system for executing distributed deep learning using multi node and multi graphics processing unit and method thereof)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 44, "patent_id": "2023-0057813", "title": "딥러닝 모델을 효율적으로 학습하기 위한 드롭아웃 방법 및 시스템(dropout method and system for efficiently training deep learning models)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 47, "patent_id": "2023-0142230", "title": "인공지능 모델의 국부 압축 방법 및 시스템(method and system for local compression of artificial intelligence model)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 111, "patent_id": "16-133054", "title": "Self-adaptive batch dataset partitioning for distributed deep learning using hybrid set of accelerators", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 150, "patent_id": "13-805649", "title": "Methods and systems for machine-learning based simulation of flow", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "219", "index": 219, "layer": 1, "node_type": "summary", "children": ["5", "6", "8", "28", "54", "75", "83", "88", "101", "104", "105", "106", "113", "114", "116", "117", "121", "123", "131", "135", "138", "153", "171", "174", "187"], "parents": ["233"], "child_count": 25, "descendant_leaf_count": 25, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AA": 4, "AB": 4, "AC": 13, "AD": 4}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 주로 **메모리와 결합된 신경망 연산 장치, 뉴로모픽/인메모리 로직 구조, 신경망 학습·추론용 연산 아키텍처 및 반도체 메모리 구조**에 관한 기술이다. 핵심 기술은 메모리 셀 어레이나 통합 메모리에 저장된 내부 데이터, 가중치, 입력값 등을 이용하여 신경망 연산 또는 로직 연산을 수행하는 구조이다. 비휘발성 메모리 장치는 연산 명령에 응답하여 내부 데이터와 입력 데이터를 사용해 신경망 연산 결과를 생성할 수 있고, DRAM 기반 computing cell array는 복수 행의 데이터를 이용해 로직 함수를 수행하고 결과를 저장할 수 있다. 또한 센스 앰프와 compute component를 포함하는 메모리 장치, 스파이킹 뉴럴 유닛, 뉴로모픽 셀 타일 및 비교 회로 등이 포함된다. 신경망 연산용 회로로는 unified memory, compute tile, super tile, arbitration logic, 시스톨릭 어레이, weight fetcher 및 weight sequencer, 아날로그 dot product accelerator, attention matrix 계산 장치 등이 제시된다. 일부 장치는 CNN 계층별 버퍼와 파라미터 메모리를 PLD의 compute block 가까이에 배치하거나, 공유 physical memory의 독립 접근 가능한 memory section을 logical memory에 할당하여 주소를 매핑한다. 학습 및 병렬 처리와 관련해서는, worker node들이 신경망 subgraph를 저장하고 control node가 training data를 보내 병렬 message passing과 비동기 파라미터 업데이트를 수행하는 구조가 포함된다. 또 복수 processing unit이 입력 뉴런 및 synaptic weight 데이터를 처리하고 partial result를 interconnect를 통해 공유하는 분산·협력형 인공신경망 계산 장치도 포함된다. 반도체 메모리 구조로는 3차원 메모리의 pillar line 및 pillar select layer, 강유전체 메모리 셀의 erase verify 전압 제어, 플로팅 게이트 비휘발성 메모리 셀, MRAM MTJ의 확산 방지 buffer layer, 내부 processing result에 대한 ECC encoding 구조가 포함된다. 이들 구조는 각각 메모리 접근, 검증 동작, 프로그래밍·소거, 확산 방지, 오류 정정 및 저장 신뢰성과 관련된다. 효과 또는 기능으로는 신경망 연산의 병렬 수행, 일부 메모리 내부 또는 메모리 인접 회로를 통한 로직·신경망 연산 수행, 전력 소모 및 신호 전달 지연 감소, 저장 데이터의 오류 정정, 메모리 소자의 동작 안정성 향상 등이 제시된다. 부가적으로, DC 출력 커넥터 접근성을 높인 컴퓨터 전원공급장치, 이종접합 전력 소자의 내부 rail 전압 제공 회로, 멀티타일 그래픽 프로세서, 적층형 저장 장치와 연산 장치의 전기적 연결 구조도 포함된다.", "label": "node 219 / layer 1 / leaves 25", "leaf_samples": [{"index": 5, "patent_id": "16-507493", "title": "Non-volatile memory device including arithmetic circuitry for neural network processing and neural network system including the same", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 6, "patent_id": "16-553537", "title": "Spiking neural unit", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 8, "patent_id": "16-973087", "title": "Hardware circuit for accelerating neural network computations", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 28, "patent_id": "18-814438", "title": "Asynchronous neural network training", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 54, "patent_id": "13-323780", "title": "Non-volatile memory having 3d array of read/write elements with vertical bit lines and select devices and methods thereof", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 75, "patent_id": "17-014695", "title": "Semiconductor memory device and erase verify operation", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 83, "patent_id": "17-977535", "title": "Power semiconductor device with an auxiliary gate structure", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 88, "patent_id": "18-447263", "title": "Ergonomic and high-performance power supplies for computers", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 101, "patent_id": "13-485920", "title": "Logic-based multiple time programming memory cel ory_name": "시스템 통합 및 데이터 관리"}, {"index": 153, "patent_id": "15-521856", "title": "Method and apparatus for distributed and cooperative computation in artificial neural networks", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 171, "patent_id": "17-429873", "title": "Multi-tile architecture for graphics operations", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 174, "patent_id": "17-778134", "title": "Information processing device", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 187, "patent_id": "18-714655", "title": "Neural network device with configurable shared memory", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "220", "index": 220, "layer": 1, "node_type": "summary", "children": ["2", "118", "132"], "parents": ["229"], "child_count": 3, "descendant_leaf_count": 3, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AA": 1, "AC": 2}, "patent_id": "", "title": "", "text_preview": "제시된 문서들은 신경망 양자화, NOR 메모리 스트링 기반 논리/아날로그 신호 생성, 메모리 다이와 로직 다이의 결합 구조를 다룹니다. 핵심 기술은 다음과 같습니다. 첫째, 1차 신경망 로직 회로를 위해 2차 신경망 로직 회로가 양자화 파라미터를 생성할 수 있습니다. 1차 신경망은 목적 함수로 학습 가능한 복수의 계층을 포함하고, 각 계층은 복수의 텐서를 포함할 수 있습니다. 2차 신경망은 동일한 목적 함수로 학습되어 텐서에 대한 양자화 파라미터를 출력할 수 있습니다. 둘째, NOR 메모리 스트링은 다수의 불리언 변수를 포함하는 논리 함수 구현이나, 다수의 불리언 변수의 비트값을 나타내는 크기의 아날로그 신호 생성에 사용될 수 있습니다. 이러한 방식의 장점은 논리 함수 또는 아날로그 신호 생성이 NOR 메모리 스트링에 대한 하나의 동시 읽기 동작 내에서 수행될 수 있다는 점입니다. 셋째, 메모리 장치는 웨이퍼-온-웨이퍼 본딩을 통해 로직 다이에 결합된 메모리 다이를 포함합니다. 메모리 다이에 결합된 컨트롤러는 메모리 다이의 행을 활성화할 수 있고, 이에 응답하여 메모리 다이의 센스 앰프 스트라이프가 제1 복수의 신호를 래치할 수 있습니다. 트랜시버는 센스 앰프 스트라이프로부터 제2 복수의 신호를 로직 다이로 라우팅할 수 있습니다.", "label": "node 220 / layer 1 / leaves 3", "leaf_samples": [{"index": 2, "patent_id": "16-009456", "title": "Methods and arrangements to quantize a neural network with machine learning", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 118, "patent_id": "16-744067", "title": "Implementing logic function and generating analog signals using nor memory strings", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 132, "patent_id": "17-830981", "title": "Signal routing between memory die and logic die", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "221", "index": 221, "layer": 1, "node_type": "summary", "children": ["148", "193", "197"], "parents": ["229"], "child_count": 3, "descendant_leaf_count": 3, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AC": 1, "AD": 2}, "patent_id": "", "title": "", "text_preview": "개시된 내용은 프로세서와 원격 디바이스 또는 가속기 간의 명령 오프로딩 및 데이터베이스 쿼리 처리 기술에 관한 것이다. 오프로드 명령어와 비-오프로드 명령어 사이의 메모리 순서를 보존하기 위해, 오프로드될 동작에 대한 오프로드 명령어가 처리되면 해당 명령어와 연관된 메모리 주소에 잠금이 설정된다. 이후 그 메모리 주소를 대상으로 하는 캐시 동작이 완료되면 잠금이 제거된다. 멀티스레드 애플리케이션에서는 복수의 프로세서 코어가 각각 일련의 오프로드 명령어 실행을 시작했다고 결정되면, 오프로드 명령어보다 더 젊은 비-오프로드 명령어의 실행이 제한되고, 각 프로세서 코어가 해당 오프로드 명령어 실행을 완료했다고 결정되면 그 제한이 제거된다. 원격 디바이스는 프로세싱-인-메모리 디바이스 또는 메모리에 연결된 가속기일 수 있다. 또한 데이터베이스 쿼리 처리를 위한 가속기가 개시된다. 하드웨어는 데이터베이스에 대한 쿼리를 처리할 수 있고, 저장소는 데이터베이스에서 쿼리를 처리하는 소프트웨어를 저장할 수 있다. 코디네이터는 쿼리의 결과를 생성하기 위해 쿼리에 적어도 부분적으로 기반하여 하드웨어와 소프트웨어를 관리할 수 있다. 고정 기능 동작을 사용하는 오프로딩된 명령어들의 프로세서-안내 실행도 개시된다. 프로세서는 타깃 디바이스에 의한 원격 실행을 위해 지정된 명령어들을 수신하며, 각 명령어는 피연산자로 타깃 디바이스 내의 타깃 레지스터를 포함한다. 타깃 레지스터는 아키텍처화된 가상 레지스터일 수 있다. 프로세서는 복수의 명령어 각각에 대해 명령어가 수신되는 순서로 오프로드 요청을 송신하고, 오프로드 요청은 원격 실행을 위해 지정된 명령어를 포함한다.", "label": "node 221 / layer 1 / leaves 3", "leaf_samples": [{"index": 148, "patent_id": "2023-7026004", "title": "오프로드된 명령어와 비-오프로드된 명령어 사이의메모리 순서 보존(오프로드된 명령어와 비-오프로드된 명령어 사이의 메모리 순서 보존)", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 193, "patent_id": "2022-0115796", "title": "하이브리드 데이터베이스 가속 장치, 시스템 및 방법(device, system and method for hybrid database scan acceleration)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 197, "patent_id": "2023-7024085", "title": "고정 기능 동작들을 사용하는 오프로딩된 명령어들의프로세서-안내된 실행(processor-guided execution of offloaded instructions using fixed function operations)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "222", "index": 222, "layer": 1, "node_type": "summary", "children": ["45", "52", "73", "92", "93"], "parents": ["229"], "child_count": 5, "descendant_leaf_count": 5, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AA": 1, "AB": 4}, "patent_id": "", "title": "", "text_preview": "해당 묶음은 반도체 소자, 패키지, 공정 장비 및 전원/커패시턴스 구조에 관한 기술들이다. 1. **멀티 레이어 오믹전극** - 반도체층 상면에 제1 오믹전극을 증착한 뒤 열처리하고, 그 위에 제2 오믹전극을 추가 증착하는 구조이다. - 다층 오믹전극 구성을 통해 반도체층과의 전기적 접촉 구조를 형성하는 것이 핵심이다. 2. **표준 셀 영역용 커패시턴스 셀** - 기판 구조층의 확산 영역, 배선층의 전원 공급선, 그리고 제1 전극·유전체·제2 전극이 적층된 커패시턴스를 포함한다. - 커패시턴스는 표준 셀 영역의 외곽을 따라 프레임 형상으로 배치된다. - 기판 콘택트와 커패시턴스 콘택트를 통해 전원 공급선, 확산 영역, 커패시터 전극을 전기적으로 연결한다. 3. **전하 균형 전력 소자** - 제1 도전형 반도체 바디 내에 트렌치 게이트가 형성되고, 그 양측에 제2 도전형 바디 영역과 제1 도전형 소스 영역이 배치된다. - 반도체 바디 내부에는 트렌치 게이트 양측에 제2 도전형 컬럼 영역이 형성되며, 이 컬럼 영역은 바디 영역 및 드레인 단자와 이격된다. - 전하 균형 구조를 갖는 전력 소자 구성이 핵심이다. 4. **정전척** - 베이스, 유전체 지지플레이트, 지지플레이트 내 전극, 제1 영역의 발열소자, 제2 영역의 열전소자, 공급라인들을 포함한다. - 제2 공급라인은 수직 방향의 제1 라인영역과, 그 일단에서 경사지게 배치되는 제2 라인영역을 포함할 수 있다. - 지지플레이트의 영역별 가열 및 열전 제어 구조를 제공한다. 5. **반도체 패키지** - 기판과 그 위의 반도체 칩을 포함하며, 기판은 내부 절연층, 재배선층, 외부 절연층, 연결 패드 및 그라운드 전극을 포함한다. - 연결 패드는 재배선층과 전기적으로 연결되고, 상면이 외부 절연층 상면에 의해 노출되지만 그 레벨은 외부 절연층 상면보다 낮다. - 그라운드 전극의 하면은 재배선층 상면보다 높고, 외부 절연층이 그라운드 전극 상면을 덮는 구조이다.", "label": "node 222 / layer 1 / leaves 5", "leaf_samples": [{"index": 45, "patent_id": "2023-0081229", "title": "멀티 레이어 오믹전극(multi-layer ohmic contact)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 52, "patent_id": "13-064599", "title": "Semiconductor integrated circuit device", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 73, "patent_id": "16-945220", "title": "Charge-balance power device, and process for manufacturing the charge-balance power device", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 92, "patent_id": "2018-0020931", "title": "정전척 및 반도체처리장치의 제어장치(electrostatic chuck and device of controlling a semiconductor processing apparatus)", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 93, "patent_id": "2020-0117172", "title": "반도체 패키지(semiconductor package)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "223", "index": 223, "layer": 1, "node_type": "summary", "children": ["87", "152", "156", "158", "179", "183"], "parents": ["236"], "child_count": 6, "descendant_leaf_count": 6, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AB": 1, "AD": 5}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 ASIC, SoC, NoC 기반 집적회로에서 분산원장 상호작용, 외부 트래픽 제어, 메모리 대상 트랜잭션의 ECC 처리, NoC 라우팅, 자율주행차용 칩렛 SoC의 워크로드 스케줄링, ML 가속기 SoC 구성을 다룬다. 핵심 기술은 다음과 같다. - 암호화폐 채굴용 ASIC은 다수의 해시 다이와 이를 제어하는 컨트롤 다이로 구성되며, 컨트롤 다이는 해시 다이보다 큰 공정 노드로 형성된다. 다이들은 인터커넥터로 전기적으로 연결되고 하나의 집적회로 패키지에 봉입된다. - 호스트 SoC는 내부 블록 간 로컬 트래픽을 전송하는 NoC, 신뢰되지 않은 외부 장치로부터 메시지를 수신하는 외부 프로세서 링크, 및 트래픽 컨트롤러를 포함한다. 트래픽 컨트롤러는 외부 트래픽 양을 감시하고, 트래픽 정책 위반을 검출하면 해당 외부 장치의 메시지로 인해 NoC에 발생하는 트래픽을 줄인다. - NoC 기반 IC는 마스터 장치, 메모리 컨트롤러, 인라인 ECC 회로를 포함하며, ECC 회로는 메모리를 대상으로 하는 읽기 및 쓰기 트랜잭션을 수신하고, 해당 트랜잭션에 기초해 ECC 데이터를 계산하며, 메모리 컨트롤러로 나가는 트랜잭션을 제공한다. - SoC의 NoC 라우팅에서는 매퍼가 트랜잭션의 목적지 ID를 식별한다. 하드웨어 요소가 목적지 ID를 제공하면 주소 맵을 우회하고, 목적지 ID가 제공되지 않으면 트랜잭션의 주소를 이용해 목적지 ID를 식별한다. - 자율주행차용 칩렛 기반 SoC는 중앙 칩렛과 센서 데이터 입력 칩렛을 포함한다. 중앙 칩렛은 병렬 워크로드 파이프라인과 관련된 프로그램을 저장하는 공유 메모리, 스케줄링 프로그램을 실행하는 프로세서, 및 SoC의 칩렛들이 접근 가능한 캐시 메모리를 포함한다. 센서 데이터 입력 칩렛은 차량 센서로부터 센서 데이터를 수신해 캐시 메모리에 저장하고, 스케줄링 프로그램은 캐시에 저장된 센서 데이터에 적어도 부분적으로 기초해 병렬 워크로드 파이프라인의 워크로드 실행을 스케줄링한다. - ML 가속기 SoC는 ML 가속 코어들의 세트, 이들과 결합된 NoC, NoC에 결합된 추론용 비디오 후처리 모듈, 및 NoC에 결합된 비디오 디코더를 포함한다.", "label": "node 223 / layer 1 / leaves 6", "leaf_samples": [{"index": 87, "patent_id": "18-375138", "title": "Multi-die chiplet-based application specific integrated circuit", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 152, "patent_id": "15-230388", "title": "Mechanism for throttling untrusted interconnect agents", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 156, "patent_id": "15-851449", "title": "Inline ecc function for system-on-chip", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 158, "patent_id": "15-964901", "title": "Flexible address mapping for a noc in an integrated circuit", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 179, "patent_id": "18-206526", "title": "Autonomous vehicle system on chip mailbox architecture", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 183, "patent_id": "18-333377", "title": "Hardware-based image/video processing in machine learning-accelerator system-on-chip", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "224", "index": 224, "layer": 1, "node_type": "summary", "children": ["9", "12", "17", "27", "137", "154", "167"], "parents": ["229"], "child_count": 7, "descendant_leaf_count": 7, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 4, "AC": 1, "AD": 2}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 신경망의 지속 학습, 압축·양자화, 하드웨어 효율화, 메모리 열화 대응 학습을 다룹니다. 핵심 기술은 새로운 작업 데이터가 들어올 때 기존 지식 파라미터를 고정한 상태로 활성 서브네트워크를 학습하고, 이후 지식 서브네트워크가 활성 서브네트워크의 출력을 모사하도록 학습해 지속 학습을 확장 가능하게 하는 방식입니다. 또한 LSTM의 입력 가중치 행렬과 순환 가중치 행렬을 게이트별로 고정 비트폭으로 양자화하여 추론에 사용할 수 있는 양자화 LSTM을 생성합니다. 구성 요소로는 활성 서브네트워크와 지식 서브네트워크, 에피소드 메모리와 의미 메모리, Fisher 정보 행렬 기반 시냅스 중요도 추정, 채널별 스케일링 팩터, 열화된 메모리 셀을 고려한 메모리 어레이 모델, GEMM용 버퍼링·전치 하드웨어 로직, 복수의 컨볼루션 엔진이 포함됩니다. 목적은 기존 작업 성능을 유지하면서 새 작업을 학습하고, 신경망의 크기와 연산량을 줄이며, 저정밀 추론과 고속 행렬 연산 및 컨볼루션 처리를 가능하게 하는 것입니다. 특히 채널 중요도를 산출해 관련성이 낮은 채널을 제거하고, 컨볼루션에서는 입력 데이터와 가중치를 여러 필터 윈도우 계산에 재사용하도록 메모리 접근 순서를 설계합니다. 효과는 지속 학습 시 망각을 줄이고, LSTM 및 일반 신경망의 추론 효율을 높이며, CPU에서의 느린 데이터 재포맷을 줄이고 DDR 메모리 처리량을 향상시키는 것입니다. 또한 열화된 메모리 셀에는 별도 쓰기 파라미터를 적용해 신경망 학습 중 메모리 열화를 보상할 수 있습니다.", "label": "node 224 / layer 1 / leaves 7", "leaf_samples": [{"index": 9, "patent_id": "17-048023", "title": "N 회로가 프로그래머블 로 logic 회로의 일부에 형성된 장치 구성요소의 재구성을 감지한다. - 모니터링 회로는 재구성에 기반하여 알림 이벤트를 생성하고, 이를 처리 회로에 전송한다. - 처리 회로는 알림 이벤트를 기반으로 메모리 맵을 갱신한다. 3. **이미지의 기능적 모호성 감소** - 입력 이미지를 수신하고 처리하여 객체를 식별한다. - 식별된 객체들의 공간적 근접도 점수를 산출하고, 이를 기반으로 객체와 관련된 기능들의 기능적 근접도 점수를 결정한다. - 기능적 근접도 점수를 바탕으로 해당 기능들의 가능한 도메인을 결정한다. - 도메인 점수를 산출하여 입력 이미지와 관련된 도메인의 모호성을 줄인다. - 객체, 기능, 가능한 도메인 정보를 하나 이상의 사용자 프로필과 매핑하여 텍스트 요약을 생성하고 사용자에게 표시한다. 4. **AI 기반 분할 모델 수정** - 분할 모델의 모델 파라미터를 획득한다. - 제1 훈련 말뭉치의 사전 설정된 일반화 특징에 대응하는 특징 벡터를 신경망으로 학습하여 해당 일반화 특징의 모델 파라미터를 획득한다. - 분할 모델 파라미터와 일반화 특징의 모델 파라미터에 따라 제1 훈련 말뭉치에 대해 단어 분할을 수행하여 분할 결과를 획득한다. - 사전 설정된 규칙에 따라 분할 결과를 제1 훈련 말뭉치와 비교하고, 비교 결과에 따라 분할 모델의 모델 파라미터와 신경망의 파라미터를 수정한다.", "label": "node 225 / layer 1 / leaves 4", "leaf_samples": [{"index": 7, "patent_id": "16-905541", "title": "Optimizing machine learning model performance", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 103, "patent_id": "15-065746", "title": "Methods for updating memory maps of a system-on-chip", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 151, "patent_id": "14-748203", "title": "System and method for reducing functional ambiguity in visual contents", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 157, "patent_id": "15-934496", "title": "Method for modifying segmentation model based on artificial intelligence, device and storage medium", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "226", "index": 226, "layer": 1, "node_type": "summary", "children": ["50", "56", "58", "63", "67", "70", "71", "76", "77", "79", "115", "125", "139", "170", "176", "185"], "parents": ["233"], "child_count": 16, "descendant_leaf_count": 16, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 10, "AC": 3, "AD": 3}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 주로 반도체 패키징, 3D/2.5D 적층, 열 관리, 메모리-로직 결합 및 PIM 구조에 관한 기술이다. 핵심 기술은 다수의 반도체 다이를 하나의 모듈 또는 패키지 안에 배치하고, 배선·재배선·인터포저·본딩 와이어·연결 필러 술은 GaN 다이에 평행하게 교번 배치된 소스/드레인 스트립을 형성하고, 이에 대응하는 빗살형 소스 및 드레인 패드 손가락 구조로 접촉하는 패키지 구조이다. 복수의 확장된 면적의 게이트 패드와 게이트 접촉용 핑거도 함께 배치되며, 이 패드들은 리드프레임 또는 절연 기판 위의 도전 영역으로 구현될 수 있다. 필요에 따라 다른 반도체 다이를 같은 패드 위에 실장하여 GaN 다이와 정해진 회로 구성을 형성할 수 있다. 또 다른 기술은 lateral HEMT와 같은 소자에서 인터디지트 구조의 소스 핑거와 드레인 핑거 사이 전류 흐름을 공통 게이트로 제어하면서, 확장된 소스 핑거 접촉부를 통해 여러 개 또는 긴 소스 핑거의 전압을 안정적으로 유지하는 것이다. 이를 통해 소스 전압 제어가 개선되고, 원치 않는 서브스레숄드 동작이나 스위칭 진동을 줄여 빠르고 신뢰성 있는 스위칭을 가능하게 한다. 패키지 측면에서는 리드 또는 내부에 하나 이상의 히트파이프를 포함한 반도체 패키지 구조가 제시된다. 히트파이프가 리드와 열적으로 통합되어 패키지의 열을 더 균일하게 방출하고, 과도한 열 축적으로 인한 손상 위험을 줄이며, 상대적으로 저가의 리드 재료 사용을 가능하게 해 패키지 비용 절감 효과를 제공한다.", "label": "node 227 / layer 1 / leaves 3", "leaf_samples": [{"index": 53, "patent_id": "13-188251", "title": "Interdigitated conductive support for gan semiconductor die", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 74, "patent_id": "16-948788", "title": "Lateral transistor with extended source finger contact", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 78, "patent_id": "17-407224", "title": "Semiconductor package including lid with integrated heat pipe for thermal management and methods for forming the same", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "228", "index": 228, "layer": 1, "node_type": "summary", "children": ["16", "19", "20", "26", "84", "108", "120", "133", "169", "175", "188", "189"], "parents": ["233"], "child_count": 12, "descendant_leaf_count": 12, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 4, "AB": 1, "AC": 3, "AD": 4}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 주로 신경망 가속, 메모리 중심 연산, 분산/병렬 처리, 데이터 전송 효율화를 위한 하드웨어 및 시스템 기술에 관한 것이다. 핵심 기술은 네트워크로 연결된 복수의 컴퓨트 노드가 공유 글로벌 가상 주소 공간을 갖는 확장 메모리를 통해 파이프라인 병렬 처리를 수행하는 구조, 병목 계층 신경망 연산에서 부분 컨볼루션 결과를 활용해 외부 메모리 접근을 줄이는 구조, 시스톨릭 어레이 기반 신경망 가속기에서 음성 데이터를 문장 단위로 분리·벡터화해 병렬 처리하는 방법 등을 포함한다. 또한 어텐션 계층에서 어텐션 서브레이어와 피드포워드 서브레이어를 병렬 배치한 신경망 구조, 복수의 프로세서 칩렛과 입출력 회로를 결합한 3D 적층 처리 시스템, 메모리 내부에서 비트 벡터 연산 를 딥러닝 모델에 입력해 헤더와 목록 요소를 포함한 리스트형 답변을 생성하는 기술, 질문과 후보 답변의 문장 길이에 따라 BiLSTM 또는 Transformer 특징 추출기를 선택하고 어텐션 풀링으로 상관도를 측정하는 답변 선택 기술, 후보 문맥 중 목표 문맥을 선택·압축해 언어모델용 프롬프트 정보를 구성하는 기술을 포함한다. 주요 구성 요소는 클라이언트 시스템, 검색 질의, 매칭 행렬, 3차원 텐서, 관련도 점수, 센서 장치, 구성 데이터, 이벤트, AI 모델, 사전학습 언어모델, 지식 그래프의 노드와 엣지, 이진 임베딩 벡터, 딥러닝 모델, 웹페이지 콘텐츠, 계층적 길이 적응형 신경망, BiLSTM, Transformer, 어텐션 풀링, 입력 질의, 후보·목표 문맥 정보 및 프롬프트 정보이다. 효과는 검색 결과의 관련도 기반 순위화, 장치 내 센서 데이터 분석 및 AI 모델 기반 분류, 자연어 기반 지식 그래프 생성, 질의 관련 지식 그래프 노드 식별, 웹 콘텐츠 기반 답변 생성, 질문-답변 상관도 평가, 언어모델 입력량 감소를 통한 처리 자원과 시간 절감이다.", "label": "node 234 / layer 2 / leaves 7", "leaf_samples": [{"index": 0, "patent_id": "15-615713", "title": "Tensor-based deep relevance model for search on online social networks", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 10, "patent_id": "17-070786", "title": "Event driven configurable artificial intelligence workflow", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 82, "patent_id": "17-811338", "title": "Multi-stage knowledge graph construction using models", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 155, "patent_id": "15-793539", "title": "Neural bit embeddings for graphs", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 162, "patent_id": "16-443858", "title": "Constructing answers to queries through use of a deep model", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 164, "patent_id": "16-831552", "title": "Answer selection method for question answering system and the system", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 180, "patent_id": "18-211577", "title": "Constructing prompt information for submission to a language model by dynamically compressing source information", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "235", "index": 235, "layer": 2, "node_type": "summary", "children": ["203", "227"], "parents": ["239"], "child_count": 2, "descendant_leaf_count": 21, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 18, "AC": 3}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 반도체 소자의 미세화, 절연·분리 구조, 전기적 특성 개선, 고내압 유지, 패키지 방열 및 저항 변화 메모리 구현에 관한 기술이다. 핵심 기술은 트렌치, 홈, 리세스, 절연막, 소자 분리층 및 확산 차단 구조를 이용해 활성 영역, 핀, 필러, 서브 활성 패턴 등을 정밀하게 분리하는 것이다. 핀 게이트 구조, LDD와 드레인의 수직 연결 구조, GaN계 소자의 리세스 게이트 구조, 병렬 p-n층 및 슈퍼정션 구조를 통해 동작 전류를 개선하고 온저항을 낮추며 고내압과 항복 내성을 확보한다. GaN 기반 고전력 소자에서는 소스·드레인 스트립을 교번 배치하고, 이에 대응하는 빗살형 패드 및 핑거 구조로 전기적 접촉을 형성한다. lateral HEMT 구조에서는 공통 게이트로 소스·드레인 핑거 사이 전류를 제어하고, 확장된 소스 핑거 접촉부로 소스 전압을 안정화하여 서브스레숄드 동작과 스위칭 진동을 줄인다. 패키지 및 접속 기술로는 도전층, 접촉 요소, 전기 커넥터, 유전체층 내 리세스 도전 부재를 이용해 반도체 칩과 외부 커넥터를 연결한다. 또한 리드 또는 패키지 내부에 히트파이프를 포함해 열을 균일하게 방출하고 열 손상 위험과 패키지 비용을 줄인다. 그 밖에 응력 향상 표면 확산으로 반도체 표면을 원자 수준으로 평탄화하고, 레이저 박리막 및 고열전도 확산층을 이용해 회로층을 다른 기판 측에 유지한 채 박리하는 기술이 포함된다. 더미 퓨즈와 최소 선폭·간격 조건을 활용해 OPC 조건을 최적화함으로써 퓨즈 선폭을 줄이며, 수소 함유 금속층과 반도성 금속 산화물층 사이의 수소 원자 가역 주입에 따른 저항 변화를 이용해 메모리 비트를 저장한다. 주요 효과는 미세 패턴 형성, 산화막 손실 저감, 동작 전류 개선, 온저항 감소, 고내압 유지, 게이트-드레인 용량 감소, 회로 지연 및 스위칭 불안정 억제, 표면 평탄도 향상, 방열 성능 개선, 퓨즈 선폭 축소, 저항 변화 메모리 동작 구현이다.", "label": "node 235 / layer 2 / leaves 21", "leaf_samples": [{"index": 51, "patent_id": "13-040871", "title": "Semiconductor device with buried bit line", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 53, "patent_id": "13-188251", "title": "Interdigitated conductive support for gan semiconductor die", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 55, "patent_id": "13-354089", "title": "Electronic device and a method for fabricating an electronic device", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 59, "patent_id": "14-460175", "title": "Semiconductor device having fin gate, resistive memory device including the same, and method of manufacturing the same", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 60, "patent_id": "14-719409", "title": "Semiconductor device manufacturing method", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 61, "pat nswer": "목적은 AI/신경망 연산과 메모리 연산을 더 효율적이고 안정적으로 수행하기 위한 것이다.\n\n제공된 문맥에 따르면, 이러한 기술들은 다음을 위해 함께 적용된다.\n\n- 메모리 내부 또는 근처에서 연산을 수행하여 CPU와 메모리 사이의 불필요한 데이터 전송을 줄임\n- PIM 연산, DMA 전송, PE 배열 기반 병렬 연산을 통해 처리량과 성능을 높임\n- 메모리 트래픽을 개선하고 외부 인터페이스의 부담을 줄임\n- NoC 기반 집적회로에서 메모리 접근 시 ECC 데이터를 계산하여 읽기/쓰기 트랜잭션의 신뢰성을 높임\n- 신경망 구조나 데이터 지역성에 따라 메모리 시스템과 프로세싱 엘리먼트 어레이를 제어하여 연산 효율을 높임\n\n따라서 종합하면, 목적은 **AI 가속기 및 SoC/NoC 기반 시스템에서 메모리 접근과 데이터 이동을 최적화하고, 오류 정정 신뢰성을 확보하며, 외부 트래픽과 CPU 부담을 줄여 전체 연산 성능과 에너지 효율을 향상시키는 것**이다.", "judge_score": "4", "judge_supported": "True", "judge_explanation": "Reference answer의 핵심인 AI/신경망 연산 병렬화, PIM을 통한 데이터 이동 감소, DMA/PE 배열을 통한 처리량 향상, NoC 기반 메모리 트랜잭션의 ECC 처리 및 전체 성능·효율·신뢰성 향상 목적을 대체로 잘 반영했다. Retrieved context에서도 PIM의 데이터 전송 감소, DMA 전송 관리, PE 배열/스케줄러, NoC 인라인 ECC 회로가 뒷받침된다. 다만 reference에 포함된 외부 장치 트래픽 정책 위반 감지, NoC 부하/혼잡 감소, 목적지 ID 기반 라우팅 같은 SoC/NoC 세부 목적은 명시적으로 다루지 않아 일부 누락이 있다.", "hit": "1", "rank": "11", "mrr": "0.09090909090909091", "latency_seconds": "0.0070879459381103516", "source_nodes": [{"rank": 1, "node_index": 143, "layer": 0, "score": 23.370200173682647, "token_count": 134, "descendant_patent_ids": ["2020-0112495"], "contains_expected": false, "bm25_top_terms": [{"term": "제어", "term_frequency": 2, "document_frequency": 2, "idf": 4.387014176184921, "score": 5.806395526529097}, {"term": "메모리", "term_frequency": 6, "document_frequency": 11, "idf": 2.8609578726898715, "score": 5.5175861822707155}, {"term": "외부", "term_frequency": 1, "document_frequency": 3, "idf": 4.050541939563708, "score": 3.645533201133536}, {"term": "및", "term_frequency": 3, "document_frequency": 38, "idf": 1.6526466667653372, "score": 2.5942897372202003}]}, {"rank": 2, "node_index": 146, "layer": 0, "score": 16.959005813802094, "token_count": 75, "descendant_patent_ids": ["2022-0031987"], "contains_expected": false, "bm25_top_terms": [{"term": "제어", "term_frequency": 2, "document_frequency": 2, "idf": 4.387014176184921, "score": 6.885968038556232}, {"term": "및", "term_frequency": 4 const byId = new Map(nodes.map(node => [node.id, node]));
const rootId = "__root__";
const roots = meta.root_nodes.slice();
const methodOrder = [
  "bm25_without_raptor",
  "bm25_with_raptor",
  "dense_bge_m3_without_raptor",
  "dense_bge_m3_with_raptor",
  "dpr_without_raptor",
  "dpr_with_raptor",
  "traverse_tree",
  "collapsed_tree",
  "bm25_leaf",
  "dpr_leaf"
];
const colors = [
  "#2563eb", "#059669", "#d97706", "#dc2626", "#7c3aed", "#0891b2",
  "#4f46e5", "#65a30d", "#be123c", "#0f766e", "#9333ea", "#b45309"
];
const categoryKeys = Object.keys(meta.category_names).sort();
const colorByCategory = new Map(categoryKeys.map((key, index) => [key, colors[index % colors.length]]));
let collapsed = new Set();
let selectedId = roots[0] || "";
let activeQaIndex = qaSources.qa_items.length ? 0 : null;
let activeMethod = methodOrder[0];
let currentHighlights = emptyHighlights();
let zoomLevel = 1;
const minZoom = 0.35;
const maxZoom = 3.0;
const zoomStep = 0.15;

const svg = document.getElementById("treeSvg");
const canvasWrap = document.getElementById("canvasWrap");
const layoutRoot = document.getElementById("layoutRoot");
const searchBox = document.getElementById("searchBox");
const depthSelect = document.getElementById("depthSelect");
const details = document.getElementById("details");
const zoomLabel = document.getElementById("zoomLevel");
const leftPanelButton = document.getElementById("leftPanelButton");
const rightPanelButton = document.getElementById("rightPanelButton");
let isPanning = false;
let panStartX = 0;
let panStartY = 0;
let panStartLeft = 0;
let panStartTop = 0;

function clampZoom(value) {
  return Math.max(minZoom, Math.min(maxZoom, value));
}

function applyZoom(keepCenter = true, previousZoom = zoomLevel) {
  const baseWidth = Number(svg.dataset.baseWidth || svg.getAttribute("width") || 0);
  const baseHeight = Number(svg.dataset.baseHeight || svg.getAttribute("height") || 0);
  const centerX = keepCenter && previousZoom
    ? (canvasWrap.scrollLeft + canvasWrap.clientWidth / 2) / previousZoom
    : 0;
  const centerY = keepCenter && previousZoom
    ? (canvasWrap.scrollTop + canvasWrap.clientHeight / 2) / previousZoom
    : 0;
  svg.style.width = `${baseWidth * zoomLevel}px`;
  svg.style.height = `${baseHeight * zoomLevel}px`;
  zoomLabel.textContent = `${Math.round(zoomLevel * 100)}%`;
  if (keepCenter) {
    canvasWrap.scrollLeft = Math.max(0, centerX * zoomLevel - canvasWrap.clientWidth / 2);
    canvasWrap.scrollTop = Math.max(0, centerY * zoomLevel - canvasWrap.clientHeight / 2);
  }
}

function setZoom(nextZoom, keepCenter = true) {
  const previousZoom = zoomLevel;
  zoomLevel = clampZoom(nextZoom);
  applyZoom(keepCenter, previousZoom);
}

function updatePanelButtons() {
  leftPanelButton.textContent = layoutRoot.classList.contains("left-collapsed")
    ? "Show left"
    : "Hide left";
  rightPanelButton.textContent = layoutRoot.classList.contains("right-collapsed")
    ? "Show right"
    : "Hide right";
}

function setZoomAtPoint(nextZoom, clientX, clientY) {
  const previousZoom = zoomLevel;
  const rect = canvasWrap.getBoundingClientRect();
  const localX = clientX - rect.left;
  const localY = clientY - rect.top;
  const contentX = (canvasWrap.scrollLeft + localX) / previousZoom;
  const contentY = (canvasWrap.scrollTop + localY) / previousZoom;
  zoomLevel = clampZoom(nextZoom);
  applyZoom(false, previousZoom);
  canvasWrap.scrollLeft = Math.max(0, contentX * zoomLevel - localX);
  canvasWrap.scrollTop = Math.max(0, contentY * zoomLevel - localY);
}

function emptyHighlights() {
  return {
    source: new Set(),
    path: new Set(),
    rankById: new Map(),
    sourceById: new Map()
  };
}

function activeQa() {
  if (activeQaIndex === null || activeQaIndex === undefined) return null;
  return qaSources.qa_items.find(item => Number(item.qa_index) === Number(activeQaIndex)) || null;
}

function activeMethodData() {
  const qa = activeQa();
  if (!qa || !qa.methods) return null;
  if (!qa.methods[activeMethod]) {
    const firstMethod = methodOrder.find(method => qa.methods[method]) || Object.keys(qa.methods)[0];
    activeMethod = firstMethod || activeMethod;
  }
  return qa.methods[activeMethod] || null;
}

function activeSourceSets() {
  const highlights = emptyHighlights();
  const qa = activeQa();
  const method = activeMethodData();
  if (!qa || !method) return highlights;

  for (const nodeIndex of method.source_node_indices || []) {
    highlights.source.add(String(nodeIndex));
  }
  for (const nodeIndex of method.path_node_indices || []) {
    highlights.path.add(String(nodeIndex));
  }
  for (const source of method.source_nodes || []) {
    const id = String(source.node_index);
    highlights.rankById.set(id, source.rank);
    highlights.sourceById.set(id, source);
  }
  return highlights;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
  }[char]));
}

function nodeColor(node) {
  if (!node) return "#94a3b8";
  const key = node.node_type === "leaf" ? node.category : node.dominant_category;
  return colorByCategory.get(key) || "#94a3b8";
}

function searchableText(node) {
  return [
    node.index, node.layer, node.node_type, node.patent_id, node.title,
    node.category, node.category_name, node.label, node.text_preview
  ].join(" ").toLowerCase();
}

function nodeMatches(node, query) {
  if (!query) return false;
  return searchableText(node).includes(query);
}

function descendantMatches(id, query, memo = new Map()) {
  if (!query) return false;
  if (memo.has(id)) return memo.get(id);
  const node = byId.get(id);
  if (!node) return false;
  let found = nodeMatches(node, query);
  for (const childId of node.children) {
    found = found || descendantMatches(childId, query, memo);
  }
  memo.set(id, found);
  return found;
}

function visibleChildren(node, query, mode) {
  if (!node) return roots.filter(id => !query || descendantMatches(id, query));
  if (collapsed.has(node.id) && !query && mode !== "full") return [];
  if (mode === "roots") return [];

  const children = [];
  for (const childId of node.children) {
    const child = byId.get(childId);
    if (!child) continue;
    const isQaVisibleLeaf = currentHighlights.source.has(childId);
    if (mode === "summary" && child.layer === 0 && !query && !isQaVisibleLeaf) continue;
    if (query && !descendantMatches(childId, query)) continue;
    children.push(childId);
  }
  return children;
}

function buildLayout() {
  const query = searchBox.value.trim().toLowerCase();
  const mode = depthSelect.value;
  const rows = [];
  const edges = [];
  const positions = new Map();
  const visibleIds = new Set();
  const maxLayer = Number(meta.num_layers);
  let xCursor = 86;
  const xGap = mode === "full" ? 78 : mode === "all" || query ? 42 : 70;
  const yGap = 210;

  function place(id, depth) {
    const node = byId.get(id);
    if (!node) return xCursor;
    visibleIds.add(id);
    const children = visibleChildren(node, query, mode);
    let x;
    if (children.length === 0) {
      x = xCursor;
      xCursor += xGap;
    } else {
      const xs = children.map(childId => {
        edges.push([id, childId]);
        return place(childId, depth + 1);
      });
      x = xs.reduce((sum, value) => sum + value, 0) / xs.length;
    }
    const y = 70 + (maxLayer - node.layer) * yGap;
    positions.set(id, { x, y, depth });
    rows.push(id);
    return x;
  }

  const rootChildren = visibleChildren(null, query, mode);
  const rootXs = rootChildren.map(childId => place(childId, 1));
  const width = Math.max(980, xCursor + 86);
  const height = Math.max(760, 160 + (maxLayer + 1) * yGap);
  const rootX = rootXs.length ? rootXs.reduce((sum, value) => sum + value, 0) / rootXs.length : 90;
  positions.set(rootId, { x: rootX, y: 28, depth: 0 });
  return { positions, edges, visibleIds, width, height, query, mode };
}

function edgePath(a, b) {
  const dy = Math.max(42, (b.y - a.y) * 0.45);
  return `M ${a.x} ${a.y} C ${a.x} ${a.y + dy}, ${b.x} ${b.y - dy}, ${b.x} ${b.y}`;
}

function render() {
  currentHighlights = activeSourceSets();
  const layout = buildLayout();
  svg.setAttribute("width", layout.width);
  svg.setAttribute("height", layout.height);
  svg.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);
  svg.dataset.baseWidth = String(layout.width);
  svg.dataset.baseHeight = String(layout.height);
  svg.innerHTML = "";

  const labelLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
  for (let layer = Number(meta.num_layers); layer >= 0; layer--) {
    const y = 70 + (Number(meta.num_layers) - layer) * 210;
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", 18);
    text.setAttribute("y", y - 24);
    text.setAttribute("class", "column-label");
    text.textContent = layer === 0 ? `Layer 0 | leaves (${meta.layer_sizes[String(layer)]})` : `Layer ${layer} (${meta.layer_sizes[String(layer)]})`;
    labelLayer.appendChild(text);
  }
  svg.appendChild(labelLayer);

  const edgeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
  for (const [sourceId, targetId] of layout.edges) {
    const a = layout.positions.get(sourceId);
    const b = layout.positions.get(targetId);
    if (!a || !b) continue;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", edgePath(a, b));
    const selectedPath = selectedId && (sourceId === selectedId || targetId === selectedId);
    const qaPath = currentHighlights.path.has(sourceId) && currentHighlights.path.has(targetId);
    path.setAttribute("class", selectedPath || qaPath ? "edge highlight" : "edge");
    edgeLayer.appendChild(path);
  }
  svg.appendChild(edgeLayer);

  const nodeLayer = document.createElementNS("http://www.w3.org/2000/svg", "g");
  const renderedIds = Array.from(layout.visibleIds).sort((a, b) => {
    const pa = layout.positions.get(a);
    const pb = layout.positions.get(b);
    return (pa?.x || 0) - (pb?.x || 0) || (pa?.y || 0) - (pb?.y || 0);
  });
  for (const id of renderedIds) {
    const node = byId.get(id);
    const pos = layout.positions.get(id);
    if (!node || !pos) continue;
    const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const matches = nodeMatches(node, layout.query);
    const isSource = currentHighlights.source.has(id);
    const isQaPath = currentHighlights.path.has(id);
    group.setAttribute(
      "class",
      `node ${node.node_type}${isQaPath ? " qa-path" : ""}${isSource ? " source" : ""}${id === selectedId ? " selected" : ""}${matches ? " match" : ""}`
    );
    group.setAttribute("transform", `translate(${pos.x},${pos.y})`);
    group.setAttribute("data-id", id);
    group.addEventListener("click", () => {
      selectedId = id;
      render();
      renderDetails(node);
    });

    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    const radius = node.node_type === "leaf" ? 5 : Math.min(18, 8 + Math.sqrt(node.descendant_leaf_count) * 1.25);
    circle.setAttribute("r", radius);
    circle.setAttribute("fill", nodeColor(node));
    group.appendChild(circle);

    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    const sourceRank = currentHighlights.rankById.get(id);
    title.textContent = `${node.label}\nchildren: ${node.child_count}\nleaves: ${node.descendant_leaf_count}${sourceRank ? "\nsource rank: " + sourceRank : ""}`;
    group.appendChild(title);

    const showLabel = layout.mode === "full"
      ? Number(node.layer) === 0
      : layout.mode === "all"
        ? node.node_type !== "leaf" || Number(node.layer) === 0 || matches
        : node.node_type !== "leaf" || matches;
    if (showLabel) {
      const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
      if (node.layer === 0) {
        text.setAttribute("x", 0);
        text.setAttribute("y", radius + 14);
        text.setAttribute("text-anchor", "middle");
      } else {
        text.setAttribute("x", radius + 7);
        text.setAttribute("y", 0);
      }
      text.setAttribute("class", node.node_type === "leaf" ? "muted-label" : "");
      text.textContent = node.node_type === "leaf"
        ? truncate(node.patent_id || node.title || node.label, layout.mode === "full" ? 18 : 44)
        : `#${node.index} | ${node.descendant_leaf_count} leaves`;
      group.appendChild(text);
    }
    if (sourceRank) {
      const rankText = document.createElementNS("http://www.w3.org/2000/svg", "text");
      rankText.setAttribute("x", -3);
      rankText.setAttribute("y", 1);
      rankText.setAttribute("text-anchor", "middle");
      rankText.setAttribute("class", "source-rank");
      rankText.textContent = sourceRank;
      group.appendChild(rankText);
    }
    nodeLayer.appendChild(group);
  }
  svg.appendChild(nodeLayer);
  updateStats(layout.visibleIds.size);
  renderQaSummary();
  applyZoom(false);
}

function truncate(value, limit) {
  const text = String(value || "");
  return text.length > limit ? text.slice(0, limit - 1) + "..." : text;
}

function updateStats(visibleCount) {
  document.getElementById("stats").innerHTML = [
    ["Nodes", meta.total_nodes],
    ["Visible", visibleCount],
    ["Leaves", meta.leaf_nodes],
    ["Roots", meta.root_nodes.length]
  ].map(([label, value]) => `<div class="stat"><strong>${value}</strong><span>${label}</span></div>`).join("");
}

function renderLayers() {
  const rows = Object.entries(meta.layer_sizes)
    .sort((a, b) => Number(b[0]) - Number(a[0]))
    .map(([layer, size]) => `<div class="layer-row"><span>Layer ${escapeHtml(layer)}</span><strong>${size}</strong></div>`)
    .join("");
  document.getElementById("layers").innerHTML = `<h3>Layer Sizes</h3>${rows}`;
}

function renderLegend() {
  const rows = categoryKeys.map(key => {
    const name = meta.category_names[key] || key;
    const count = meta.categories[key] || 0;
    return `<div class="legend-row">
      <span class="legend-name"><span class="swatch" style="background:${colorByCategory.get(key)}"></span><span>${escapeHtml(key)} | ${escapeHtml(name)}</span></span>
      <strong>${count}</strong>
    </div>`;
  }).join("");
  document.getElementById("legend").innerHTML = `
    <h3>Node Color</h3>
    <div class="legend-note">Node fill color is category color. Blue/orange/green/red filled nodes are categories, not retrieval status. For summary nodes, fill color is the dominant descendant leaf category.</div>
    ${rows}
    <h3>Node Outline</h3>
    <div class="outline-legend">
      <div class="outline-row"><span class="outline-swatch source"></span><span>Retrieved source context for the selected QA/method</span></div>
      <div class="outline-row"><span class="outline-swatch path"></span><span>On the highlighted source tree path</span></div>
    </div>
  `;
}

function renderQaControls() {
  const container = document.getElementById("qaControls");
  if (!qaSources.qa_items || !qaSources.qa_items.length) {
    container.innerHTML = "<h3>QA Sources</h3><p class='subtitle'>No QA source map loaded.</p>";
    document.getElementById("qaSummary").style.display = "none";
    return;
  }
  document.getElementById("qaSummary").style.display = "block";
  const qa = activeQa() || qaSources.qa_items[0];
  activeQaIndex = qa.qa_index;
  const availableMethods = methodOrder.filter(method => qa.methods && qa.methods[method]);
  if (!availableMethods.includes(activeMethod)) activeMethod = availableMethods[0] || activeMethod;

  const qaOptions = qaSources.qa_items.map(item => {
    const label = `QA ${item.qa_index} | ${item.category || ""} | ${truncate(item.question, 74)}`;
    return `<option value="${escapeHtml(item.qa_index)}" ${Number(item.qa_index) === Number(activeQaIndex) ? "selected" : ""}>${escapeHtml(label)}</option>`;
  }).join("");
  const methodOptions = availableMethods.map(method => (
    `<option value="${escapeHtml(method)}" ${method === activeMethod ? "selected" : ""}>${escapeHtml(method)}</option>`
  )).join("");

  container.innerHTML = `
    <h3>QA Source Overlay</h3>
    <label>QA item
      <select id="qaSelect">${qaOptions}</select>
    </label>
    <label>Retrieval method
      <select id="methodSelect">${methodOptions}</select>
    </label>
    <button id="focusSources" type="button">Select first source node</button>
  `;

  document.getElementById("qaSelect").addEventListener("change", event => {
    activeQaIndex = Number(event.target.value);
    const nextQa = activeQa();
    const nextMethods = nextQa ? methodOrder.filter(method => nextQa.methods && nextQa.methods[method]) : [];
    if (!nextMethods.includes(activeMethod)) activeMethod = nextMethods[0] || activeMethod;
    renderQaControls();
    render();
    renderDetails(byId.get(selectedId));
  });
  document.getElementById("methodSelect").addEventListener("change", event => {
    activeMethod = event.target.value;
    render();
    renderDetails(byId.get(selectedId));
  });
  document.getElementById("focusSources").addEventListener("click", () => {
    const method = activeMethodData();
    const first = method && method.source_node_indices && method.source_node_indices.length
      ? String(method.source_node_indices[0])
      : null;
    if (first && byId.has(first)) {
      selectedId = first;
      render();
      renderDetails(byId.get(first));
    }
  });
}

function renderQaSummary() {
  const target = document.getElementById("qaSummary");
  if (!qaSources.qa_items || !qaSources.qa_items.length) return;
  const qa = activeQa();
  const method = activeMethodData();
  if (!qa || !method) {
    target.innerHTML = "No QA source selected.";
    return;
  }
  const sourceCount = (method.source_node_indices || []).length;
  const sourceList = (method.source_nodes || []).slice(0, 8).map(source => {
    return `#${source.node_index} L${source.layer} r${source.rank}`;
  }).join("<br>");
  target.innerHTML = `
    <strong>Question type</strong><br>${escapeHtml(qa.question_type || "")}<br><br>
    <strong>Question</strong><br>${escapeHtml(qa.question)}<br><br>
    <strong>Method</strong>: ${escapeHtml(activeMethod)} |
    <strong>score</strong>: ${escapeHtml(method.judge_score || "-")} |
    <strong>hit/rank</strong>: ${escapeHtml(method.hit || "-")}/${escapeHtml(method.rank || "-")}<br>
    <strong>source nodes</strong>: ${sourceCount}<br>
    <span class="subtitle">Fill color = category. Black outline = retrieved context source. Dashed outline = highlighted source path.</span><br><br>
    ${sourceList ? `<strong>Top source nodes</strong><br>${sourceList}` : ""}
  `;
}

function categoryBars(node) {
  const entries = Object.entries(node.category_counts || {}).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return "";
  const max = Math.max(...entries.map(([, value]) => value));
  return `<div class="bar">${entries.map(([key, value]) => {
    const pct = max ? Math.round((value / max) * 100) : 0;
    return `<div class="bar-row">
      <span>${escapeHtml(key)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%;background:${colorByCategory.get(key) || "#94a3b8"}"></span></span>
      <strong>${value}</strong>
    </div>`;
  }).join("")}</div>`;
}

function connectedLeafList(node) {
  if (Number(node.layer) !== 1) return "";
  const leaves = (node.children || [])
    .map(childId => byId.get(String(childId)))
    .filter(child => child && Number(child.layer) === 0)
    .sort((a, b) => Number(a.index) - Number(b.index));
  if (!leaves.length) return "";
  return leaves.map(leaf => `
    <div class="connected-leaf">
      <strong>#${escapeHtml(leaf.index)} ${escapeHtml(leaf.patent_id || "")}</strong>
      <span>${escapeHtml(leaf.category || "")} | ${escapeHtml(truncate(leaf.title || leaf.text_preview || "", 92))}</span>
    </div>
  `).join("");
}

function renderDetails(node) {
  if (!node) {
    details.innerHTML = `<div class="empty">Select a node to inspect details.</div>`;
    return;
  }
  const highlights = activeSourceSets();
  const nodeId = String(node.index);
  const source = highlights.sourceById.get(nodeId);
  const badges = [];
  if (source) {
    badges.push(`<span class="badge source">QA source rank ${escapeHtml(source.rank)}</span>`);
  }
  const leafSamples = (node.leaf_samples || []).map(leaf => `
    <div class="leaf-item">
      <strong>${escapeHtml(leaf.patent_id || "#" + leaf.index)}</strong>
      <span>${escapeHtml(leaf.category)} | ${escapeHtml(leaf.category_name)}</span><br>
      <span>${escapeHtml(truncate(leaf.title, 110))}</span>
    </div>
  `).join("");
  const connectedLeaves = connectedLeafList(node);
  details.innerHTML = `
    <h2>${escapeHtml(node.node_type === "leaf" ? "Leaf Patent" : "Summary Node")} #${escapeHtml(node.index)}</h2>
    ${badges.length ? `<div class="badge-row">${badges.join("")}</div>` : ""}
    <dl class="detail-kv">
      <dt>Layer</dt><dd>${escapeHtml(node.layer)}</dd>
      <dt>Children</dt><dd>${escapeHtml(node.child_count)}</dd>
      <dt>Desc. leaves</dt><dd>${escapeHtml(node.descendant_leaf_count)}</dd>
      <dt>Patent ID</dt><dd>${escapeHtml(node.patent_id || "-")}</dd>
      <dt>Category</dt><dd>${escapeHtml(node.category || node.dominant_category || "-")} | ${escapeHtml(node.category_name || "-")}</dd>
      <dt>Parents</dt><dd>${escapeHtml((node.parents || []).join(", ") || "-")}</dd>
      <dt>Child IDs</dt><dd>${escapeHtml((node.children || []).join(", ") || "-")}</dd>
      <dt>Source score</dt><dd>${source ? escapeHtml(Number(source.score || 0).toFixed(4)) : "-"}</dd>
      <dt>Source tokens</dt><dd>${source ? escapeHtml(source.token_count || "-") : "-"}</dd>
    </dl>
    <h3>Category Mix</h3>
    ${categoryBars(node) || "<p class='subtitle'>No category mix available.</p>"}
    <h3>Text Preview</h3>
    <div class="preview">${escapeHtml(node.text_preview || "")}</div>
    ${connectedLeaves ? `<h3>Connected L0 Leaves</h3><div class="connected-leaves">${connectedLeaves}</div>` : ""}
    <h3>Sample Leaf Patents</h3>
    <div class="leaf-list">${leafSamples || "<p class='subtitle'>No leaf samples.</p>"}</div>
  `;
}

function collapseSummaries() {
  collapsed = new Set(nodes.filter(node => node.node_type !== "leaf" && node.layer < Number(meta.num_layers)).map(node => node.id));
  for (const root of roots) collapsed.delete(root);
  render();
}

document.getElementById("expandAll").addEventListener("click", () => {
  collapsed.clear();
  render();
});
document.getElementById("collapseAll").addEventListener("click", collapseSummaries);
leftPanelButton.addEventListener("click", () => {
  layoutRoot.classList.toggle("left-collapsed");
  updatePanelButtons();
  applyZoom(false);
});
rightPanelButton.addEventListener("click", () => {
  layoutRoot.classList.toggle("right-collapsed");
  updatePanelButtons();
  applyZoom(false);
});
document.getElementById("zoomOutButton").addEventListener("click", () => {
  setZoom(zoomLevel - zoomStep);
});
document.getElementById("zoomInButton").addEventListener("click", () => {
  setZoom(zoomLevel + zoomStep);
});
document.getElementById("zoomResetButton").addEventListener("click", () => {
  setZoom(1);
});
document.getElementById("fitButton").addEventListener("click", () => {
  setZoom(1, false);
  canvasWrap.scrollTo({ top: 0, left: 0, behavior: "smooth" });
});
canvasWrap.addEventListener("wheel", event => {
  event.preventDefault();
  const factor = event.deltaY < 0 ? 1.12 : 0.88;
  setZoomAtPoint(zoomLevel * factor, event.clientX, event.clientY);
}, { passive: false });
canvasWrap.addEventListener("mousedown", event => {
  if (event.button !== 0) return;
  if (event.target.closest && event.target.closest(".node")) return;
  isPanning = true;
  panStartX = event.clientX;
  panStartY = event.clientY;
  panStartLeft = canvasWrap.scrollLeft;
  panStartTop = canvasWrap.scrollTop;
  canvasWrap.classList.add("panning");
  event.preventDefault();
});
window.addEventListener("mousemove", event => {
  if (!isPanning) return;
  const dx = event.clientX - panStartX;
  const dy = event.clientY - panStartY;
  canvasWrap.scrollLeft = panStartLeft - dx;
  canvasWrap.scrollTop = panStartTop - dy;
});
window.addEventListener("mouseup", () => {
  if (!isPanning) return;
  isPanning = false;
  canvasWrap.classList.remove("panning");
});
searchBox.addEventListener("input", render);
depthSelect.addEventListener("change", render);

renderLayers();
renderLegend();
renderQaControls();
updatePanelButtons();
render();
renderDetails(byId.get(selectedId));
</script>
</body>
</html>
