tegory": "AC", "category_counts": {"AC": 1}, "patent_id": "2024-7023709", "title": "근접 메모리 컴퓨팅 요소들에 대한 일관성 디렉토리 제어기 오버헤드를 줄이기 위한 메커니즘(mechanism for reducing coherence directory controller overhead for near-memory compute elements)", "text_preview": "PimPF(Processing In-Memory Probe Filter)으로 또한 지칭되는 병렬 프로세싱(PP) 레벨 일관성 디렉토리가 일관성 디렉토리 제어기에 추가된다. 일관성 디렉토리 제어기가 호스트로부터 브로드캐스트 PIM 커맨드를 수신하거나, 다수의 메모리 뱅크들로 병렬로 지향되는 PIM 커맨드를 수신하면, PimPF는 일관성 디렉토리 제어기의 기존 시스템 레벨 디렉토리들과 별개인 캐시 일관성을 위한 디렉토리를 유지함으로써 PIM 커맨드의 프로세싱을 가속화한다. PimPF는 브로드캐스트 PIM 커맨드에 의해 영향을 받는 메모리 주소들을 정의하는 주소 서명들에 따라 디렉토리를 유지한다. 2개의 구현들, 즉 레지스터들로의 PIM 로드들을 가속화하는 경량 구현과 레지스터들로의 PIM 로드들 및 메모리로의 PIM 저장들 둘 모두를 가속화하는 중량 구현이 설명된다.", "label": "2024-7023709 - 근접 메모리 컴퓨팅 요소들에 대한 일관성 디렉토리 제어기 오버헤드를 줄이기 위한 메커니즘(mechanism for...", "leaf_samples": [{"index": 149, "patent_id": "2024-7023709", "title": "근접 메모리 컴퓨팅 요소들에 대한 일관성 디렉토리 제어기 오버헤드를 줄이기 위한 메커니즘(mechanism for reducing coherence directory controller overhead for near-memory compute elements)", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "150", "index": 150, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "13-805649", "title": "Methods and systems for machine-learning based simulation of flow", "text_preview": "There is provided a method for modeling a hydrocarbon reservoir that includes generating a reservoir model comprising a plurality of sub regions. At least one of the sub regions is simulated using a training simulation to obtain a set of training parameters comprising state variables and boundary conditions of the at least one sub region. A machine learning algorithm is used to approximate, based on the set of training parameters, an inverse operator of a matrix equation that provides a solution to fluid flow through a porous media. The hydrocarbon reservoir can be simulated using the inverse operator approximated for the at least one sub region. The method also includes generating a data representation of a physical hydrocarbon reservoir can be generated in a non-transitory, computer-readable, medium based, at least in part, on the results of the simulation.", "label": "13-805649 - Methods and systems for machine-learning based simulation of fl...", "leaf_samples": [{"index": 150, "patent_id": "13-805649", "title": "Methods and systems for machine-learning based simulation of flow", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "151", "index": 151, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "14-748203", "title": "System and method for reducing functional ambiguity in visual contents", "text_preview": "The present disclosure relates to a method and a system for reducing functional ambiguity from an image. In one embodiment, an input image is received and processed to identify objects. Spatial proximity score of the identified objects are determined based on which functional proximity score of functionalities associated with the identified objects is further determined. Upon determining the functional proximity score, possible domain of all the functionalities associated with the identified objects is determined. Further, a domain score is determined based on which the ambiguity of the domain related to the input image is reduced. A text summary of objects, functionalities and possible domains associated with the input image is then generated upon mapping with one or more user profiles and displayed to end user.", "label": "14-748203 - System and method for reducing functional ambiguity in visual c...", "leaf_samples": [{"index": 151, "patent_id": "14-748203", "title": "System and method for reducing functional ambiguity in visual contents", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "152", "index": 152, "layer": 0, "node_type": "leaf", "children": [], "parents": ["224"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-230388", "title": "Mechanism for throttling untrusted interconnect agents", "text_preview": "A host system-on-chip (SoC) includes a network on chip (NoC) for transmitting local traffic between internal blocks of the SoC, an external processor link for receiving messages at the host SoC from an untrusted device. A traffic controller in the host SoC that is coupled with the external processor link monitors an amount of external traffic from the untrusted device over a set of one or more time intervals, detects a violation of a traffic policy based on the amount of external traffic, and in response to detecting the violation, reduces traffic in the NoC resulting from the messages from the untrusted device.", "label": "15-230388 - Mechanism for throttling untrusted interconnect agents", "leaf_samples": [{"index": 152, "patent_id": "15-230388", "title": "Mechanism for throttling untrusted interconnect agents", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "153", "index": 153, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-521856", "title": "Method and apparatus for distributed and cooperative computation in artificial neural networks", "text_preview": "An apparatus and method are described for distributed and cooperative computation in artificial neural networks. For example, one embodiment of an apparatus comprises: an input/output (I/O) interface; a plurality of processing units communicatively coupled to the I/O interface to receive data for input neurons and synaptic weights associated with each of the input neurons, each of the plurality of processing units to process at least a portion of the data for the input neurons and synaptic weights to generate partial results; and an interconnect communicatively coupling the plurality of processing units, each of the processing units to share the partial results with one or more other processing units over the interconnect, the other processing units using the partial results to generate additional partial results or final results. The processing units may share data including input neurons and weights over the shared input bus.", "label": "15-521856 - Method and apparatus for distributed and cooperative computatio...", "leaf_samples": [{"index": 153, "patent_id": "15-521856", "title": "Method and apparatus for distributed and cooperative computation in artificial neural networks", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "154", "index": 154, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-786346", "title": "Software-defined buffer/transposer for general matrix multiplication in a programmable ic", "text_preview": "Methods and apparatus are described for simultaneously buffering and reformatting (e.g., transposing) a matrix for high-speed data streaming in general matrix multiplication (GEMM), which may be implemented by a programmable integrated circuit (IC). Examples of the present disclosure increase the effective double data rate (DDR) memory throughput for streaming data into GEMM digital signal processing (DSP) engine multifold, as well as eliminate slow data reformatting on a host central processing unit (CPU). This may be accomplished through software-defined (e.g., C++) data structures and access patterns that result in hardware logic that simultaneously buffers and reorganizes the data to achieve linear DDR addressing.", "label": "15-786346 - Software-defined buffer/transposer for general matrix multiplic...", "leaf_samples": [{"index": 154, "patent_id": "15-786346", "title": "Software-defined buffer/transposer for general matrix multiplication in a programmable ic", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "155", "index": 155, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-793539", "title": "Neural bit embeddings for graphs", "text_preview": "An approach is provided in which a system transforms a set of embedding approximation values corresponding to a set of knowledge graph nodes into a set of binary valued embedding vectors. The system evaluates the set of binary valued embedding vectors against a query and a selects one of the binary valued embedding vectors based on the evaluation. The system then identifies one of the knowledge graph nodes that corresponds to the selected binary valued embedding vector and in turn, provides a result to the query based on the identified knowledge graph node.", "label": "15-793539 - Neural bit embeddings for graphs", "leaf_samples": [{"index": 155, "patent_id": "15-793539", "title": "Neural bit embeddings for graphs", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "156", "index": 156, "layer": 0, "node_type": "leaf", "children": [], "parents": ["205"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-851449", "title": "Inline ecc function for system-on-chip", "text_preview": "An example integrated circuit (IC) includes a network-on-chip (NoC), a master device coupled to the NoC, a memory controller coupled to the NoC configured to control a memory coupled to the IC, and an inline error-correcting code (ECC) circuit coupled to the NoC. The ECC circuit is configured to receive read and write transactions from the master device that target the memory, compute ECC data based on the read and write transactions, and provide outgoing transactions to the memory controller.", "label": "15-851449 - Inline ecc function for system-on-chip", "leaf_samples": [{"index": 156, "patent_id": "15-851449", "title": "Inline ecc function for system-on-chip", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "157", "index": 157, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-934496", "title": "Method for modifying segmentation model based on artificial intelligence, device and storage medium", "text_preview": "Embodiments of the present disclosure disclose a method for modifying a segmentation model based on artificial intelligence, a device and a storage medium. The method may include: acquiring a model parameter of the segmentation model, and performing a training on a feature vector corresponding to a preset generalized feature of a first training corpus via a neural network so as to acquire a model parameter of the preset generalized feature; performing a word segmentation on the first training corpus according to the model parameter of the segmentation model and the model parameter of the preset generalized feature, so as to acquire a segmentation result; and comparing the segmentation result with the first training corpus according to a preset rule, and modifying the model parameter of the segmentation model and a parameter of the neural network according to a comparison result.", "label": "15-934496 - Method for modifying segmentation model based on artificial int...", "leaf_samples": [{"index": 157, "patent_id": "15-934496", "title": "Method for modifying segmentation model based on artificial intelligence, device and storage medium", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "158", "index": 158, "layer": 0, "node_type": "leaf", "children": [], "parents": ["207"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "15-964901", "title": "Flexible address mapping for a noc in an integrated circuit", "text_preview": "Embodiments herein describe a SoC that includes a mapper that identifies a destination ID for routing a transaction through a NoC. In one embodiment, the NoC includes ingress and egress logic blocks which permit hardware elements in the SoC to transmit and receive data using the NoC. In one embodiment, the ingress logic blocks can include the mapper that identifies a destination ID for each transaction. In one embodiment, the mapper can receive a destination ID from the hardware element that submitted the transaction to the ingress logic block. In this case, the mapper can bypass the address map by using the provided destination ID. If a destination ID is not provided, however, the mapper can use an address provided in the transaction to identify the destination ID.", "label": "15-964901 - Flexible address mapping for a noc in an integrated circuit", "leaf_samples": [{"index": 158, "patent_id": "15-964901", "title": "Flexible address mapping for a noc in an integrated circuit", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "159", "index": 159, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-172515", "title": "Apparatus and methods for vector operations", "text_preview": "Aspects for vector operations in neural network are described herein. The aspects may include a vector caching unit configured to store a first vector and a second vector, wherein the first vector includes one or more first elements and the second vector includes one or more second elements. The aspects may further include one or more adders and a combiner. The one or more adders may be configured to respectively add each of the first elements to a corresponding one of the second elements to generate one or more addition results. The combiner may be configured to combine a combiner configured to combine the one or more addition results into an output vector.", "label": "16-172515 - Apparatus and methods for vector operations", "leaf_samples": [{"index": 159, "patent_id": "16-172515", "title": "Apparatus and methods for vector operations", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "160", "index": 160, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-260331", "title": "Generation of executable files corresponding to neural network models", "text_preview": "In an example, a neural network program corresponding to a neural network model is received. The neural network program includes matrices, vectors, and matrix-vector multiplication (MVM) operations. A computation graph corresponding to the neural network model is generated. The computation graph includes a plurality of nodes, each node representing a MVM operation, a matrix, or a vector. Further, a class model corresponding to the neural network model is populated with a data structure pointing to the computation graph. The computation graph is traversed based on the class model. Based on the traversal, the plurality of MVM operations are assigned to MVM units of a neural network accelerator. Each MVM unit can perform a MVM operation. Based on assignment of the plurality of MVM operations, an executable file is generated for execution by the neural network accelerator.", "label": "16-260331 - Generation of executable files corresponding to neural network ...", "leaf_samples": [{"index": 160, "patent_id": "16-260331", "title": "Generation of executable files corresponding to neural network models", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "161", "index": 161, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-318104", "title": "Method and system for fast determining time-delay stability margin of power system", "text_preview": "The present disclosure discloses a method for fast determining a time-delay stability margin of a power system, which focuses on three steps, i.e., Jordan standardization, Taylor separation and Schur simplification, to reconstruct a new time delay system and reduce the system dimension. In this method, firstly, a time delay model is Jordan standardized; further, Taylor expansion is applied in a process for separating state variables with time delay from stage variables without time delay; then, balanced model reduction is realized by Schur simplification; and finally, a WSCC 3-generator-9-bus power system with multiple delays will be used to validate the proposed method via several typical criteria.", "label": "16-318104 - Method and system for fast determining time-delay stability mar...", "leaf_samples": [{"index": 161, "patent_id": "16-318104", "title": "Method and system for fast determining time-delay stability margin of power system", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "162", "index": 162, "layer": 0, "node_type": "leaf", "children": [], "parents": ["209"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-443858", "title": "Constructing answers to queries through use of a deep model", "text_preview": "Various technologies relating to constructing an answer to a query are described herein, wherein the answer is in list form. The answer includes a header and a list element. A deep model receives content of a webpage that is deemed relevant to the query by a search engine and constructs the answer to the webpage upon receipt of the query.", "label": "16-443858 - Constructing answers to queries through use of a deep model", "leaf_samples": [{"index": 162, "patent_id": "16-443858", "title": "Constructing answers to queries through use of a deep model", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "163", "index": 163, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-528553", "title": "Systems and methods for power management of hardware utilizing virtual multilane architecture", "text_preview": "Aspects of the present disclosure are presented for a power management system of a multilane AI system architecture. The system may include an orchestrator configured to control power and other operations of a lane. An uber orchestrator manages the overall system, and may know all of the multilane systems within the AI virtual multilane system that need to be active at a given frequency and power envelope for given price, and performance constraints. The orchestrator of each lane knows the compute/logic blocks that need to be active for a given AI app model AI processing chain execution. The orchestrator may be configured to send commands to turn off power to certain components that are not utilized in performing an AI execution sequence, deactivate operation to the lane when its functions are completed, and also modulate the clock frequency of a lane to fit the computation demands while minimizing power usage.", "label": "16-528553 - Systems and methods for power management of hardware utilizing ...", "leaf_samples": [{"index": 163, "patent_id": "16-528553", "title": "Systems and methods for power management of hardware utilizing virtual multilane architecture", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "164", "index": 164, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-831552", "title": "Answer selection method for question answering system and the system", "text_preview": "Disclosed are an answer selection method for a question answering system. With the method and system, a sentence distributed representation of a question and an answer is generated by adopting a hierarchical length-adaptive neural network structure with a purpose of extracting high-quality sentence features by using different neural feature extractors according to a length of an input sentence. First, one word distributed representation is generated for each word in the input sentence by connecting one fixed word embedding and one finely-adjusted word embedding. Next, a BiLSTM-based feature extractor is used for a short sentence and a Transformer-based feature extractor is used for a long sentence. Finally, a sentence vector representation for measuring a correlation between a question and a candidate answer is generated by using an attention pooling layer considering an interaction between a question sentence and an answer sentence.", "label": "16-831552 - Answer selection method for question answering system and the s...", "leaf_samples": [{"index": 164, "patent_id": "16-831552", "title": "Answer selection method for question answering system and the system", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "165", "index": 165, "layer": 0, "node_type": "leaf", "children": [], "parents": ["203"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "16-888885", "title": "Systems and methods for protecting neural network weights", "text_preview": "The disclosed computer-implemented method may include (i) identifying a neural network that comprises an interconnected set of nodes organized in a set of layers represented by a plurality of matrices that each comprise a plurality of weights, where each weight represents a connection between a node in the interconnected set of nodes that resides in one layer in the set of layers and an additional node in the set of interconnected nodes that resides in a different layer in the set of layers, (ii) encrypting, using an encryption cipher, the plurality of weights, (iii) detecting that execution of the neural network has been initiated, and (iv) decrypting, using the encryption cipher, the plurality of weights in response to detecting that the execution of the neural network has been initiated. Various other methods, systems, and computer-readable media are also disclosed.", "label": "16-888885 - Systems and methods for protecting neural network weights", "leaf_samples": [{"index": 165, "patent_id": "16-888885", "title": "Systems and methods for protecting neural network weights", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "166", "index": 166, "layer": 0, "node_type": "leaf", "children": [], "parents": ["209"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-016053", "title": "Memory controllers including examples of calculating hamming distances for neural network and data center applications", "text_preview": "Examples of systems and method described herein provide for the processing of image codes (e.g., a binary embedding) at a memory controller with various memory devices. Such images codes may generated by various endpoint computing devices, such as Internet of Things (IoT) computing devices, Such devices can generate a Hamming processing request, having an image code of the image, to compare that representation of the image to other images (e.g., in an image dataset) to identify a match or a set of neural network results. Advantageously, examples described herein may be used in neural networks to facilitate the processing of datasets, so as to increase the rate and amount of processing of such datasets. For example, comparisons of image codes can be performed “closer” to the memory devices, e.g., at the memory controller coupled to memory devices.", "label": "17-016053 - Memory controllers including examples of calculating hamming di...", "leaf_samples": [{"index": 166, "patent_id": "17-016053", "title": "Memory controllers including examples of calculating hamming distances for neural network and data center applications", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "167", "index": 167, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-165014", "title": "Hardware implementation of convolutional layer of deep neural network", "text_preview": "Hardware implementations of, and methods for processing, a convolution layer of a DNN that comprise a plurality of convolution engines wherein the input data and weights are provided to the convolution engines in an order that allows input data and weights read from memory to be used in at least two filter-window calculations performed either by the same convolution engine in successive cycles or by different convolution engines in the same cycle. For example, in some hardware implementations of a convolution layer the convolution engines are configured to process the same weights but different input data each cycle, but the input data for each convolution engine remains the same for at least two cycles so that the convolution engines use the same input data in at least two consecutive cycles.", "label": "17-165014 - Hardware implementation of convolutional layer of deep neural n...", "leaf_samples": [{"index": 167, "patent_id": "17-165014", "title": "Hardware implementation of convolutional layer of deep neural network", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "168", "index": 168, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-301344", "title": "Data replication for accelerator", "text_preview": "A direct memory access (DMA) engine can be used to multicast data from system memory to a target memory for loading into an array. The DMA engine may include a controller that is configured to receive a data transfer request, and generate a set of write operations for the output interface. The set of write operations can include, for each of multiple partitions of the target memory, a write operation to write usable data from the multicast data to an address offset in the corresponding partition, and an additional write operation to write filler data from the multicast data to a null device address.", "label": "17-301344 - Data replication for accelerator", "leaf_samples": [{"index": 168, "patent_id": "17-301344", "title": "Data replication for accelerator", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "169", "index": 169, "layer": 0, "node_type": "leaf", "children": [], "parents": ["225"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-399694", "title": "Stacked device system", "text_preview": "Multiple device stacks are interconnected in a ring topology. The inter-device stack communication may utilize a handshake protocol. This ring topology may include the host so that the host may initialize and load the device stacks with data and/or commands (e.g., software, algorithms, etc.). The inter-device stack interconnections may also be configured to include/remove the host and/or to implement varying numbers of separate ring topologies. By configuring the system with more than one ring topology, and assigning different problems to different rings, multiple, possibly unrelated, machine learning tasks may be performed in parallel by the device stack system.", "label": "17-399694 - Stacked device system", "leaf_samples": [{"index": 169, "patent_id": "17-399694", "title": "Stacked device system", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "170", "index": 170, "layer": 0, "node_type": "leaf", "children": [], "parents": ["210"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-408251", "title": "Method and apparatus to process an instruction for a distributed logic having tightly coupled accelerator core and processor core in a multi-dimensional packaging", "text_preview": "A packaging technology to improve performance of an AI processing system resulting in an ultra-high bandwidth system. An IC package is provided which comprises: a substrate; a first die on the substrate, and a second die stacked over the first die. The first die can be a first logic die (e.g., a compute chip, CPU, GPU, etc.) while the second die can be a compute chiplet comprising ferroelectric or paraelectric logic. Both dies can include ferroelectric or paraelectric logic. The ferroelectric/paraelectric logic may include AND gates, OR gates, complex gates, majority, minority, and/or threshold gates, sequential logic, etc. The IC package can be in a 3D or 2.5D configuration that implements logic-on-logic stacking configuration. The 3D or 2.5D packaging configurations have chips or chiplets designed to have time distributed or spatially distributed processing. The logic of chips or chiplets is segregated so that one chip in a 3D or 2.5D stacking arrangement is hot at a time.", "label": "17-408251 - Method and apparatus to process an instruction for a distribute...", "leaf_samples": [{"index": 170, "patent_id": "17-408251", "title": "Method and apparatus to process an instruction for a distributed logic having tightly coupled accelerator core and processor core in a multi-dimensional packaging", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "171", "index": 171, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-429873", "title": "Multi-tile architecture for graphics operations", "text_preview": "Embodiments are generally directed to a multi-tile architecture for graphics operations. An embodiment of an apparatus includes a multi-tile architecture for graphics operations including a multi-tile graphics processor, the multi-tile processor includes one or more dies; multiple processor tiles installed on the one or more dies; and a structure to interconnect the processor tiles on the one or more dies, wherein the structure to enable communications between processor tiles the processor tiles.", "label": "17-429873 - Multi-tile architecture for graphics operations", "leaf_samples": [{"index": 171, "patent_id": "17-429873", "title": "Multi-tile architecture for graphics operations", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "172", "index": 172, "layer": 0, "node_type": "leaf", "children": [], "parents": ["226"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-457502", "title": "Resizable scratchpad memory", "text_preview": "Techniques for implementing a dynamically resizable memory region for alternative use in a memory are described. The techniques may include using two concurrent address maps corresponding to two address ranges for a memory represented as an array of memory blocks. The first address range can be mapped to the memory with starting addresses of the memory blocks incrementing sequentially along each row. The second address range can be mapped to the memory with starting addresses of the memory blocks incrementing sequentially along each column. When an access request is received having a target address belonging to the first address range, the target address is provided as the memory address to access the memory. When an access request having a target address belonging to the second address range, the target address is translated by address translation logic into a memory address to access the memory.", "label": "17-457502 - Resizable scratchpad memory", "leaf_samples": [{"index": 172, "patent_id": "17-457502", "title": "Resizable scratchpad memory", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "173", "index": 173, "layer": 0, "node_type": "leaf", "children": [], "parents": ["219"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-515976", "title": "Dma engines configured to perform first portion data transfer commands with a first dma engine and second portion data transfer commands with second dma engine", "text_preview": "A method for hardware management of DMA transfer commands includes accessing, by a first DMA engine, a DMA transfer command and determining a first portion of a data transfer requested by the DMA transfer command. Transfer of a first portion of the data transfer by the first DMA engine is initiated based at least in part on the DMA transfer command. Similarly, a second portion of the data transfer by a second DMA engine is initiated based at least in part on the DMA transfer command. After transferring the first portion and the second portion of the data transfer, an indication is generated that signals completion of the data transfer requested by the DMA transfer command.", "label": "17-515976 - Dma engines configured to perform first portion data transfer c...", "leaf_samples": [{"index": 173, "patent_id": "17-515976", "title": "Dma engines configured to perform first portion data transfer commands with a first dma engine and second portion data transfer commands with second dma engine", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "174", "index": 174, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-778134", "title": "Information processing device", "text_preview": "A novel information processing device with least signal transmission delay and low power consumption is provided. A storage device includes a first layer, a second layer, and a third layer. The first layer is provided with a circuit. The second layer is provided with a memory cell portion. The third layer is provided with a first electrode. The circuit has a function of switching and performing reading or writing of first data or second data from or to the memory cell portion. At least part of the second layer is stacked above the first layer. At least part of the third layer is stacked above the second layer. An arithmetic device includes a fourth layer and a fifth layer. The fourth layer is provided with a central processing device. The fifth layer is provided with a second electrode. At least part of the fifth layer is stacked above the fourth layer. The circuit is electrically connected to the central processing device through the first electrode and the second electrode.", "label": "17-778134 - Information processing device", "leaf_samples": [{"index": 174, "patent_id": "17-778134", "title": "Information processing device", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "175", "index": 175, "layer": 0, "node_type": "leaf", "children": [], "parents": ["220"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-850595", "title": "Asynchronous process topology in a memory device", "text_preview": "Apparatuses and methods can be related to generating an asynchronous process topology in a memory device. The topology can be generated based on the results of a number of processes. The processes can be asynchronous given that the processing resources that implement the processes do not use a clock signal to generate the topology.", "label": "17-850595 - Asynchronous process topology in a memory device", "leaf_samples": [{"index": 175, "patent_id": "17-850595", "title": "Asynchronous process topology in a memory device", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "176", "index": 176, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "17-994123", "title": "Multi-chip module (mcm) with multi-port unified memory", "text_preview": "Semiconductor devices, packaging architectures and associated methods are disclosed. In one embodiment, a multi-chip module (MCM) is disclosed. The MCM includes a common substrate and a first integrated circuit (IC) chip disposed on the common substrate. The first IC chip includes a first memory interface. A second IC chip is disposed on the common substrate and includes a second memory interface. A first memory device is disposed on the common substrate and includes memory and a first port coupled to the memory. The first port is configured for communicating with the first memory interface of the first IC chip. A second port is coupled to the memory and communicates with the second memory interface of the second IC chip. In-memory processing circuitry is coupled to the memory and controls transactions between the first memory device and the first and second IC chips.", "label": "17-994123 - Multi-chip module (mcm) with multi-port unified memory", "leaf_samples": [{"index": 176, "patent_id": "17-994123", "title": "Multi-chip module (mcm) with multi-port unified memory", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "177", "index": 177, "layer": 0, "node_type": "leaf", "children": [], "parents": ["215"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-064121", "title": "Using a hardware sequencer in a direct memory access system of a system on a chip", "text_preview": "In various examples, a VPU and associated components may be optimized to improve VPU performance and throughput. For example, the VPU may include a min/max collector, automatic store predication functionality, a SIMD data path organization that allows for inter-lane sharing, a transposed load/store with stride parameter functionality, a load with permute and zero insertion functionality, hardware, logic, and memory layout functionality to allow for two point and two by two point lookups, and per memory bank load caching capabilities. In addition, decoupled accelerators may be used to offload VPU processing tasks to increase throughput and performance, and a hardware sequencer may be included in a DMA system to reduce programming complexity of the VPU and the DMA system. The DMA and VPU may execute a VPU configuration mode that allows the VPU and DMA to operate without a processing controller for performing dynamic region based data movement operations.", "label": "18-064121 - Using a hardware sequencer in a direct memory access system of ...", "leaf_samples": [{"index": 177, "patent_id": "18-064121", "title": "Using a hardware sequencer in a direct memory access system of a system on a chip", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "178", "index": 178, "layer": 0, "node_type": "leaf", "children": [], "parents": ["218"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-145236", "title": "Neural network with on-the-fly generation of the network parameters", "text_preview": "The present description concerns a circuit comprising: a number generator (205) configured to generate a sequence of vectors (207, 219) of size , the vector sequence being the same at each start-up of the number generator; a memory (211) configured to store a set of first parameters (Ω) of an auxiliary neural network (204); a processing device configured to generate a set of second parameters of a layer (201) of a main neural network by the application a plurality of times of a first operation (g), by the auxiliary neural network, performing a generation operation from each vector generated by the number generator, each generation delivering a vector of second parameters, the set of the vectors of second parameters forming said set of second parameters; and wherein the number of second parameters is greater than the number of first parameters.", "label": "18-145236 - Neural network with on-the-fly generation of the network parame...", "leaf_samples": [{"index": 178, "patent_id": "18-145236", "title": "Neural network with on-the-fly generation of the network parameters", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "179", "index": 179, "layer": 0, "node_type": "leaf", "children": [], "parents": ["224"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-206526", "title": "Autonomous vehicle system on chip mailbox architecture", "text_preview": "A system-on-chip (SoC) designed for an autonomous vehicle includes a central chiplet to coordinate the operations of the SoC constituent chiplets. The central chiplet includes a shared memory storing a number of programs associated with parallel workload pipelines, one or more processors to execute a scheduling program, and a cache memory accessible by the chiplets of the SoC. The SoC also includes a sensor data input chiplet to receive sensor data from vehicle sensors and store the sensor data in the cache memory. The scheduling program running on the central chiplet schedules the programs and causes respective workloads of the parallel workload pipelines to execute based, at least in part, on the sensor data stored in the cache memory.", "label": "18-206526 - Autonomous vehicle system on chip mailbox architecture", "leaf_samples": [{"index": 179, "patent_id": "18-206526", "title": "Autonomous vehicle system on chip mailbox architecture", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "180", "index": 180, "layer": 0, "node_type": "leaf", "children": [], "parents": ["208"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-211577", "title": "Constructing prompt information for submission to a language model by dynamically compressing source information", "text_preview": "A technique for interacting with a machine-trained language model uses dynamic prompt management. The technique includes: receiving an input query and creating prompt information that expresses the input query and targeted context information. The targeted context information is selected from candidate context information. Further, a part of the prompt information is formed by compressing source information by reducing a number of content units in the source information (where the source information includes the input query and/or the candidate context information). The method further includes submitting the prompt information to the machine-trained language model, and receiving a response from the machine-trained language model based on the prompt information. The technique has the overall effect of reducing the number of content units submitted to the language model, which, in turn, reduces the amount of resources and time required by the language model to process the input query.", "label": "18-211577 - Constructing prompt information for submission to a language mo...", "leaf_samples": [{"index": 180, "patent_id": "18-211577", "title": "Constructing prompt information for submission to a language model by dynamically compressing source information", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "181", "index": 181, "layer": 0, "node_type": "leaf", "children": [], "parents": ["200"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-237702", "title": "Look selection based on relationships in a virtual environment", "text_preview": "A processor of a host can define a plurality of relationships in a virtual environment. The processor of the host can also provide the plurality of inputs describing look preferences to an AI accelerator. The AI accelerator can receive the inputs. The AI accelerator can also generate a plurality of looks based on the plurality of relationships and the plurality of inputs.", "label": "18-237702 - Look selection based on relationships in a virtual environment", "leaf_samples": [{"index": 181, "patent_id": "18-237702", "title": "Look selection based on relationships in a virtual environment", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "182", "index": 182, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-328852", "title": "Chiplet aware adaptable quantization", "text_preview": "A chiplet-based architecture may quantize, or reduce, the number of bits at various stages of the data path in an artificial-intelligence processor. This architecture may leverage the synergy between quantizing multiple dimensions together to greatly decrease the memory usage and data path bandwidth. Internal weights may be quantized statically after a training procedure. Accumulator bits and activation bits may be quantized dynamically during an inference operation. New hardware logic may be configured to quantize the outputs of each operation directly from the core or other processing node before the tensor is stored in memory. Quantization may use a statistic from a previous tensor for a current output tensor, while also calculating a statistic to be used on a subsequent output tensor. In addition to quantizing based on a statistic, bits can be further quantized using a Kth percentile clamping operation.", "label": "18-328852 - Chiplet aware adaptable quantization", "leaf_samples": [{"index": 182, "patent_id": "18-328852", "title": "Chiplet aware adaptable quantization", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "183", "index": 183, "layer": 0, "node_type": "leaf", "children": [], "parents": ["224"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-333377", "title": "Hardware-based image/video processing in machine learning-accelerator system-on-chip", "text_preview": "A machine learning (ML)-accelerator system-on-chip (SoC) is described. The ML-accelerator SoC includes a set of ML-accelerator cores. The ML-accelerator SoC also includes a network-on-chip (NoC) coupled to the set of ML-accelerator cores. The ML-accelerator SoC further includes an inference video post processing (infVPP) module coupled to the NoC. The ML-accelerator SoC also includes a video decoder coupled to the NoC.", "label": "18-333377 - Hardware-based image/video processing in machine learning-accel...", "leaf_samples": [{"index": 183, "patent_id": "18-333377", "title": "Hardware-based image/video processing in machine learning-accelerator system-on-chip", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "184", "index": 184, "layer": 0, "node_type": "leaf", "children": [], "parents": ["224"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-388161", "title": "Error tolerant ai accelerators", "text_preview": "A compute engine including a compute-in-memory (CIM) hardware module and weight decomposition write circuitry is described. The CIM hardware module stores weights corresponding to a matrix. The CIM hardware module is configured to perform a vector-matrix multiplication (VMM) for the matrix. The weight decomposition write circuitry is coupled with the CIM hardware module and is configured to store weight decomposition data corresponding to the matrix. The weight decomposition write circuitry is also configured to determine a replacement matrix for the matrix from the weight decomposition data and to provide the replacement matrix to the CIM hardware module.", "label": "18-388161 - Error tolerant ai accelerators", "leaf_samples": [{"index": 184, "patent_id": "18-388161", "title": "Error tolerant ai accelerators", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "185", "index": 185, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-418293", "title": "Multi-chip module (mcm) with multi-port unified memory", "text_preview": "Semiconductor devices, packaging architectures and associated methods are disclosed. In one embodiment, a multi-chip module (MCM) is disclosed. The MCM includes a common substrate and a first integrated circuit (IC) chip disposed on the common substrate. The first IC chip includes a first memory interface. A second IC chip is disposed on the common substrate and includes a second memory interface. A first memory device is disposed on the common substrate and includes memory and a first port coupled to the memory. The first port is configured for communicating with the first memory interface of the first IC chip. A second port is coupled to the memory and communicates with the second memory interface of the second IC chip. In-memory processing circuitry is coupled to the memory and controls transactions between the first memory device and the first and second IC chips.", "label": "18-418293 - Multi-chip module (mcm) with multi-port unified memory", "leaf_samples": [{"index": 185, "patent_id": "18-418293", "title": "Multi-chip module (mcm) with multi-port unified memory", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "186", "index": 186, "layer": 0, "node_type": "leaf", "children": [], "parents": ["215"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-472482", "title": "Efficient direct convolution using simd instructions", "text_preview": "A computer comprising one or more processors offering vector instructions may implement a direct convolution on a source data set. The source data set may be one-dimensional or multi-dimensional. For a given vector width, w, of the vector instructions, w consecutive data elements of the output data set are computed in parallel using vector instructions. For multi-dimensional data sets, multiple vectors of the output data set are computed for a single load of a set of vectors from the source data set. New vector instructions are disclosed to improve the performance of the convolution and to enable full utilization of the arithmetic logic units within the one or more processors.", "label": "18-472482 - Efficient direct convolution using simd instructions", "leaf_samples": [{"index": 186, "patent_id": "18-472482", "title": "Efficient direct convolution using simd instructions", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "187", "index": 187, "layer": 0, "node_type": "leaf", "children": [], "parents": ["218"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-714655", "title": "Neural network device with configurable shared memory", "text_preview": "Please cancel the previous version of the Abstract, and enter the following substitute A neural network device includes a shared physical memory that has a plurality of independently accessible memory sections. The neural network device further includes a data processor core to execute instructions. The instructions include at least one instruction involving multiple memory access operations specifying respective logical memory addresses in a plurality of logical memories. During configuration of the neural network device for a particular application, respective memory sections of the plurality of independently accessible memory sections are assigned to respective logical memories of the plurality of logical memories. In accordance with the configuration, each logical memory address of the respective logical memory addresses is mapped to a physical address by providing an indication of a memory section of the plurality of independently accessible memory sections and a row address within the memory section.", "label": "18-714655 - Neural network device with configurable shared memory", "leaf_samples": [{"index": 187, "patent_id": "18-714655", "title": "Neural network device with configurable shared memory", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "188", "index": 188, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-809778", "title": "Reduced data representation memory controller and related chiplet sets", "text_preview": "A transform memory controller and method are described herein wherein the transform memory controller comprises logic elements configured to perform desired transform operations on data that flows to-and-from conventional computer memory elements. The transform operations are configured to perform operations on such data without the need for such data to travel to-and-from the conventional computer memory element via the processor (e.g., Central Processing Unit (CPU)) of the computer system. Several desirable transform operations are herein disclosed.", "label": "18-809778 - Reduced data representation memory controller and related chipl...", "leaf_samples": [{"index": 188, "patent_id": "18-809778", "title": "Reduced data representation memory controller and related chiplet sets", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "189", "index": 189, "layer": 0, "node_type": "leaf", "children": [], "parents": ["220"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-916370", "title": "Intelligent exposure of hardware latency statistics within an electronic device or system", "text_preview": "A method includes presenting, by a processing device, in a user interface of a display device, a set of menu items associated with a plurality of criteria and detecting one or more input signals from one or more selections of the set of menu items. The method includes creating a command that includes one or more criteria corresponding to selected options of the plurality of criteria derived from the one or more input signals. The method includes sending, by the processing device, the command to a network adapter device to trigger a polling operation to be performed that causes internal logic of the network adapter device to sample event data associated with a latency of data packets sent by a hardware process that is specific to the one or more criteria.", "label": "18-916370 - Intelligent exposure of hardware latency statistics within an e...", "leaf_samples": [{"index": 189, "patent_id": "18-916370", "title": "Intelligent exposure of hardware latency statistics within an electronic device or system", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "190", "index": 190, "layer": 0, "node_type": "leaf", "children": [], "parents": ["220"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "18-980592", "title": "Memory pool operation method and apparatus", "text_preview": "A memory pool operation method includes that a client provides a first interface, where the first interface includes one or more application programming interfaces (APIs) corresponding to algorithmic logic, and the algorithmic logic is used to convert an operation request sent by an application server into an operation on a memory pool. The client calls the first interface to generate a first operation request, and sends the first operation request to the memory pool, to perform one or more of the following operations on the memory pool based on the first operation request: a remote direct memory access (RDMA) operation, a memory allocation or release operation, and an offloading operation.", "label": "18-980592 - Memory pool operation method and apparatus", "leaf_samples": [{"index": 190, "patent_id": "18-980592", "title": "Memory pool operation method and apparatus", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "191", "index": 191, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2020-0044621", "title": "메모리에서 매크로 연산을 수행하기 위한 기술(technologies for performing macro operations in memory)", "text_preview": "인-메모리 매크로 연산들을 수행하기 위한 기술들은 메모리 매체에 접속된 매체 액세스 회로를 갖는 메모리를 포함한다. 매체 액세스 회로는 다수의 인-메모리 연산의 세트를 나타내는 인-메모리 매크로 연산을 수행하기 위한 요청을 수신한다. 매체 액세스 회로는 또한, 요청에 응답하여, 메모리 매체에 존재하는 데이터에 대해 인-메모리 매크로 연산을 수행한다.", "label": "2020-0044621 - 메모리에서 매크로 연산을 수행하기 위한 기술(technologies for performing macro oper...", "leaf_samples": [{"index": 191, "patent_id": "2020-0044621", "title": "메모리에서 매크로 연산을 수행하기 위한 기술(technologies for performing macro operations in memory)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "192", "index": 192, "layer": 0, "node_type": "leaf", "children": [], "parents": ["218"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2021-0034787", "title": "병렬 프로세서, 병렬 프로세서의 주소 생성기, 그리고 병렬 프로세서를 포함하는 전자 장치(parallel processor, address generator of parallel processor, and electronic device including parallel processor)", "text_preview": "본 발명은 병렬 프로세서에 관한 것이다. 본 발명의 병렬 프로세서는 행들 및 열들로 배열되는 복수의 프로세싱 소자들을 포함하는 프로세싱 소자 어레이, 프로세싱 소자들의 행들에 대응하는 행 메모리들을 포함하는 행 메모리 그룹, 프로세싱 소자들의 열들에 대응하는 열 메모리들을 포함하는 열 메모리 그룹, 그리고 제1 주소 및 제2 주소를 생성하고, 제1 주소를 행 메모리 그룹에 전달하고, 그리고 제2 주소를 열 메모리 그룹에 전달하는 제어기를 포함한다. 제어기는 제1 주소의 생성 방식을 변경함으로써, 서로 다른 형태의 콘볼루션 연산을 지원한다.", "label": "2021-0034787 - 병렬 프로세서, 병렬 프로세서의 주소 생성기, 그리고 병렬 프로세서를 포함하는 전자 장치(parallel proc...", "leaf_samples": [{"index": 192, "patent_id": "2021-0034787", "title": "병렬 프로세서, 병렬 프로세서의 주소 생성기, 그리고 병렬 프로세서를 포함하는 전자 장치(parallel processor, address generator of parallel processor, and electronic device including parallel processor)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "193", "index": 193, "layer": 0, "node_type": "leaf", "children": [], "parents": ["209"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2022-0115796", "title": "하이브리드 데이터베이스 가속 장치, 시스템 및 방법(device, system and method for hybrid database scan acceleration)", "text_preview": "가속기가 개시된다. 하드웨어는 데이터베이스에 대한 쿼리를 처리할 수 있다. 저장소는 데이터베이스에서 쿼리를 처리하는 소프트웨어를 저장할 수 있다. 코디네이터는 데이터베이스에 대한 쿼리의 결과를 생성하기 위해 쿼리에 적어도 부분적으로 기반하여 데이터베이스에 대한 쿼리를 처리하도록 하드웨어 및 소프트웨어를 관리할 수 있다.", "label": "2022-0115796 - 하이브리드 데이터베이스 가속 장치, 시스템 및 방법(device, system and method for hybr...", "leaf_samples": [{"index": 193, "patent_id": "2022-0115796", "title": "하이브리드 데이터베이스 가속 장치, 시스템 및 방법(device, system and method for hybrid database scan acceleration)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "194", "index": 194, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2023-0063492", "title": "연산 방법, 장치, 칩, 전자 기기 및 저장 매체(computing method, apparatus, chips, electronic devices and storage medium)", "text_preview": "본 발명은 컴퓨터 기술 분야에 관한 것으로, 특히 칩 기술 분야, 인공지능 분야에 관한 연산 방법, 장치, 칩, 전자 기기 및 저장 매체를 제공한다. 구현 방식은, 연산 장치에 입력된 제1 벡터의 다수의 제1 부동 소수점 및 제2 벡터의 다수의 제2 부동 소수점에 기반하여, 다수의 제1 부동 소수점에 상응하는 다수의 제1 고정 소수점 및 다수의 제1 지수, 및 다수의 제2 부동 소수점에 상응하는 다수의 제2 고정 소수점 및 다수의 제2 지수를 획득하고; 다수의 제1 고정 소수점 중의 각각의 제1 고정 소수점 및 이에 대응되는 제2 고정 소수점의 고정 소수점 곱셈 값 및 상응하는 고정 소수점 곱 지수를 획득하며; 다수의 고정 소수점 곱셈 값 중의 각각의 고정 소수점 곱셈 값에 상응하는 고정 소수점 곱 지수에 기반하여, 제1 벡터 및 제2 벡터의 고정 소수점 내적 계산 결과를 획득하고; 고정 소수점 내적 계산 결과에 기반하여, 고정 소수점 내적 계산 결과에 대응되는 부동 소수점 데이터 포맷의 부동 소수점 내적 계산 결과를 획득하는 것이다.", "label": "2023-0063492 - 연산 방법, 장치, 칩, 전자 기기 및 저장 매체(computing method, apparatus, chips,...", "leaf_samples": [{"index": 194, "patent_id": "2023-0063492", "title": "연산 방법, 장치, 칩, 전자 기기 및 저장 매체(computing method, apparatus, chips, electronic devices and storage medium)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "195", "index": 195, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2023-0104046", "title": "인공지능 모델을 이용하여 연산을 수행하는 전자 장치 및 전자 장치의 동작 방법(electronic device and operation method of electronic device for performing calculation using artificial intelligence model)", "text_preview": "MAC(multiply and accumulate)연산을 수행하는 전자 장치는 적어도 하나의 MAC 유닛, SRAM(static random access memory), 1개의 8bx8b 연산기, 2개의 8bx4b 연산기, 1개의 4bx4b 연산기, 비트 시프트(bit shift), 덧셈기, 적어도 하나의 누적회로(accumulator),및 프로세서를 포함하고, 프로세서는 12비트(bits)로 구성된 제 1 비트열 데이터 및 제 2 비트열 데이터를 수신하고, 제 1 비트열 데이터를 4개 비트 및 8개 비트로 분류하고, 제 2 비트열 데이터를 4개 비트 및 8개 비트로 분류하며, A8W8(activation 8-bit, weight 8-bit)의 결과를 출력하는 것으로 결정됨에 기반하여 비트 시프터와 제 1 누적회로를 이용하여 A8W8에 대응하는 두 개의 8비트 결과를 출력하고, A12W12(activation 12-bit, weight 12-bit)의 결과를 출력하는 것으로 결정됨에 기반하여 A12W12에 대응하는 1 개의 12비트 결과를 출력할 수 있다.", "label": "2023-0104046 - 인공지능 모델을 이용하여 연산을 수행하는 전자 장치 및 전자 장치의 동작 방법(electronic device a...", "leaf_samples": [{"index": 195, "patent_id": "2023-0104046", "title": "인공지능 모델을 이용하여 연산을 수행하는 전자 장치 및 전자 장치의 동작 방법(electronic device and operation method of electronic device for performing calculation using artificial intelligence model)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "196", "index": 196, "layer": 0, "node_type": "leaf", "children": [], "parents": ["216"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2023-0164326", "title": "뉴럴 프로세서, 이를 포함하는 뉴럴 프로세싱 장치 및 뉴럴 프로세싱 장치의 데이터 통신 모드 결정 방법(neural processor, neural processing device including the same, and method for determining data communication mode of neural processing device)", "text_preview": "본 발명은 뉴럴 프로세싱 장치에 대해 개시한다. 몇몇 실시예에 따른 뉴럴 프로세싱 장치는 제1 동작 주파수 및 상기 제1 동작 주파수와 다른 제2 동작 주파수에서 동작하는 제1 블록, 상기 제1 동작 주파수에서 동작하는 제2 블록 및 상기 제1 블록 및 상기 제2 블록의 데이터 통신을 제어하고, 상기 제1 블록 및 상기 제2 블록 사이의 제1 인터페이스에 대한 제1 데이터 통신 모드를 결정하는 데이터 통신 모드 결정기를 포함한다.", "label": "2023-0164326 - 뉴럴 프로세서, 이를 포함하는 뉴럴 프로세싱 장치 및 뉴럴 프로세싱 장치의 데이터 통신 모드 결정 방법(neura...", "leaf_samples": [{"index": 196, "patent_id": "2023-0164326", "title": "뉴럴 프로세서, 이를 포함하는 뉴럴 프로세싱 장치 및 뉴럴 프로세싱 장치의 데이터 통신 모드 결정 방법(neural processor, neural processing device including the same, and method for determining data communication mode of neural processing device)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "197", "index": 197, "layer": 0, "node_type": "leaf", "children": [], "parents": ["211"], "child_count": 0, "descendant_leaf_count": 1, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AD": 1}, "patent_id": "2023-7024085", "title": "고정 기능 동작들을 사용하는 오프로딩된 명령어들의프로세서-안내된 실행(processor-guided execution of offloaded instructions using fixed function operations)", "text_preview": "고정 기능 동작(fixed function operation)들을 사용하 text_preview": "세 특허 요약은 모두 인공지능/뉴럴 네트워크 처리와 관련된 기술이다. 첫 번째 기술은 뉴럴 네트워크 장치에서 복수의 연산 그룹을 효율적으로 처리하는 방법이다. 입력 피처맵과 커널을 포함하는 연산 그룹 및 각 그룹의 태그 정보를 획득하고, 유휴 상태의 연산 유닛을 찾아 컨벌루션 연산을 수행해 중간 피처맵을 생성한다. 이후 태그 정보에 따라 적절한 후처리 유닛을 결정하고, 중간 피처맵을 이용해 출력 피처맵을 생성한다. 목적은 연산 유닛과 후처리 유닛을 태그 기반으로 할당하여 뉴럴 네트워크 연산을 효율적으로 수행하는 것이다. 두 번째 기술은 사전학습 언어모델을 이용해 자연어 입력 텍스트로부터 지식 그래프를 구축하는 방법이다. 첫 단계에서 입력 텍스트의 엔티티에 대응하는 노드들을 생성하고, 두 번째 단계에서 생성된 노드들을 연결하는 엣지를 생성한다. 목적은 자연어 문장에서 엔티티와 관계 구조를 추출해 지식 그래프를 구성하는 것이다. 세 번째 기술은 뉴럴 네트워크의 가중치를 암호화하여 보호하는 방법이다. 계층별 노드 연결을 나타내는 행렬의 가중치들을 암호화하고, 뉴럴 네트워크 실행이 시작된 것이 감지되면 동일한 암호화 방식으로 가중치를 복호화한다. 목적은 뉴럴 네트워크 모델의 가중치를 보호하면서 실행 시 필요한 연산이 가능하도록 하는 것이다.", "label": "node 203 / layer 1 / leaves 3", "leaf_samples": [{"index": 31, "patent_id": "2018-0160341", "title": "뉴럴 네트워크에서의 부하 균형을 위한 장치 및 방법(method and apparatus for load balancing in neural network)", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 82, "patent_id": "17-811338", "title": "Multi-stage knowledge graph construction using models", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 165, "patent_id": "16-888885", "title": "Systems and methods for protecting neural network weights", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "204", "index": 204, "layer": 1, "node_type": "summary", "children": ["108", "128", "129", "130", "142", "144", "147", "149"], "parents": ["234"], "child_count": 8, "descendant_leaf_count": 8, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 8}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 메모리 내부에서 연산을 수행하는 PIM(Processing-In-Memory) 기술을 중심으로, 호스트-메모리 간 데이터 이동을 줄이고 PIM 명령 처리 효율을 높이는 구조와 방법을 다룬다. 핵심 기술은 메모리 셀 어레이와 센싱 회로를 이용해 비트 벡터 연산, 논리 비트 연산, 팝 카운트 연산 등을 메모리 모듈 내부에서 직접 수행하는 것이다. 호스트는 PIM 제어 구성요소를 통해 가상 주소 해석을 수행하거나, 사이드밴드 채널을 통해 PIM 가능 장치에 연산 명령을 전달한다. 주요 구성 요소는 호스트, 메모리 컨트롤러, PIM 가능 메모리 장치, 메모리 셀 어레이, 센싱 회로, RAS 구성요소 및 RAS 관리자, PIM 명령 큐, 페이지 테이블, 주소 변환 정보, HBM 내 PIM 회로, 일관성 디렉토리 제어기 및 PimPF이다. 메모리 컨트롤러는 PIM 명령과 일반 메모리 명령을 함께 관리하며, 페이지 테이블과 All Bank 항목을 이용해 뱅크 및 열린 행 상태를 추적한다. 일부 기술은 간접 주소 지정을 지원한다. PIM 명령에 주소 변환 정보를 포함시켜 메모리 모듈 내부 로직이 가상 주소를 물리 주소로 변환하고, 연쇄적인 간접 참조를 반복하다가 중지 조건이 충족되면 처리를 종료한다. 또한 HBM과 일반 메모리 모듈이 함께 있는 이종 메모리 시스템에서는 보더 인덱스 값을 이용해 필요한 데이터 어레이를 찾고, 각 물리 주소 공간에 맞는 명령어 세트를 생성한다. 다른 기술은 PIM 연산의 타이밍 및 명령 효율을 개선한다. RAS 관리자는 외부 소스로부터 지시를 받아 RAS 구성요소를 이용한 계산 서브 연산의 순서를 조정한다. 또한 PIM 요청에 대해 버스트 길이를 늘려 페이지 단위 연산을 가능하게 함으로써 메모리 트래픽과 PIM 연산 효율을 개선한다. 효과는 대용량 비트 벡터 데이터를 CPU로 이동시키지 않고 메모리 내부에서 처리함으로써 메모리-CPU 인터페이스의 데이터 전송 부담을 줄이고, 시스템 성능과 에너지 효율을 높이는 것이다. PimPF와 같은 PIM 전용 일관성 디렉토리는 브로드캐스트 PIM 명령이나 다중 뱅크 병렬 PIM 명령 처리 시 캐시 일관성 관리를 가속화하여 PIM 로드 및 저장 연산 성능을 개선한다.", "label": "node 204 / layer 1 / leaves 8", "leaf_samples": [{"index": 108, "patent_id": "15-693378", "title": "Processing in memory", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 128, "patent_id": "17-561406", "title": "Approach for providing indirect addressing in memory modules", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 129, "patent_id": "17-561454", "title": "Approach for managing near-memory processing commands and non-near-memory processing commands in a memory controller", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 130, "patent_id": "17-694184", "title": "Processing in memory implementing vliw controller", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 142, "patent_id": "2015-0136180", "title": "실시간 분석을 지원하는 인-메모리 팝 카운트(in-memory popcount support for real time analytics)", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 144, "patent_id": "2021-0117942", "title": "프로세싱부를 포함하는 이종 메모리 시스템을 억세스하는 데이터 처리 시스템 및 방법(data processing system and method for accessing heterogeneous memory system with processing units)", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 147, "patent_id": "2022-0077390", "title": "프로세싱-인-메모리 컴퓨팅 시스템 및 그의 메모리 컨트롤러(pim computing system and memory title": "", "text_preview": "가속기 코어는 블록 단위로 희소화된 텐서 연산을 처리하기 위한 구조이다. 핵심 구성은 제1 버퍼, 제2 버퍼, 그리고 k개의 처리 요소(PE)로 이루어진 하나 이상의 PE 그룹이다. 제1 버퍼는 k행 c열 크기의 블록 단위 희소화된 제1 요소 그룹을 수신하며, 여기서 k는 2 이상이고 전체 출력 채널 차원 K와 입력 채널 수 C는 각각 k×p, c×q로 표현된다. 제2 버퍼는 제2 요소를 수신한다. 각 PE 그룹은 자신에게 대응되는 제1 요소 블록에서 k개 행의 제1 요소를 받고, 제1 버퍼에서 받은 제1 요소에 대응하는 제2 요소를 함께 수신하여 연산을 수행한다. 이 기술의 목적과 효과는 블록 단위 희소성을 활용해 텐서의 채널 차원에 맞춰 데이터를 버퍼와 PE 그룹에 공급함으로써, 희소화된 데이터에 대한 가속기 연산을 효율적으로 수행하는 데 있다.", "label": "node 206 / layer 1 / leaves 1", "leaf_samples": [{"index": 22, "patent_id": "18-097200", "title": "Dnns acceleration with block-wise n:m structured weight sparsity", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "207", "index": 207, "layer": 1, "node_type": "summary", "children": ["4", "120", "158"], "parents": ["237"], "child_count": 3, "descendant_leaf_count": 3, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1, "AC": 1, "AD": 1}, "patent_id": "", "title": "", "text_preview": "세 특허는 각각 신경망 구현, 동형암호 데이터 처리, SoC 내 NoC 라우팅 효율화를 다룹니다. 첫 번째 기술은 시간분할 다중화 방식의 뉴로시냅틱 모듈에 관한 것이다. 여러 뉴런의 속성과 시간 단계별 입력 발화 이벤트를 유지하고, 각 시간 단계마다 입력 이벤트를 뉴런 속성에 따라 통합한다. 이후 통합 결과를 바탕으로 뉴런 속성을 병렬로 갱신한다. 이를 통해 신경망을 시간분할 방식으로 처리하면서 뉴런 상태 관리와 이벤트 통합을 효율화한다. 두 번째 기술은 동형암호화된 데이터에 대한 메모리 및 입출력 효율적인 연산 기술이다. 클라우드 컴퓨팅 장치가 암호문 블록을 데이터 구조처럼 조작하여, 연산 엔진이 다른 작업을 수행하는 동안 필요한 피연산자를 즉석에서 생성한다. 이를 통해 저장 공간, 네트워크 대역폭, I/O 대역폭 사용량을 크게 줄이는 것을 목적으로 한다. 세 번째 기술은 SoC의 NoC를 통한 트랜잭션 라우팅 구조에 관한 것이다. SoC는 트랜잭션의 목적지 ID를 식별하는 매퍼를 포함하며, NoC의 인그레스 및 이그레스 로직 블록을 통해 하드웨어 요소들이 데이터를 송수신한다. 매퍼는 트랜잭션을 제출한 하드웨어 요소가 목적지 ID를 제공하면 주소 맵 조회를 생략하고 해당 ID를 사용하며, 제공되지 않은 경우 트랜잭션의 주소를 이용해 목적지 ID를 찾는다. 이를 통해 NoC 라우팅 처리의 유연성과 효율을 높인다.", "label": "node 207 / layer 1 / leaves 3", "leaf_samples": [{"index": 4, "patent_id": "16-370570", "title": "Time-division multiplexed neurosynaptic module with implicit memory addressing for implementing a neural network", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 120, 서 한 번에 하나의 칩 또는 칩렛만 고활성 상태가 되도록 로직을 분리해 운용하는 구성이 제시된다. 다른 기술은 암호화폐 채굴 등 분산원장 처리용 ASIC에 관한 것으로, 복수의 해시 다이, 이를 제어하는 제어 다이, 전기적 인터커넥터, 이들을 수용하는 IC 패키지를 포함한다. 제어 다이는 해시 다이보다 큰 공정 노드로 형성되어, 기능별 다이를 분리해 패키지화한다. 또 다른 패키지는 다양한 컴퓨터에 적합한 코어 수 비율을 저비용·고효율로 제공하기 위한 것이다. 각 다이는 CPU 코어 또는 지연시간 중심 코어인 제1 코어와, 가속기 코어 또는 처리량 중심 코어인 제2 코어, 외부 인터페이스, TCI 및 HBM 대응 메모리 인터페이스, 다른 다이와 연결되는 다이 인터페이스를 포함한다. 제1형 다이와 제2형 다이는 모두 두 종류의 코어를 포함하지만 코어 수 비율이 서로 다르다. 효과는 고대역폭·고성능 처리, 다이별 기능 최적화, 다양한 컴퓨팅 요구에 맞는 코어 구성 유연성, 패키지 수준의 비용 효율성 향상이다.", "label": "node 210 / layer 1 / leaves 5", "leaf_samples": [{"index": 79, "patent_id": "17-478843", "title": "3d stack of split graphics processing logic dies", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 87, "patent_id": "18-375138", "title": "Multi-die chiplet-based application specific integrated circuit", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 109, "patent_id": "15-780070", "title": "Die and package", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 125, "patent_id": "17-408323", "title": "Method and apparatus for managing power of ferroelectric or paraelectric logic and cmos based logic", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 170, "patent_id": "17-408251", "title": "Method and apparatus to process an instruction for a distributed logic having tightly coupled accelerator core and processor core in a multi-dimensional packaging", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "211", "index": 211, "layer": 1, "node_type": "summary", "children": ["88", "188", "197"], "parents": ["236"], "child_count": 3, "descendant_leaf_count": 3, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AB": 1, "AD": 2}, "patent_id": "", "title": "", "text_preview": "세 특허는 컴퓨터 시스템의 전원 공급, 메모리 데이터 변환, 명령어 오프로딩 실행을 다룬다. - **핵심 기술** - 컴퓨터 전원공급장치의 DC 출력 커넥터를 측면 패널에 배치해 접근성을 높이는 구조 - 메모리 컨트롤러가 데이터 이동 중 변환 연산을 수행하여 CPU 경유를 줄이는 기술 - 프로세서가 원격 실행 대상 명령어를 순서대로 타깃 디바이스에 오프로드하는 실행 방식 - **목적** - 전원공급장치 출력 연결의 편의성 향상 - 메모리 데이터 처리 시 CPU와 메모리 간 불필요한 왕복 감소 - 프로세싱-인-메모리 장치나 메모리 결합 가속기에서 명령어를 효율적으로 실행 - **구성 요소** - 주전원 입력을 전압 조정된 DC 출력으로 변환하는 인쇄회로기판 조립체, 팬, 인클로저, 후면 패널의 주전원 커넥터, 측면 패널의 DC 출력 커넥터 - 일반 메모리 요소와 연결되어 데이터 흐름에 변환 연산을 적용하는 변환 메모리 컨트롤러 및 논리 요소 - 프로세서, 원격 실행 대상 명령어, 타깃 디바이스, 타깃 레지스터 또는 아키텍처화된 가상 레지스터, 오프로드 요청 - **효과** - 기존 전원공급장치보다 출력 커넥터 접근이 쉬워짐 - CPU를 거치지 않고 메모리 데이터 변환을 수행해 데이터 이동 부담을 줄일 수 있음 - 프로세서가 명령어 수신 순서에 따라 오프로드 요청을 보내 원격 디바이스에서 고정 기능 동작 기반 실행을 지원함", "label": "node 211 / layer 1 / leaves 3", "leaf_samples": [{"index": 88, "patent_id": "18-447263", "title": "Ergonomic and high-performance power supplies for computers", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 188, "patent_id": "18-809778", "title": "Reduced data representation memory controller and related chiplet sets", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}, {"index": 197, "patent_id": "2023-7024085", "title": "고정 기능 동작들을 사용하는 오프로딩된 명령어들의프로세서-안내된 실행(processor-guided execution of offloaded instructions using fixed function operations)", "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합"}]}, {"id": "212", "index": 212, "layer": 1, "node_type": "summary", "children": ["18"], "parents": ["239"], "child_count": 1, "descendant_leaf_count": 1, "category": "AA", "category_name": "AI 코어 및 가속기", "dominant_category": "AA", "category_counts": {"AA": 1}, "patent_id": "", "title": "", "text_preview": "고전 컴퓨터에서 보손 양자비트(qubit)를 시뮬레이션하는 방법에 관한 기술이다. 핵심은 보손 큐비트를 위상공간 표현으로 나타내되, 이를 여러 가우시안 함수의 선형결합으로 구성하는 것이다. 각 가우시안 함수는 평균, 공분산 행렬, 가중 계수로 특징지어지며, 이 값들은 사용자가 정의한 에너지 파라미터와 큐비트 종류에 따라 결정된다. 시뮬레이션 과정에서는 양자 논리 게이트 변환과 측정을 적용하면서 각 가우시안 함수의 가중 계수, 평균, 공분산 행렬을 갱신한다. 이를 통해 실제 양자 시스템 없이도 고전 컴퓨터에서 보손 큐비트의 동작을 모사할 수 있다.", "label": "node 212 / layer 1 / leaves 1", "leaf_samples": [{"index": 18, "patent_id": "17-889900", "title": "System and method of bosonic qubits simulation", "category": "AA", "category_name": "AI 코어 및 가속기"}]}, {"id": "213", "index": 213, "layer": 1, "node_type": "summary", "children": ["50", "53", "74"], "parents": ["233"], "child_count": 3, "descendant_leaf_count": 3, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 3}, "patent_id": "", "title": "", "text_preview": "이 특허 묶음은 반도체 회로 모듈 및 GaN/HEMT 소자의 패키징과 전극 배선 구조 개선에 관한 기술이다. 핵심 기술은 다이 부착 패드 위에 여러 전자 회로 다이를 비전도성 접착제로 실장하고, 다이 상부의 본딩 패드와 본딩 와이어 및 리드 간 연결을 구성하는 것이다. 일부 다이는 상부에서 하부 단자까지 도핑 폴리실리콘이 채워진 트렌치를 형성하여 수직 회로 요소의 단자 연결을 제공하며, 동시에 서로 다른 회로 요소를 절연·분리하는 기능을 수행한다. 또한 GaN 다이에서는 소스와 드레인 스트립이 평행하게 교대로 배치되고, 이에 대응하는 빗살형 소스·드레인 패드와 게이트 패드가 접촉된다. 이 패드는 리드프레임 또는 절연 기판 위의 도전 영역으로 구성될 수 있으며, 다른 반도체 다이를 함께 실장해 정해진 회로 구성을 형성할 수 있다. HEMT와 같은 반도체 소자에서는 맞물린 소스 핑거와 드레인 핑거 사이의 전류 흐름을 공통 게이트로 제어한다. 확장된 소스 핑거 접촉 구조를 통해 대형 소자에서도 소스 전압을 안정적으로 유지하여 불필요한 서브스레시홀드 동작과 스위칭 진동을 줄이고, 빠르고 신뢰성 있는 스위칭을 구현하는 효과가 있다.", "label": "node 213 / layer 1 / leaves 3", "leaf_samples": [{"index": 50, "patent_id": "12-834853", "title": "Multi-chip package module and a doped polysilicon trench for isolation and connection", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 53, "patent_id": "13-188251", "title": "Interdigitated conductive support for gan semiconductor die", "category": "AB", "category_name": "제조 및 패키징"}, {"index": 74, "patent_id": "16-948788", "title": "Lateral transistor with extended source finger contact", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "214", "index": 214, "layer": 1, "node_type": "summary", "children": ["99"], "parents": ["240"], "child_count": 1, "descendant_leaf_count": 1, "category": "AB", "category_name": "제조 및 패키징", "dominant_category": "AB", "category_counts": {"AB": 1}, "patent_id": "", "title": "", "text_preview": "본 기술은 웨이퍼 공정에서 대상 웨이퍼의 최적 위치를 결정하는 방법에 관한 것이다. 대상 웨이퍼의 공정 수율과 관련된 공정 데이터를 획득하고, 이를 바탕으로 기존에 저장된 최적 위치에서 벗어난 이탈 범위를 판단한다. 또한 학습된 인공지능 모델을 이용해 웨이퍼 결함 데이터에 대응하는 척의 유형을 결정하고, 결정된 척 유형과 이탈 범위를 함께 고려하여 대상 웨이퍼의 최적 위치를 산출한다. 이를 통해 웨이퍼별 결함 특성과 공정 데이터를 반영한 위치 보정이 가능해져, 공정 수율 향상 및 위치 결정의 정확도 개선을 기대할 수 있다.", "label": "node 214 / layer 1 / leaves 1", "leaf_samples": [{"index": 99, "patent_id": "2024-0024567", "title": "웨이퍼 최적 위치를 결정하는 방법 및 이를 지원하는 전자 장치(method for determining optimal wafer position and electronic device supporting the same)", "category": "AB", "category_name": "제조 및 패키징"}]}, {"id": "215", "index": 215, "layer": 1, "node_type": "summary", "children": ["19", "140", "177", "186"], "parents": ["229"], "child_count": 4, "descendant_leaf_count": 4, "category": "AD", "category_name": "시스템 연동 및 플랫폼 통합", "dominant_category": "AD", "category_counts": {"AA": 1, "AC": 1, "AD": 2}, "patent_id": "", "title": "", "text_preview": "제시된 특허들은 신경망 및 벡터 연산 기반의 컨볼루션 처리 성능을 높이기 위한 메모리-연산 결합 구조와 VPU/MPU 최적화 기술에 관한 것이다. 핵심 기술은 병목 계층 처리에서 부분 컨볼루션 결과를 활용해 외부 메모리 접근을 줄이고, 연속 병목 계층 간 병렬 처리를 가능하게 하는 것이다. 산술·논리 연산자와 임시 저장소를 동일 데이터 경로에 배치하여 성능과 에너지 효율을 높인다. 구성 요소로는 다수의 메모리 영역과 메모리 블록을 갖는 제1 메모리, 처리 영역, 컴퓨트 코어 그룹, 인접 메모리 블록과 연결된 코어들, 제2 메모리 및 제어 로직을 포함하는 메모리 처리 장치가 제시된다. 또한 VPU에는 min/max 수집기, 자동 저장 조건화, SIMD 레인 간 데이터 공유, 전치 load/store, permute 및 zero insertion load, 다점 lookup 지원, 메모리 뱅크별 load 캐싱, DMA 하드웨어 시퀀서와 분리형 가속기가 포함될 수 있다. 목적은 컨볼루션 및 신경망 처리에서 메모리 병목을 완화하고, 연산 자원 활용률을 높이며, VPU와 DMA의 프로그래밍 복잡도를 낮추는 것이다. 특히 벡터 명령을 이용해 출력 데이터의 연속 요소들을 병렬 계산하고, 다차원 데이터에서는 한 번의 소스 벡터 로드로 여러 출력 벡터를 계산하도록 한다. 효과로는 외부 메모리 접근 감소, 처리량 및 성능 향상, 산술 논리 장치의 활용도 개선, 에너지 효율 증가, 메모리 구조와 코어 수·종류·배치에 대한 설계 유연성 확보가 있다.", "label": "node 215 / layer 1 / leaves 4", "leaf_samples": [{"index": 19, "patent_id": "18-031065", "title": "Methods and apparatuses for bottleneck stages in neural-network processing", "category": "AA", "category_name": "AI 코어 및 가속기"}, {"index": 140, "patent_id": "18-534487", "title": "Core group memory processsing chip design", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}, {"index": 177, "patent_id": "18-064121", "title": "Using a hardware sequencer in a direct memory access system of a system on a chip", "category": "AD", "category_name": "시스템 연동 및 플랫폼
