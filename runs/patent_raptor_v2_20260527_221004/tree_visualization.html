tably coupled to the RAS component. The RAS manager is configured to coordinate timing of a sequence of compute sub-operations performed using the RAS component. The apparatus also includes a source external to the PIM capable device. The RAS manager is configured to receive instructions from the source to control timing of performance of a compute operation using the sensing circuitry.", "label": "17-694184 - Processing in memory implementing vliw controller", "leaf_samples": [{"index": 130, "patent_id": "17-694184", "title": "Processing in memory implementing vliw controller", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "131", "index": 131, "layer": 0, "node_type": "leaf", "children": [], "parents": ["218"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-747491", "title": "Neuromorphic device and electronic device including the same", "text_preview": "A neuromorphic device includes a plurality of cell tiles including a cell array including a plurality of memory cells storing a weight of a neural network, a row driver connected to the plurality of memory cells, and cell analog-digital converters connected to the plurality of memory cells and converting cell currents into a plurality of pieces of digital cell data, a reference tile including a plurality of reference cells, a reference row driver connected to the plurality of reference cells, and reference analog-digital converters connected to the plurality of reference cells and converting reference currents read via the plurality of reference column lines into a plurality of pieces of digital reference data, and a comparator circuit configured to compare the plurality of pieces of digital cell data with the plurality of pieces of digital reference data, respectively.", "label": "17-747491 - Neuromorphic device and electronic device including the same", "leaf_samples": [{"index": 131, "patent_id": "17-747491", "title": "Neuromorphic device and electronic device including the same", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "132", "index": 132, "layer": 0, "node_type": "leaf", "children": [], "parents": ["205"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-830981", "title": "Signal routing between memory die and logic die", "text_preview": "A memory device includes a memory die bonded to a logic die via a wafer-on-wafer bond. A controller of the memory device that is coupled to the memory die can activate a row of the memory die. Responsive to activating the row, a sense amplifier stripe of the memory die can latch a first plurality of signals. A transceiver can route a second plurality of signals from the sense amplifier stripe to the logic die.", "label": "17-830981 - Signal routing between memory die and logic die", "leaf_samples": [{"index": 132, "patent_id": "17-830981", "title": "Signal routing between memory die and logic die", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "133", "index": 133, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-850517", "title": "Implementation of pooling and unpooling or reverse pooling in hardware", "text_preview": "A mechanism for processing, on a hardware accelerator comprising fixed-function circuitry, data according to a neural network process that includes a pooling, unpooling or backward pooling and/or binary argmax/argmin function. The function is mapped to a set of elementary neural network operations available to the fixed-function circuitry. The neural network process is then executed using the fixed-function circuitry. The data processed using the neural network process comprises image and/or audio data.", "label": "17-850517 - Implementation of pooling and unpooling or reverse pooling in h...", "leaf_samples": [{"index": 133, "patent_id": "17-850517", "title": "Implementation of pooling and unpooling or reverse pooling in hardware", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "134", "index": 134, "layer": 0, "node_type": "leaf", "children": [], "parents": ["220"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "17-986623", "title": "Allocation of resources when processing at memory level through memory request scheduling", "text_preview": "An apparatus includes a memory controller that includes logic to receive a first memory request having a first request type and a second memory request having a second request type. The apparatus also includes a scheduling unit that includes logic to schedule an order of the first and second memory requests for execution based upon a first parameter value and a second parameter value. The first parameter value corresponds to a utility and energy cost for the first memory request and the second parameter value corresponds to a utility and energy cost for the second memory request.", "label": "17-986623 - Allocation of resources when processing at memory level through...", "leaf_samples": [{"index": 134, "patent_id": "17-986623", "title": "Allocation of resources when processing at memory level through memory request scheduling", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "135", "index": 135, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "18-105442", "title": "Apparatuses and methods for logic/memory devices", "text_preview": "Apparatuses and methods are provided for logic/memory devices. An example apparatus comprises a plurality of memory components adjacent to and coupled to one another. A logic component is coupled to the plurality of memory components. At least one memory component comprises a memory device having an array of memory cells and sensing circuitry coupled to the array. The sensing circuitry includes a sense amplifier and a compute component. Timing circuitry is coupled to the array and sensing circuitry and configured to control timing of operations for the sensing circuitry. The logic component comprises control logic coupled to the timing circuitry. The control logic is configured to execute instructions to cause the sensing circuitry to perform the operations.", "label": "18-105442 - Apparatuses and methods for logic/memory devices", "leaf_samples": [{"index": 135, "patent_id": "18-105442", "title": "Apparatuses and methods for logic/memory devices", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "136", "index": 136, "layer": 0, "node_type": "leaf", "children": [], "parents": ["209"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "18-170753", "title": "Memory systems including examples of calculating hamming distances for neural network and data center applications", "text_preview": "Examples of systems and method described herein provide for the processing of image codes (e.g., a binary embedding) at a memory system including a Hamming processing unit. Such images codes may generated by various endpoint computing devices, such as Internet of Things (IoT) computing devices, Such devices can generate a Hamming processing request, having an image code of the image, to compare that representation of the image to other images (e.g., in an image dataset) to identify a match or a set of neural network results. Advantageously, examples described herein may be used in neural networks to facilitate the processing of datasets, so as to increase the rate and amount of processing of such datasets. For example, comparisons of image codes can be performed “closer” to the memory devices, e.g., at a processing unit having memory devices.", "label": "18-170753 - Memory systems including examples of calculating hamming distan...", "leaf_samples": [{"index": 136, "patent_id": "18-170753", "title": "Memory systems including examples of calculating hamming distances for neural network and data center applications", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "137", "index": 137, "layer": 0, "node_type": "leaf", "children": [], "parents": ["228"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "18-173242", "title": "Degradation-aware training scheme for reliable memristor deep learning accelerator design", "text_preview": "A method, a system, and computer program product for degradation-aware training of neural networks are provided. A degradation of degraded memory cells of a memory array is detected, during a training of a neural network. A first set of writing parameter values to be applied to the one or more degraded memory cells and a second set of writing parameter values to be applied to the undegraded memory cells is determined using a model of the memory array tuned to account for the degradation of one or more memory cells. A writing operation is executed, by applying the first set of writing parameter values to the one or more degraded memory cells to compensate for the degradation of the one or more degraded memory cells and by applying the second set of writing parameter values to the undegraded memory cell.", "label": "18-173242 - Degradation-aware training scheme for reliable memristor deep l...", "leaf_samples": [{"index": 137, "patent_id": "18-173242", "title": "Degradation-aware training scheme for reliable memristor deep learning accelerator design", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "138", "index": 138, "layer": 0, "node_type": "leaf", "children": [], "parents": ["227"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "18-414782", "title": "Energy efficient computations of attention-based inferences", "text_preview": "An apparatus to compute an attention matrix implementing an attention mechanism in artificial neural networks, having: memory to store key value pairs; a reorder buffer to provide a reordered list of keys from the key value pairs; an analog dot product accelerator configured to compute dot products of key elements of keys from the reordered list of keys with respective query elements of a query row of a query matrix; a processing device configured to generate, based on results of the dot products, a row of attention scores corresponding to the query row of the query matrix for the reordered list of keys; and a further accelerator configured to compute dot products of segments of the attention scores with value elements of respective segments of values from a list of values from the key value pairs to generate an attention matrix.", "label": "18-414782 - Energy efficient computations of attention-based inferences", "leaf_samples": [{"index": 138, "patent_id": "18-414782", "title": "Energy efficient computations of attention-based inferences", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "139", "index": 139, "layer": 0, "node_type": "leaf", "children": [], "parents": ["218"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "18-515565", "title": "Memory device for processing in memory and operating method of memory device", "text_preview": "Disclosed is a memory device which includes a plurality of memory chips. Each of the plurality of memory chips includes a plurality of memory banks and a logic circuit. In a first operation mode, the logic circuit writes first data in the plurality of memory banks based on a first command and a first address received from the host, and performs a first processing-in-memory (PIM) operation based on third data received from the host and the first data. In a second operation mode, the logic circuit writes second data in the plurality of memory banks based on the first command and the first address received from the host, and performs a second PIM operation based on fourth data different from the third data received from the host and the second data.", "label": "18-515565 - Memory device for processing in memory and operating method of ...", "leaf_samples": [{"index": 139, "patent_id": "18-515565", "title": "Memory device for processing in memory and operating method of memory device", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "140", "index": 140, "layer": 0, "node_type": "leaf", "children": [], "parents": ["215"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "18-534487", "title": "Core group memory processsing chip design", "text_preview": "A memory processing unit (MPU) can include a first memory, a second memory, a plurality of processing regions and control logic. The first memory can include a plurality of memory regions. The plurality of memory regions can be organized in a plurality of memory blocks. The plurality of processing regions can be interleaved between the plurality of processing regions of the first memory. The plurality of processing regions can be organized in a plurality of core groups include a plurality of compute cores. The compute groups in the processing regions can be coupled to a plurality of adjacent memory blocks in the adjacent memory regions. The second memory can be coupled to the plurality of processing regions. The memory processing architectures can advantageously enable the design selection of the number of processing regions, the number of groups of compute cores, the number of compute cores, the number of compute clusters, the types of compute cores, the organization of memories, the types of memories, the size of the memories, the number of memory regions, the number of memory blocks and the like.", "label": "18-534487 - Core group memory processsing chip design", "leaf_samples": [{"index": 140, "patent_id": "18-534487", "title": "Core group memory processsing chip design", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "141", "index": 141, "layer": 0, "node_type": "leaf", "children": [], "parents": ["225"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "18-747118", "title": "Optimally balanced network systems", "text_preview": "In an aspect, a system for an optimally balanced networked system is disclosed. The system includes a fabric adapter communication system communicatively coupled to a plurality of network ports and a plurality of controlling hosts. The fabric adapter communication system is configured to receive a network packet from, or transmit a network packet to, a network port of the plurality of network ports. The fabric adapter communication system is configured to separate the network packet into different portions, each portion including a header or a payload. The fabric adapter communication system is configured to forward the headers of the different portions to one or more controlling hosts. The fabric adapter communication system is configured to forward multiple payloads of the different portions in parallel through a bundled interface to multiple memory buffers of a global memory pool based on one or more scatter gather lists (SGLs).", "label": "18-747118 - Optimally balanced network systems", "leaf_samples": [{"index": 141, "patent_id": "18-747118", "title": "Optimally balanced network systems", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "142", "index": 142, "layer": 0, "node_type": "leaf", "children": [], "parents": ["204"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "2015-0136180", "title": "실시간 분석을 지원하는 인-메모리 팝 카운트(in-memory popcount support for real time analytics)", "text_preview": "팝 카운트 연산 및 논리 비트 연산과 관련된 프로세싱-인-메모리(PIM, Processing-In-Memory) 모델은 메모리 모듈 내에서 실행되며, 호스트 CPU에서 실행되지 않는다. 따라서 인-메모리 실행은 큰 비트 벡터들로부터 데이터를 이송할 필요가 없다. 이러한 연산들의 처리의 부담을 메모리로 내려 놓음으로써, 메모리-CPU 인터페이스의 부수적인 데이터 전송이 크게 감소하며, 이로써 시스템 성능 및 에너지 효율이 개선된다. 메모리 모듈 내의 로직 다이 내의 컨트롤러 및 레지스터는 호스트와 인터페이스하며, 호스트에 의하여 요청된 팝 카운트 및 논리 비트 연산에 대한 인-메모리 실행을 제공한다. 따라서 본 출원의 기술적 사상에 따른 PIM 모델은 실시간 분석 등의 작업을 PIM 모델이 지원되는 메모리 내에서 실행되도록 함으로써 CPU가 처리하는 작업 부담을 경감시킬 수 있다. 메모리 모듈은 3DS 메모리 또는 다른 반도체 메모리일 것이다.", "label": "2015-0136180 - 실시간 분석을 지원하는 인-메모리 팝 카운트(in-memory popcount support for real ti...", "leaf_samples": [{"index": 142, "patent_id": "2015-0136180", "title": "실시간 분석을 지원하는 인-메모리 팝 카운트(in-memory popcount support for real time analytics)", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "143", "index": 143, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "2020-0112495", "title": "메모리 장치, 그것을 포함하는 메모리 시스템, 그것을 제어하는 제어기 및 그것의 동작 방법(memory device, memory system having the same, controller for controlling the same, and operating methed thereof)", "text_preview": "본 발명에 따른 메모리 장치는, 외부 장치로부터 제어 ": "145", "index": 145, "layer": 0, "node_type": "leaf", "children": [], "parents": ["221"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "2021-7039428", "title": "확장 메모리 인터페이스(확장 메모리 인터페이스)", "text_preview": "본 발명은 확장 메모리 연산을 수행하기 위한 확장 메모리 통신 서브시스템과 관련된 시스템, 장치 및 방법에 관한 것이다. 예시적인 장치는 서로 결합된 복수의 컴퓨팅 디바이스를 포함할 수 있다. 복수의 컴퓨팅 디바이스 각각은 데이터 블록의 수신에 응답하여 데이터 블록에 대한 연산을 수행하도록 구성된 프로세싱 유닛을 포함할 수 있다. 복수의 컴퓨팅 디바이스 각각은 프로세싱 유닛에 대한 캐시로 구성된 메모리 어레이를 더 포함할 수 있다. 예시적인 장치는 장치 내에서 복수의 컴퓨팅 디바이스 및 제어기와 결합되는 제1 통신 서브시스템을 포함하며, 제1 통신 서브시스템은 데이터 블록을 요청하도록 구성된다. 예시적인 장치는 장치 내에서 복수의 컴퓨팅 디바이스와 제어기에 결합되는 제2 통신 서브시스템을 더 포함할 수 있다. 제2 통신 서브시스템은 데이터 블록을 제1 제어기로부터 복수의 컴퓨팅 디바이스 중 적어도 하나로 전송하도록 구성될 수 있다.", "label": "2021-7039428 - 확장 메모리 인터페이스(확장 메모리 인터페이스)", "leaf_samples": [{"index": 145, "patent_id": "2021-7039428", "title": "확장 메모리 인터페이스(확장 메모리 인터페이스)", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "146", "index": 146, "layer": 0, "node_type": "leaf", "children": [], "parents": ["216"], "child_count": 0, "descendant_leaf_count": 1, "category": "AC", "category_name": "시스템 통합 및 데이터 관리", "dominant_category": "AC", "category_counts": {"AC": 1}, "patent_id": "2022-0031987", "title": "적층형 반도체 장치(stacked memory device)", "text_preview": "적층형 반도체 장치는, 제 1 의사 채널 및 제 2 의사 채널을 각각 포함하는 다수의 채널들; 및 상기 제 1 의사 채널 또는 상기 제 2 의사 채널을 지정하는 채널 지정 신호(PC_ASS) 및 대응하는 채널의 위치 정보 신호(LOCATE_F)에 따라 채널 커맨드를 출력하고, 상기 채널 커맨드에 따라 상기 대응하는 채널과 하부 칩 사이에서 제 1 및 제 2 데이터 워드를 송수신하는 각 전달 제어 회로를 포함하는 다수의 전달 제어 회로들을 포함하는 상부 칩을 포함할 수 있다.", "label": "2022-0031987 - 적층형 반도체 장치(stacked memory device)", "leaf_samples": [{"index": 146, "patent_id": "2022-0031987", "title": "적층형 반도체 장치(stacked memory device)", "category": "AC", "category_name": "시스템 통합 및 데이터 관리"}]}, {"id": "147", "index": 147, "layer": 0, "node_type": "leaf", "children": [], "parents": ["204"], "child_count": 0, "descendant_leaf_count":
